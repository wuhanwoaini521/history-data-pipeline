  - {id: economic, name_zh_cn: 经济, description_zh_cn: 币制、税制、贸易等经济事件。}
  - {id: cultural, name_zh_cn: 文化, description_zh_cn: 典籍、思想、艺术、教育等文化事件。}
  - {id: disaster, name_zh_cn: 灾害, description_zh_cn: 天灾、瘟疫、饥荒。}
  - {id: migration, name_zh_cn: 迁徙, description_zh_cn: 人口/民族/政权重心的大规模迁徙。}
  - {id: foundation, name_zh_cn: 建立, description_zh_cn: 机构、都城、政权的建立。}
  - {id: other, name_zh_cn: 其他, description_zh_cn: 未落入上述类型的事件节点。}