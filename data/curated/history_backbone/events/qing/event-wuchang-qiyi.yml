background_zh_cn: 宣统三年（1911 年）10 月 10 日，湖北新军中的革命党人在武昌发动起义，攻占湖广总督衙门，成立湖北军政府；随后各省相继宣告独立（响应），清朝统治迅速瓦解。
result_zh_cn: 宣统三年（1911 年）10 月 10 日，湖北新军中的革命党人在武昌发动起义，攻占湖广总督衙门，成立湖北军政府；随后各省相继宣告独立（响应），清朝统治迅速瓦解。
process_zh_cn: 宣统三年八月甲寅，革命党谋乱于武昌事觉，捕三十二人；乙卯，武昌新军变附于革命党，总督瑞澂弃城走，遂陷武昌；丙辰，武昌军民拥陆军第二十一混成协统领官黎元洪称都督，置军政府。
impact_zh_cn: 「嗣是行省各拥兵据地号独立，举为魁者皆称都督」——武昌首义后各省相继独立；清廷起用袁世凯为湖广总督、督办剿抚，并命陆军大臣荫昌督师往讨，然大势已去。
