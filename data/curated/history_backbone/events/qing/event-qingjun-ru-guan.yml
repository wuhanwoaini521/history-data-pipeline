background_zh_cn: 癸巳，明廷封总兵官吴三桂、左良玉、唐通、黄得功俱为伯——危急之秋倚重边将，山海关之得失系于三桂。
result_zh_cn: 五月，大清兵入京师。
process_zh_cn: 是年夏四月，我大清兵破贼于山海关。
impact_zh_cn: 入京师后以帝体改葬、令臣民为服丧三日，谥曰庄烈愍皇帝、陵曰思陵——清朝以「为明复仇」的名义入主中原，中国历史进入清朝时期。
