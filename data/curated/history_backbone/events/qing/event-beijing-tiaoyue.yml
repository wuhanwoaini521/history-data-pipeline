summary_zh_cn: 咸丰十年（1860 年）9 月，英法联军攻陷通州后进逼北京，咸丰帝北逃热河，联军于 10 月 18 日焚毁圆明园等园林（属历史事实，中外记载一致）；清廷被迫签订《北京条约》：增开天津为口岸、割九龙司地方一区、赔款等，第二次鸦片战争结束。
