summary_zh_cn: 同治三年（1864 年）7 月，曾国藩弟曾国荃率湘军攻陷天京，天王府被焚，洪秀全已病亡，幼天王等突围后被俘，太平天国主要政权结束（余部转战至 1868 年捻军覆亡）。
