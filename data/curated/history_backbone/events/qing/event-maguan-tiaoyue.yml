summary_zh_cn: 光绪二十一年（1895 年）4 月，李鸿章赴日签订《马关条约》：中国割让台湾、澎湖与辽东半岛（后三国干涉还辽，改由清政府加银赎回），赔款二亿两白银，增开沙市、重庆、苏州、杭州为商埠并允许设厂；甲午战败震动全国，维新思潮兴起。
