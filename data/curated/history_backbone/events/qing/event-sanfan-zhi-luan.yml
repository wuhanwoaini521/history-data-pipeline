background_zh_cn: 康熙十二年至二十年（1673—1681 年），吴三桂等三藩举兵反清，一度控制南方大部；康熙帝力主平叛，历时八年，康熙二十年（1681 年）清军攻入昆明，三藩之乱平定，清朝完成统一。
result_zh_cn: 康熙十二年至二十年（1673—1681 年），吴三桂等三藩举兵反清，一度控制南方大部；康熙帝力主平叛，历时八年，康熙二十年（1681 年）清军攻入昆明，三藩之乱平定，清朝完成统一。
process_zh_cn: 三桂反问至京师，清廷即日遣前锋统领硕岱驰镇荆州，命顺承郡王勒尔锦为宁南靖寇大将军率师讨三桂，并停撤平南、靖南二藩；三桂兵陷清浪卫、辰州。
impact_zh_cn: 康熙十九年春清军全面反攻：赵良栋克成都、王进宝取汉中，王屏藩自杀，重庆、辰州相继下；次年进围云南会城，世璠诸将先后降，临安、姚安、大理、鹤庆、丽江诸府悉下——三藩之乱走向终结。
