summary_zh_cn: 道光二十年至二十二年（1840—1842 年），英国因对华鸦片贸易与通商问题发动战争，先后攻陷定海、吴淞等地，进逼南京；清军在广东（林则徐）与东南沿海多处抵抗失利，1842 年 8 月清廷接受英国条件，战争以《南京条约》签订结束。
