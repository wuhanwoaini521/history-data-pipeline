background_zh_cn: 道光二十年至二十二年（1840—1842 年），英国因对华鸦片贸易与通商问题发动战争，先后攻陷定海、吴淞等地，进逼南京；清军在广东（林则徐）与东南沿海多处抵抗失利，1842 年 8 月清廷接受英国条件，战争以《南京条约》签订结束。
result_zh_cn: 道光二十年至二十二年（1840—1842 年），英国因对华鸦片贸易与通商问题发动战争，先后攻陷定海、吴淞等地，进逼南京；清军在广东（林则徐）与东南沿海多处抵抗失利，1842 年 8 月清廷接受英国条件，战争以《南京条约》签订结束。
process_zh_cn: 道光二十一年正月，英人寇广东虎门，副将陈连陞父子死之，虎门陷；清廷命奕山为靖逆将军督办广东海防，命讷尔经额驻天津督办海防。
impact_zh_cn: 战争进程中林则徐、邓廷桢被遣戍伊犁，琦善逮问论斩——战后清廷将战败归咎主战与主和官员；道光二十二年七月英船寇江宁省城，耆英等与英方定约钤用御宝，是为江宁条约。
