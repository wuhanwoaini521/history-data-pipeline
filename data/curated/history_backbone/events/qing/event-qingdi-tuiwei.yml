background_zh_cn: 1912 年 1 月中旬起，南北议和（袁世凯、伍廷芳等）达成协议，以清帝退位换取袁世凯出任临时大总统；1912 年 2 月 12 日宣统帝溥仪下诏退位，清朝结束，中国两千余年的帝制时代（国内史学通行表述）随之终结。
result_zh_cn: 1912 年 1 月中旬起，南北议和（袁世凯、伍廷芳等）达成协议，以清帝退位换取袁世凯出任临时大总统；1912 年 2 月 12 日宣统帝溥仪下诏退位，清朝结束，中国两千余年的帝制时代（国内史学通行表述）随之终结。
process_zh_cn: 十二月己酉，皇太后懿旨授袁世凯全权与民军商酌条件奏闻；时岑春煊、袁树勋、陆徵祥、段祺瑞等请速定共和团体以免生灵涂炭，故不俟国会召集，决定自让政权。
impact_zh_cn: 退位诏宣示：民军所开优礼条件——宗庙陵寝永远奉祀、先皇陵制如旧妥修——均已一律担承，「皇帝但卸政权，不废尊号」，并议定优待皇室八条、待遇皇族四条、待遇满蒙回藏七条；随后逊位。史论谓「大变既起，遽谢政权，天下为公，永存优待，遂开千古未有之奇」。
