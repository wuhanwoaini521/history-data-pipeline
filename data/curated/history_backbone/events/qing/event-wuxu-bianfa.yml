importance: major
summary_zh_cn: 光绪二十四年（1898 年），光绪帝采纳康有为等维新派主张，6 月 11 日下诏定国是，先后颁行废八股、设学堂、改官制、练兵等新政百余日（史称百日维新）；9 月 21 日慈禧太后发动政变，幽禁光绪帝，诛杀谭嗣同等"戊戌六君子"，康梁出亡，新政罢废。
quality_status: reviewed
