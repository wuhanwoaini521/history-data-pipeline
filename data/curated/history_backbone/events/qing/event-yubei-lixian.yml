summary_zh_cn: 光绪三十二年至宣统三年（1906—1911 年），清廷宣布"仿行宪政"：改设资政院与各省咨议局（1909—1910 年），宣布九年预备立宪（后缩短年限），1911 年成立"皇族内阁"；预备立宪进程缓慢且皇族集权，促使立宪派倒向革命。
