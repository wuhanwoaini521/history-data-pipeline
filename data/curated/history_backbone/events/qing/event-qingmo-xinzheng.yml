summary_zh_cn: 光绪二十七年至三十一年（1901—1905 年），清廷在八国联军之役后推行新政：设督办政务处、改革官制、练新军、办学堂、废科举、派留学生、设商部等，为清末预备立宪前的系统改革；新政扩大社会流动与舆论空间，客观上催生革命与立宪两派力量。
