summary_zh_cn: 永历十五年（1661 年），郑成功率军自金厦渡海攻台湾，围困荷兰殖民者据守的热兰遮城，1662 年荷兰人投降，台湾纳入明郑政权统治；郑成功同年病逝，其子郑经继领台湾。
