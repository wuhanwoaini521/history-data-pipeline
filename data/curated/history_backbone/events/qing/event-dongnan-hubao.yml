summary_zh_cn: 光绪二十六年（1900 年），八国联军战争期间，两江总督刘坤一、湖广总督张之洞等与各国驻沪领事达成《东南保护约款》，长江流域督抚不与联军作战、维护地方秩序（东南互保）；反映清廷中央权威在地方督抚实力上升背景下的松动。
