summary_zh_cn: 至元四年至十三年（1267—1276 年），忽必烈在金中都旧城东北营建新城，至元九年（1272 年）命曰大都，至元十三年城成；大都（今北京）自此成为元朝都城，直至 1368 年明军攻克。
