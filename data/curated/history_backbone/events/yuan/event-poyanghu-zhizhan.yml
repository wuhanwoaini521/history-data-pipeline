background_zh_cn: 友谅兵号六十万，联巨舟为阵，楼橹高十余丈、绵亘数十里，旌旗戈盾望之如山——陈汉倾国而来。
result_zh_cn: 友谅兵大乱，诸将鼓噪乘之，斩首二千余级，焚溺死者无算，友谅气夺。
process_zh_cn: 会日晡，大风起东北，乃命敢死士操七舟、实火药芦苇中，纵火焚友谅舟。
impact_zh_cn: 太祖论之曰「友谅亡，天下不难定也」——鄱阳湖一战定江南归属，帝业由此奠基。
