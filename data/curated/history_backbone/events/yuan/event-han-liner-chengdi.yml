  description_zh_cn: 红巾军建立的政权性组织。
background_zh_cn: 至正十五年，刘福通等访求韩山童之子林儿于砀山，迎立之于亳，国号宋，建元龙凤，中原红巾诸部奉之为共主；韩山童先以白莲教聚众起事而被害，林儿承其名号，宋室复兴之说遂为号召，北方红巾由是统于龙凤之帜。
process_zh_cn: 龙凤政权初都亳州，至正十七年刘福通破汴梁，迎韩林儿都之，以为宋室旧都；然红巾诸部不相统属，至正十九年秋八月，元察罕帖木儿复汴梁，福通以林儿退保安丰。太祖初起，念林儿势盛可倚藉，乃用其年号以令军中，龙凤正朔行于江南。
result_zh_cn: 至正二十三年三月，张士诚将吕珍攻安丰，太祖自将救之，珍败走，以韩林儿归滁州，乃还应天；龙凤政权名存实亡，林儿徒拥虚号而无所统，至正二十六年十二月，韩林儿卒——宋之号遂绝，太祖亦不复用龙凤年号。
impact_zh_cn: 韩林儿之宋为元末红巾之共名，太祖始奉龙凤而后自成：其兴也以白莲之众，其亡也以群雄相攻，龙凤年号之废为太祖建号吴、进而定鼎金陵之先声，元末群雄由「复宋」之名归于一统之实，鼎革之局于此可见。
