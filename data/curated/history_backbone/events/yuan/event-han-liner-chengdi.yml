summary_zh_cn: 至正十五年（1355 年），刘福通迎立韩山童之子韩林儿在亳州称帝，国号大宋，年号龙凤，史称小明王；各地红巾（包括朱元璋部）名义上奉其正朔，龙凤政权后期名存实亡（1366 年韩林儿卒）。
quality_status: reviewed
