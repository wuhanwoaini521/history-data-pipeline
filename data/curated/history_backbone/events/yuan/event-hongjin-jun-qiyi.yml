importance: major
summary_zh_cn: 至正十一年（1351 年），白莲教首领韩山童、刘福通等以"明王出世、弥勒降生"为号召在颍州（今安徽阜阳）起兵，以红巾为号，史称红巾军；同年徐寿辉（蕲黄）、郭子兴（濠州）等相继起兵，元末农民战争全面爆发。
