background_zh_cn: 至正初脱脱为中书右丞相，悉更伯颜旧政，复科举、蠲负逋，中外翕然称为贤相；然河患连年，至正二年于都城外开河置闸役丁夫数万讫无成功。时民间白莲教盛行，颍上之寇「始结白莲，以佛法诱众，终饰威权，以兵抗拒」——教门与民怨相结，遂为起事之资。
process_zh_cn: 至正十一年（1351年），颍州以贼反告，时车驾在上都，朝堂皆犹豫未决，欲驿奏以待命；已而汝、颍之间妖寇聚众反，以红巾为号，襄、樊、唐、邓皆起而应之。至正十四年，河南贼芝麻李据徐州，太师脱脱南征，用也速之计以巨石为炮昼夜攻之，贼困莫能支，遁走。然红巾之众散而复聚，刘福通等转战中原，元军讨之屡失利：答失八都鲁与刘福通野战为其所败，将士奔溃。
result_zh_cn: 红巾既起，所在兵起势相联结：安丰贼刘福通等陷汴梁，造宫阙，易正朔，号召群盗，「巴蜀、荆楚、江淮、齐鲁、辽海，西至甘肃」皆乱；元廷遣知院达理麻失理来援，分兵雷泽、濮州，而达理麻失理为刘福通所杀，达达诸军皆溃——元之兵威自此不振。
impact_zh_cn: 元末论者谓「颍上之寇，始结白莲，以佛法诱众，终饰威权，以兵抗拒」，其势不至于亡社稷、烬国家不已：红巾起事十数年间，元之兵威屡折于刘福通辈，而朱元璋、陈友谅、张士诚皆自群雄中出，元末鼎革之局实肇于汝颍之一呼。
