background_zh_cn: 至正初脱脱复相，中外翕然称为贤相；然河患积年，至正二年尝于都城外开河置闸、放金口水，欲引通州船至丽正门，役丁夫数万而讫无成功。元末论治河者谓「自古治河，处得其当，则用力少而患迟；事失其宜，则用力多而患速」，河事之难为朝野所共知。
process_zh_cn: 至正十一年（1351年），元廷决意大举治河，开黄河故道、塞决口，役丁夫以兴工；工既毕，天子嘉其功，赐世袭答剌罕之号，又敕儒臣欧阳玄制《河平碑》以载其功，仍赐淮安路为其食邑。（按：元史语料无河渠志与顺帝纪，一期工程之役夫数目与贾鲁之名据《元史·河渠志》后世补记，本事件以「河平碑」与红巾起事为锚。）
result_zh_cn: 河工之役与民力相弊：已而汝、颍之间妖寇聚众反，以红巾为号，襄、樊、唐、邓皆起而应之；至正十一年颍州以贼反告，时车驾在上都，朝堂皆犹豫未决，欲驿奏以待命——治河之众散而为乱，元末大乱自此不可制。
impact_zh_cn: 贾鲁治河为元代最后一次大规模河工，塞决、开故道于一时有功，河平之碑立于朝；然役重民困，河工之丁夫与白莲之众相合，遂为亡元之祸首——颍上之寇「其势不至于亡吾社稷、烬吾国家不已也」，论者以治河为元亡之近因。
