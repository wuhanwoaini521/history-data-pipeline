summary_zh_cn: 中统三年至至元十九年（1262—1282 年），阿合马长期主持理财（盐铁榷算、钩考钱谷等），扩充财政收入，遭儒臣集团批评，至元十九年（1282 年）阿合马在宫廷政变中被刺杀，理财政策随即调整。
