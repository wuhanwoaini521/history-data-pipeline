summary_zh_cn: 至元八年（1271 年）十一月，忽必烈采纳刘秉忠等建议，取《易经》"大哉乾元"之义改国号为"大元"；大蒙古国（1206—1271，regime-mongol-empire）至此以"元"为国号，1279 年灭南宋后成为统治全中国的王朝。
