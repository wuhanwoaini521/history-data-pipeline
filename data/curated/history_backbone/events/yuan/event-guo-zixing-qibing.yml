background_zh_cn: 元末汝颍红巾既起，江淮响应；至正十二年春二月，定远人郭子兴与其党孙德崖等起兵濠州，据城自守。子兴为人任侠喜宾客，马公素善子兴，临卒以后托之，子兴育之如己女，是为后来之马皇后——太祖之姻缘与基业皆系于濠州一旅。
process_zh_cn: 太祖时在皇觉寺为僧，卜之吉，遂以闰三月甲戌朔入濠见子兴；子兴奇其状貌，留为亲兵，战辄胜，遂妻以所抚马公女。时彭、赵所部暴横，子兴弱，太祖度无足与共事，乃以兵属他将，独与徐达、汤和、费聚等南略定远；子兴与孙德崖龃龉，太祖屡调护之。至正十五年正月，子兴用太祖计，遣张天祐等拔和州，檄太祖总其军；三月，郭子兴卒。
result_zh_cn: 子兴既卒，其部曲渐归太祖：九月郭天叙、张天祐攻集庆，野先叛，二人皆战死，「于是子兴部将尽归太祖矣」——太祖遂尽有濠州旧部，兼徐达、汤和诸将于麾下，为渡江取太平、克集庆之本，明年遂定金陵，开国立业之基皆肇于此。
impact_zh_cn: 郭子兴濠州起兵为明太祖创业所自始：太祖自亲兵而总其军，再进而尽统濠州部众，徐达、汤和等皆自此从龙，明代开国将帅之基实立于此；子兴虽中道而卒，明兴之后犹追念其旧恩（马皇后之德亦系焉）。
