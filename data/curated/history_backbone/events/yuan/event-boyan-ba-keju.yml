summary_zh_cn: 元统元年至至元六年（1333—1340 年），权臣伯颜（蔑儿乞伯颜）专权，至元元年（1335 年）奏请罢科举（后至元元年恢复讨论，1337 年又以"儒士无用"再罢），垄断朝政并压制儒臣，至元六年（1340 年）伯颜被罢黜。
