background_zh_cn: 陈友谅本徐寿辉部将，徐寿辉据蕲水为天完之号，江左群雄之一；至正十八年四月，徐寿辉将陈友谅遣赵普胜陷池州，至正二十年五月，徐达、常遇春败陈友谅于池州——友谅与太祖之隙既深，遂有并吞诸部、自取之志。
process_zh_cn: 闰五月丙辰，友谅陷太平，守将朱文逊、院判花云、王鼎、知府许瑗死之；未几，友谅弑其主徐寿辉，自称皇帝，国号汉，尽有江西、湖广地，约张士诚合攻应天，应天大震。太祖乃驰谕胡大海捣信州牵其后，而令康茂才以书绐友谅，令速来，设伏以待之——友谅既败于龙湾，太祖率师御之。
result_zh_cn: 友谅西还，迎战于鄱阳湖：至正二十三年，友谅闻太祖至，解围，逆战于鄱阳湖；相持既久，泾江军复遮击之，友谅中流矢死，张定边以其子理奔武昌。九月，太祖还应天，论功行赏——汉政权遂亡，江西、湖广为太祖所有。
impact_zh_cn: 陈友谅之汉为元末群雄中土地最广、兵势最盛者，其亡使太祖独当江汉，南下平张士诚、北伐中原皆无后顾之忧；鄱阳一役亦为中国水战史上以少胜多之著例，友谅既殒而汉祚遂绝，太祖混一天下之基业自此奠定。
