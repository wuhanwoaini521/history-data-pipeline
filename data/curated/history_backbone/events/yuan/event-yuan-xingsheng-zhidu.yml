summary_zh_cn: 灭南宋前后，元廷在中书省之外于大地区分设行中书省（行省）统领地方军政，至元年间渐次确立岭北、辽阳、河南江北、陕西、四川、云南、湖广、江西、江浙、甘肃等行省；行省由朝廷派出机构演变为常设行政区，元代确立的地方行政制度为后世沿用。
