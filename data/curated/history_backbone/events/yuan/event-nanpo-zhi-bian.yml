summary_zh_cn: 至治三年（1323 年）八月，元英宗自上都南还大都途中在南坡驿被御史大夫铁失等弑杀，随行宰相拜住同遇害；铁失党立泰定帝，英宗新政随之中止，元朝宫廷政治进入动荡期。
