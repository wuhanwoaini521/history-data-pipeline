background_zh_cn: 英宗硕德八剌以仁宗嫡子即位，厉精图治，丞相拜住请更前政不便者，会议中书堂，中外望治；然英宗锐于更张，铁木迭儿之党失势，御史大夫铁失等内不自安，遂谋为变——南坡之祸实由新政与旧党之争激成。
process_zh_cn: 至治三年（1323年）秋八月癸亥，英宗自上都南还，驻跸南坡。是夕，铁失与知枢密院事也先铁木儿、大司农失秃儿、前中书平章政事赤斤铁木儿、前治书侍御史锁南等，及诸王按梯不花、孛罗等，以铁失所领阿速卫兵为外应，杀右丞相拜住，铁失直犯禁幄，手弑英宗于卧所。（《元史·泰定帝纪》亦书：「是夕，铁失等矫杀拜住，英宗遂遇弑于幄殿。」）
result_zh_cn: 变起之后，晋王也孙铁木儿（泰定帝）即位于龙居河，九月四日，铁失及其党皆伏诛；元廷遣旭迈杰、纽泽诛逆贼铁失、失秃儿、赤斤铁木儿等于大都，并戮其子孙、籍入家产。泰定元年，御史犹言「逆贼铁失等虽伏诛，其党枢密副使阿散身亲弑逆，以告变得不死」，乞早正天讨。
impact_zh_cn: 南坡之变弑君于行幄，为元代政治之一大转折：英宗新政随之中止，泰定以降权臣与诸王交结之局渐深，距亡国不足五十年；后世论者以宿卫之臣不能死节为耻（「南坡之变，不能勇效一死」），可见士论之痛。
