summary_zh_cn: 绍定五年至端平元年（1232—1234 年），蒙古军大举攻金，金哀宗弃汴京南走蔡州；1234 年正月，蒙古与南宋联军会攻蔡州，城破，金哀宗自缢（末帝承麟被杀），金亡。灭金是蒙古与南宋三方（蒙古+南宋+金）关系的终结节点。
