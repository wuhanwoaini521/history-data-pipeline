summary_zh_cn: 宣和二年至三年（1120—1121 年），两浙睦州青溪方腊聚众起义，攻占六州五十余县，后童贯率军镇压，方腊被俘遇害；起义与花石纲及东南赋役有关，是北宋末江南社会矛盾的集中爆发。
