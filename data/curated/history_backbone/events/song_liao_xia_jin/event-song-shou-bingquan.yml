summary_zh_cn: 建隆二年至乾德元年（961—963 年），宋太祖罢去石守信、王审琦等宿将的禁军统帅职务，以"三衙"（殿前司、侍卫马军司、侍卫步军司）分掌禁军、枢密院掌军政，形成强干弱枝、兵权集于中央的军事制度安排，北宋开国"杯酒释兵权"即指此一过程。
