background_zh_cn: 癸未，康王至应天府；济州父老诣军门请帝即位——靖康之后，宗室与军民推戴康王。
result_zh_cn: 改元建炎——南宋政权于应天府建立。
process_zh_cn: 五月庚寅朔，帝登坛受命，礼毕恸哭，遥谢二帝，即位于府治。
impact_zh_cn: 建炎改元、以应天府为南京，宋室南渡而国祚延续——南宋一百五十年自此始，中原士民随之南迁（衣冠南渡再演）。
