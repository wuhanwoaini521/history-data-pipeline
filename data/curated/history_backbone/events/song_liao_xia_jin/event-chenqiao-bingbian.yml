summary_zh_cn: 建隆元年正月（960 年），后周殿前都点检赵匡胤在陈桥驿发动兵变，回京代周称帝，改国号为宋，定都开封（东京），史称北宋。五代十国局面结束，后周诸州军政多不战而降，北宋开启统一战争。
