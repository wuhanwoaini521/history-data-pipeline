background_zh_cn: 后周世宗崩，恭帝幼冲，禁军诸校为朝局轻重：世宗尝召禁军诸校宴射苑中，赏赍有加，禁军之柄已为改朝换代之枢。太祖赵匡胤以北征为名率师出京师——「及太祖北征，为六师推戴，自陈桥还府署」，兵变之机已伏。
result_zh_cn: 太祖即位，尊符太后为皇太后：「及太祖自陈桥还京师，人走报太后曰：点检已作天子。太后曰：吾儿素有大志，今果然」；后周恭帝逊位，宋受禅而立，改元建隆，五代之局自此收束，宋室三百年基业肇焉。
process_zh_cn: 大军次陈桥驿，「军中知星者苗训引门吏楚昭辅视日下复有一日，黑光摩荡者久之」——天象之说以动众心；诸校露刃列于庭曰「诸军无主，愿策太尉为天子」，将士拥立，太祖乃还师入京，秋毫无犯。
impact_zh_cn: 陈桥兵变以兵不血刃而成禅代，宋室惩五代武人拥立之弊，遂收兵权、重文治，强干弱枝之策行于一代；宋代文官政治与「与士大夫共治」之局皆肇于此，而其重文抑武之偏亦伏后来边患之因。
