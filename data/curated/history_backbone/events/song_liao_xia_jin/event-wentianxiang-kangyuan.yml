summary_zh_cn: 德祐二年至至元二十年（1276—1283 年），南宋右相文天祥在临安降后组织抗元，于循州五坡岭（1278 年）被俘，坚拒劝降，1283 年 1 月 9 日在大都（今北京）就义；文天祥被俘期间所写《过零丁洋》《正气歌》等成为后世传诵的忠义书写。
