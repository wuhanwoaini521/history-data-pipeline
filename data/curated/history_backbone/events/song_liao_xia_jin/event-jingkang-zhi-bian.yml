background_zh_cn: 宋廷和战不决：金人两至都城，「中国之御四裔，能守而后可战，能战而后可和，而靖康之末皆失之」；靖康元年，金人入青城、攻朝阳门，京城危急，钦宗下诏亲征，而大臣议论纷然，战守之策莫衷一是。
result_zh_cn: 二帝北狩、皇族播迁：宋臣追论之曰「昨者城下之战，诡诈百出，二帝北狩，皇族播迁，宗社之危，已绝而续」；北宋百七十年而亡，康王构即位于南京，是为南宋，中兴之局始于危亡之际，中原遗民之望遂系江左。
process_zh_cn: 靖康元年闰十一月，「秦元领保甲斩关遁，京城陷」；金人邀上皇出郊，戊午钦宗如青城，帝在青城。二年二月丁卯，金人要上皇如青城；辛未，金人逼上皇召皇后、皇太子入青城——二帝及后妃皇族尽为金人所执。
impact_zh_cn: 靖康之变为中国历史之巨创：「国家二百年太平之基……二圣北狩之痛，汉、唐之所未有也」，中原沦于金，宋室南渡，南北对峙历百五十年；士人复仇之论与理学之兴起皆与此痛相关，南宋一朝之政治与文教皆以此为底色。
