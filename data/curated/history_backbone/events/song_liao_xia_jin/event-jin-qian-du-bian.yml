summary_zh_cn: 贞祐二年（1214 年），金宣宗迫于蒙古军压力迁都南京（汴京开封）；次年（1215 年）蒙古军攻占中都（今北京），金国黄河以北领土丧失大半，政权退守河南，蒙古攻金进入第二阶段。
