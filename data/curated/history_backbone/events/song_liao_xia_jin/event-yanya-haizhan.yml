background_zh_cn: 宋主纳土降元之后，宋臣拥二王南走：至元十五年四月，「昺徙居崖山，升广州为翔龙府」；世杰以碙洲不可居，徙王新会之崖山，结大舶千余艘作水寨据险以守——张弘范、李恒奉命征崖山，南北最后之战遂起于海。
result_zh_cn: 崖山破，陆秀夫走卫王舟，「度不可脱，乃杖剑驱妻子入海，即负王赴海死，年四十四」；世杰、刘义各断维去，宋之宗社遂绝——元一统南北，宋三百二十年而亡，中国历史上第一次由北方民族完成南北一统。
process_zh_cn: 十六年正月壬戌，张弘范兵至崖山；或谓世杰曰「北兵以舟师塞海口，则我不能进退，盍先据海口」，世杰不听。二月癸未，弘范等攻崖山，世杰败，走卫王舟；弘范得世杰之甥韩，命以官，使三至招之，世杰历数古忠臣曰「吾知降，生且富贵，但为主死不移耳」。
impact_zh_cn: 崖山海战为宋亡之终局，亦为元大一统之标志：海上之役见宋末舟师之盛与水战规模之空前，此后明之复国与士人「崖山之后」之痛皆系于此；有元一代之南北一统与中外交通之盛均以此为始，东亚之政治格局为之一变。
