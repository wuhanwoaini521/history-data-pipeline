summary_zh_cn: 祥兴二年（1279 年）二月，宋元在崖山（今广东新会南海中）展开海战，宋军大败，陆秀夫负帝昺蹈海，南宋灭亡；元朝至此统一中国，中国历史上最后一次大规模海战歼亡的汉族王朝政权结束。
