summary_zh_cn: 庆历三年（1043 年）范仲淹出任参知政事，提出明黜陟、抑侥幸、精贡举等十事改革方案，史称庆历新政；因遭保守势力反对，一年多后即告失败，范仲淹等相继去职，为北宋中期政治改革（后之王安石变法）的先声。
