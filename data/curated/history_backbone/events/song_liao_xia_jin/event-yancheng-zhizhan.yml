summary_zh_cn: 绍兴十年（1140 年）七月，岳飞率部在郾城（今属河南漯河）与金军主力决战，以背嵬军等击退金军重甲骑兵，取得北伐中的关键胜利，其后宋廷一日十二道金字牌催令班师（史料见《建炎以来系年要录》等，学界对金牌说尚有考订）。
