summary_zh_cn: 景德元年（1004 年）辽圣宗大举南侵，宋真宗亲征至澶州（今河南濮阳），辽军主帅萧挞凛被宋军射杀，双方罢兵议和，次年（1005 年）正月订立澶渊之盟：宋辽约为兄弟之国，宋岁输银绢，边境开榷场互市，维持约百年和平。
