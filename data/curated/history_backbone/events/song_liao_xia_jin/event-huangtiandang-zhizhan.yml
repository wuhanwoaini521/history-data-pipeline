summary_zh_cn: 建炎四年（1130 年），金军完颜宗弼（兀术）南下追宋高宗，北返时在镇江黄天荡被韩世忠部堵截四十余日，金军开渠决堤突围退走；此战标志南宋军事实力足以依托江淮防线与金对峙，亦展示宋金在长江沿岸的拉锯。
