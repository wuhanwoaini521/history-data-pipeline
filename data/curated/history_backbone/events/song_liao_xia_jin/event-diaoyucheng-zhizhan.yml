summary_zh_cn: 宝祐六年至开庆元年（1258—1259 年），蒙古大汗蒙哥亲征四川，围攻合州钓鱼城（今重庆合川）半年不下，1259 年七月蒙哥死于军中（病卒或中炮说，史源有出入），蒙古军北撤；南宋川防得以延续，蒙哥之死也使蒙古汗位继承悬而未决。
