summary_zh_cn: 中统元年（1260 年）三月，忽必烈在开平（今内蒙古正蓝旗）即蒙古大汗位，其弟阿里不哥同年在和林称汗，爆发争位内战；至元元年（1264 年）阿里不哥降附，忽必烈巩固汗位，蒙古政治重心渐向中原转移。
