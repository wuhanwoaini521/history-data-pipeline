summary_zh_cn: 绍兴三十一年（1161 年）十一月，金军主力在采石（今安徽马鞍山）渡江，宋中书舍人虞允文督战于采石矶，以水军击败金军，金军渡江失败，完颜亮在扬州军中被废杀，金军北撤。
