summary_zh_cn: 绍兴十一年十二月二十九日（公历 1142 年 1 月 27 日），岳飞在大理寺狱中被处死，其子岳云、部将张宪同遇害；孝宗朝追复岳飞官爵，宁宗朝追封鄂王、谥武穆，岳飞经南宋中后期追崇成为抗金象征人物。
