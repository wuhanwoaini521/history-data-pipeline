summary_zh_cn: 开禧二年（1206 年），铁木真统一蒙古诸部，在斡难河源即大汗位，称成吉思汗，建立大蒙古国（Yeke Mongghol Ulus）；此为蒙古帝国的开端，与
  1271 年改国号"大元"（regime-yuan）为两个不同政权阶段。
