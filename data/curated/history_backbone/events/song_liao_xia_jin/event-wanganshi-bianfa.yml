summary_zh_cn: 熙宁二年至元丰前（1069—1076 年），王安石在宋神宗支持下推行新法，先后颁行均输、青苗、免役（募役）、市易、保甲、方田均税等法，并开边熙河、改革科举；因新旧党争与实施中的问题，熙宁七年、九年两度罢相，元丰年间神宗继续推行部分新法。
