summary_zh_cn: 太平兴国四年（979 年），宋太宗灭北汉后随即亲率大军攻辽南京（幽州），在高梁河（今北京西郊一带）被辽军与援军内外夹击大败，宋太宗受伤南逃，北宋第一次伐辽（收复燕云）尝试失败，此后宋辽进入长期对峙。
