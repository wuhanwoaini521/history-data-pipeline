summary_zh_cn: 商王武丁在位约59年，任用傅说等贤臣，征伐四方，商朝国力达到鼎盛，史称"武丁中兴"。甲骨文卜辞与殷墟考古为这一时期提供了直接证据。在位年断代工程从甲骨月食记录推定为前1250—前1192年。
