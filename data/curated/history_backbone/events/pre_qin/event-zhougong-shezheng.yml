summary_zh_cn: 成王年幼，周公旦摄政称王，稳定初建政权，史称"周公摄政"（一说另立由周召二公共和辅政）。摄政期间平定叛乱、营建洛邑、推行制礼作乐，被誉为西周制度文化奠基的关键期。
