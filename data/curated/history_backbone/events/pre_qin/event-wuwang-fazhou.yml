summary_zh_cn: 周武王姬发率诸侯联军伐商，与商军战于牧野（今河南淇县南），商纣王自焚，商朝灭亡，史称"武王伐纣"或"牧野之战"。这是商周分界的标志性节点。断代工程经多方推定为前1046年，另有前1027年（《竹书纪年》系统）等四十余种异说。
