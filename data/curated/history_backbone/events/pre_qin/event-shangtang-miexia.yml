process_zh_cn: 伊尹相汤伐桀，升自陑，遂与桀战于鸣条之野；汤誓众曰「格尔众庶，悉听朕言，非台小子，敢行称乱」「夏氏有罪，予畏上帝，不敢不正」——以天命为号讨夏。
impact_zh_cn: 汤既胜夏，诸侯闻之曰「汤德至矣，及禽兽」——商以德义之名声代夏而立，汤誓成为后世「吊民伐罪」的文告典范。
