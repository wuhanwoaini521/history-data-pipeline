summary_zh_cn: 夏朝末年商汤起兵伐夏，在鸣条（今河南一带，具体地望有争议）击败夏桀，夏朝灭亡，史称"商汤革命"。这是中国历史上有明确文献记载的第一次王朝更替，标志夏商年代分界。年代采用《夏商周断代工程》约前1600年框架，另有学者主张前1556年前后，存在分歧。
