summary_zh_cn: 传统纪年称夏王太康耽于游乐，被东夷首领后羿（有穷氏）夺权，夏朝一度失国，史称"太康失国"。属于《史记》《竹书纪年》记载的传统叙事，绝对年代无考，此年份为按传统积年推算的约数。
