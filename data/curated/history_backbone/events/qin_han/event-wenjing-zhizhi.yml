regime_ids: []
importance: major
summary_zh_cn: 汉文帝、汉景帝两朝（约前179—前141年）轻徭薄赋、与民休息，社会富庶、仓廪充实，史家后世概括为"文景之治"（属后世历史概括）。本事件为治世过程节点，具体制度与政变见 削藩/七国之乱 等具体 Event。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《汉书·食货志》及《文帝纪》《景帝纪》；现代参考：翦伯赞《秦汉史》（北京大学出版社）；吕思勉《秦汉史》（上海古籍出版社）；田余庆《秦汉魏晋史探微》（北京大学出版社）；张岂之主编《中国历史·秦汉魏晋南北朝卷》
