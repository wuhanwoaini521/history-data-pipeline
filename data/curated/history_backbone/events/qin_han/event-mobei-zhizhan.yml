process_zh_cn: 大将军卫青将四将军出定襄，将军去病出代，各将五万骑；青出塞斩首万余，去病与左贤王战、斩获首虏七万余级。漠北接战：与汉大将军接战一日，会暮，大风起，汉兵纵左右翼围单于，单于遁走。
impact_zh_cn: 漠北之战为汉匈战争之决战：汉由防御转入全面反攻并取得战略优势，匈奴远徙，汉之河西、西域经营遂次第展开；然终汉之世，匈奴未灭而边费浩大，论者以元狩之际为汉武用兵之极盛，亦为昭宣以降休养生息之由。
