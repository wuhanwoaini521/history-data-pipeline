summary_zh_cn: 前119年（元狩四年），汉军分两路深入漠北：卫青败单于主力，霍去病封狼居胥山，共斩俘匈奴八九万，匈奴主力远遁，"漠南无王庭"。漠北之战是汉匈战争决定性一役，标志汉对匈奴由防御转入全面反攻并取得战略优势，是汉武帝对匈奴战争的重要转折节点。
