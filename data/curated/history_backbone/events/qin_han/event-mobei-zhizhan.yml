id: event-mobei-zhizhan
name_zh_cn: 漠北之战
event_type: war
start_year: -119
end_year: -119
date_precision: year
period_id: period-western-han
importance: critical
summary_zh_cn: 前119年（元狩四年），汉军分两路深入漠北：卫青败单于主力，霍去病封狼居胥山，共斩俘匈奴八九万，匈奴主力远遁，"漠南无王庭"。漠北之战是汉匈战争决定性一役，标志汉对匈奴由防御转入全面反攻并取得战略优势，是汉武帝对匈奴战争的重要转折节点。
background_zh_cn: 元狩三年，匈奴入右北平、定襄各数万骑，杀略千余人；先是匈奴「又入代郡、定襄、上郡，各三万骑，杀略数千人」，边患日亟。武帝乃令大将军青、票骑将军去病中分军，大将军出定襄，票骑将军出代，「咸约绝幕击匈奴」——绝漠决战之策既定。
result_zh_cn: 去病封狼居胥山、禅于姑衍、登临翰海乃还；《汉书·匈奴传》记「追奔逐北，封狼居胥山，禅于姑衍，以临翰海，虏名王贵人以百数」——匈奴主力远遁，漠南无王庭；汉亦亡两将军、士卒数万，国力为之一耗。
