summary_zh_cn: 公元25年（更始三年/建武元年）六月，刘秀在鄗县（今河北柏乡一带）称帝，仍用"汉"国号，史称后汉或东汉；随后定都洛阳。东汉的建立结束了新莽以来的政治混乱，中国历史进入东汉时代。
