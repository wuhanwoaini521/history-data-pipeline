date_precision: year
period_id: period-western-han
regime_ids: []
importance: major
summary_zh_cn: 前195年，汉高帝与群臣杀白马盟誓："非刘氏而王，天下共击之；非有功而侯，天下共击之"，史称白马之盟。此盟约成为西汉'郡国并行'体制下诸侯王国刘氏化的制度性声明，后来吕后封诸吕为王即为违背此盟。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《史记·吕太后本纪》；现代参考：翦伯赞《秦汉史》（北京大学出版社）；吕思勉《秦汉史》（上海古籍出版社）；田余庆《秦汉魏晋史探微》（北京大学出版社）；张岂之主编《中国历史·秦汉魏晋南北朝卷》
