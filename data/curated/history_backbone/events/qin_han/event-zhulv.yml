summary_zh_cn: 前180年吕后去世，诸吕紧张图谋作乱；齐王刘襄举兵，太尉周勃、丞相陈平与朱虚侯刘章等合谋诛灭吕产、吕禄等诸吕，尽废吕氏所立，随后迎立代王刘恒为帝。诛诸吕结束了吕氏外戚专权，也是功臣集团与宗室联合重建朝局的关键政变。
