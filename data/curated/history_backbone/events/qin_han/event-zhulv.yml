name_zh_cn: 诛诸吕
event_type: political
start_year: -180
end_year: -180
date_precision: year
period_id: period-western-han
regime_ids: []
importance: major
summary_zh_cn: 前180年吕后去世，诸吕紧张图谋作乱；齐王刘襄举兵，太尉周勃、丞相陈平与朱虚侯刘章等合谋诛灭吕产、吕禄等诸吕，尽废吕氏所立，随后迎立代王刘恒为帝。诛诸吕结束了吕氏外戚专权，也是功臣集团与宗室联合重建朝局的关键政变。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《史记·吕太后本纪》《孝文本纪》；现代参考：翦伯赞《秦汉史》（北京大学出版社）；吕思勉《秦汉史》（上海古籍出版社）；田余庆《秦汉魏晋史探微》（北京大学出版社）；张岂之主编《中国历史·秦汉魏晋南北朝卷》
