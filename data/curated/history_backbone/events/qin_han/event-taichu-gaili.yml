summary_zh_cn: 前104年（太初元年），汉武帝采纳公孙卿等建议改用新历（太初历），正月为岁首、以元封七年改为太初元年，并施行史记纪年体系。太初历（邓平、落下闳等所制）是当时较精密的历法，其后长期沿用。
