summary_zh_cn: 前127年（元朔二年），卫青率军出云中以西，攻取黄河以南（河南地）并修筑朔方城，置朔方郡。河南之战是汉匈战争首次大规模收复失地的战役，河套国防线南移，为后续反击提供前进基地。
