summary_zh_cn: 前106年（元封五年），汉武帝除京师附近七郡外，分全国为十三州（部），各置刺史一人，以'六条问事'监察地方二千石长吏。刺史制度是中央监察地方的专职化设置，汉代监察体系由此制度化。
