summary_zh_cn: 公元23年（更始元年）三月，绿林军建立更始政权；王莽遣王邑、王寻率号称四十二万大军围攻昆阳（今河南叶县一带），刘秀率数千守军以奇袭大破之，新军主力溃败。昆阳之战是新莽政权的决定性军事失败，直接导致新朝灭亡。
