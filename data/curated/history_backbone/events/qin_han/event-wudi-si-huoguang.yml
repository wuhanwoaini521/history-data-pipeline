summary_zh_cn: 前87年（后元二年），汉武帝临终立少子弗陵（汉昭帝），以霍光、金日磾、上官桀等为辅政大臣，以霍光为首。武帝去世后，西汉进入昭宣时期，霍光长期执掌朝政。
