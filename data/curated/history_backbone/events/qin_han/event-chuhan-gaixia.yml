background_zh_cn: 韩信自齐、刘贾军自寿春并行，屠城父至垓下；大司马周殷叛楚，举九江兵随刘贾、彭越皆会垓下——诸侯合围之势已成。
process_zh_cn: 项王军壁垓下，兵少食尽，汉军及诸侯兵围之数重；项王夜闻汉军四面皆楚歌，乃大惊曰「汉皆已得楚乎」。
impact_zh_cn: 项羽兵败自刎而死，楚政权覆灭——垓下之战成为楚汉战争的军事终局。
