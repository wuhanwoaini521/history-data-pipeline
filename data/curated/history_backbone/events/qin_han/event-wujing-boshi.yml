summary_zh_cn: 前136年（建元五年），汉武帝设置五经（诗、书、礼、易、春秋）博士，取代此前杂学博士，儒经研习由此列入朝廷官学。这是汉初'罢黜百家'潮流中儒学官学化的制度性标志。
