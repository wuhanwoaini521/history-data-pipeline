importance: major
summary_zh_cn: 前136年（建元五年），汉武帝设置五经（诗、书、礼、易、春秋）博士，取代此前杂学博士，儒经研习由此列入朝廷官学。这是汉初'罢黜百家'潮流中儒学官学化的制度性标志。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《汉书·武帝纪》《儒林传》；现代参考：翦伯赞《秦汉史》（北京大学出版社）；吕思勉《秦汉史》（上海古籍出版社）；田余庆《秦汉魏晋史探微》（北京大学出版社）；张岂之主编《中国历史·秦汉魏晋南北朝卷》
