background_zh_cn: 「孝元皇帝，宣帝太子也」；宣帝尝「有意欲用淮阳王代太子，然以少依许氏，俱从微起，故终不背焉」——储位几易而终定。
process_zh_cn: 黄龙元年十二月，宣帝崩；癸巳，太子即皇帝位，谒高庙。
result_zh_cn: 元帝即位，尊皇太后、立皇后——昭宣之政向元成之世过渡。
impact_zh_cn: 元帝之立为许氏外戚与儒臣政治之渐：柔仁好儒之君临朝，汉政自此转向儒术与权臣交争之局。
