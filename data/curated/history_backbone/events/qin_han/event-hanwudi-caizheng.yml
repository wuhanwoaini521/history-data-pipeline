summary_zh_cn: 为支撑连年战争，汉武帝推行系列财政集权政策：约前119年起盐铁官营、行算缗，前114年前后杨可告缗贯行，前110年前后桑弘羊主持均输平准，将铸币、盐铁、贸易利润收归中央。这些政策大幅增加国库收入，也造成工商业受挫与民力过度征调。
