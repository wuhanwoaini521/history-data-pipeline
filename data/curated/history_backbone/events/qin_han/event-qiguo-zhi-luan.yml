id: event-qiguo-zhi-luan
name_zh_cn: 七国之乱
event_type: war
start_year: -154
end_year: -154
date_precision: year
period_id: period-western-han
importance: critical
summary_zh_cn: 前154年正月，吴王刘濞联合楚、赵、胶西、胶东、菑川、济南六国起兵叛乱，以"诛晁错、清君侧"为名；景帝杀晁错而乱不止，遣周亚夫平定，三月乱平。七国之乱是郡国并行体制下中央与诸侯王国矛盾的总爆发，战后诸侯王权力被大幅削弱，中央集权显著加强。
background_zh_cn: 景帝新立，信用晁错，将诛正诸侯王；晁错患诸侯强大不可制，「故请削之，以尊京师，万世之利也」。《汉书》记「景帝用晁错之计削吴、楚」，赵王遂亦以过削常山郡——诸侯怨望，吴、楚之反之机已伏。
result_zh_cn: 景帝斩御史大夫晁错以谢七国而乱不止；邓公论之曰「夫晁错患诸侯强大不可制，故请削之，以尊京师，万世之利也」——诛错之失在于自折谋臣。诸将破七国，斩首十余万级，乱三月而平，吴王败走而死。
