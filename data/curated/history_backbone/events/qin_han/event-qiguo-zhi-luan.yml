process_zh_cn: 及削吴会稽、豫章郡书至，吴王先起兵，诛汉吏二千石以下；其将周丘一夜得三万人，遂将其兵北略城邑。吴、楚相遗书曰「贼臣晁错擅適诸侯，削夺之地，以故反名为西共诛错，复故地而罢」——七国以「请诛晁错」为名而连兵西向。
impact_zh_cn: 七国之乱为郡国并行体制下中央与诸侯矛盾的总爆发：乱平之后诸侯王权力大削，汉廷集权显著加强；武帝初即位，大臣惩吴、楚行事而「欲稍侵削」，推恩、左官诸法继之，诸侯连城数十之患遂除。
