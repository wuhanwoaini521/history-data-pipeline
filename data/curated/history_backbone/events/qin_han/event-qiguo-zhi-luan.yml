process_zh_cn: 及削吴会稽、豫章郡书至，吴王先起兵，诛汉吏二千石以下；其将周丘一夜得三万人，遂将其兵北略城邑。
impact_zh_cn: 景帝斩御史大夫晁错以谢七国而不止兵；诸将破七国、斩首十余万级——乱平，吴王败走、诸侯王坐大之患稍息，汉廷集权得以推进。
