summary_zh_cn: 前91年（征和二年），汉武帝晚年巫蛊案扩大，江充构陷太子刘据，太子起兵诛江充后兵败自杀，皇后卫子夫亦死，牵连甚广，史称巫蛊之祸。此案是武帝晚年最大政治悲剧，动摇储位并深刻影响其后政局。
