background_zh_cn: 武帝晚年「巫蛊起」——方士巫祝之术盛行于宫禁，江充等因之构陷。
process_zh_cn: 征和二年，巫蛊事起，太子据被诬；「庚寅，太子亡，皇后自杀」——兵变与追捕相继。
result_zh_cn: 八月辛亥，太子自杀于湖——巫蛊之祸以太子死、皇后崩告终，死者数万。
impact_zh_cn: 太子既没，储位空虚，武帝晚年立幼子、托孤霍光——巫蛊之祸直接改写了汉室的继承格局。
