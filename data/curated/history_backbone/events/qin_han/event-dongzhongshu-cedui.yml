id: event-dongzhongshu-cedui
name_zh_cn: 董仲舒贤良对策
event_type: political
start_year: -140
end_year: -134
date_precision: approximate
period_id: period-western-han
regime_ids: []
importance: major
summary_zh_cn: 汉武帝诏举贤良方正，董仲舒上'天人三策'，主张"罢黜百家，表章六经"、以儒学统一思想并设立太学以养士（对策年代有建元元年/元光元年二说）。此对策为儒学由私学进入官方意识形态的重要环节，但儒学官学化是一个长期过程。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《汉书·董仲舒传》；现代参考：翦伯赞《秦汉史》（北京大学出版社）；吕思勉《秦汉史》（上海古籍出版社）；田余庆《秦汉魏晋史探微》（北京大学出版社）；张岂之主编《中国历史·秦汉魏晋南北朝卷》；另见田余庆《秦汉魏晋史探微》相关讨论
