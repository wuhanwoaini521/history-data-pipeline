summary_zh_cn: 前121年（元狩二年），霍去病两次出击河西走廊，大败匈奴，同年秋浑邪王降汉，汉朝将河西走廊收入版图，随后依次设置武威、张掖、酒泉、敦煌诸郡（约前121—前111年渐次完成）。
