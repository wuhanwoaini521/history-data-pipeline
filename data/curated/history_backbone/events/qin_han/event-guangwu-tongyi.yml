summary_zh_cn: 刘秀称帝后继续扫平割据势力：先后击灭更始余部与赤眉（27年）、平定刘永、彭宠、卢芳等，至建武十二年（36年）灭公孙述（成家政权），重新完成全国统一。光武统一战争历时十余年，史称"光武中兴"的基础。
