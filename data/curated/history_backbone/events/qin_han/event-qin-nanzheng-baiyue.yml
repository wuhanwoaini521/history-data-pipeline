background_zh_cn: 又使尉屠睢将楼船之士南攻百越，使监禄凿渠运粮——秦以楼船水师与粮道工程南征。
process_zh_cn: 深入越，越人遁逃——秦军深入岭南。
result_zh_cn: 三十三年，发诸尝逋亡人、赘婿、贾人略取陆梁地，为桂林、象郡、南海，以适遣戍——岭南置三郡。
impact_zh_cn: 秦置三郡、以谪戍实边，岭南自此入于中国版图；其后赵佗据之，南越国由是而立。
