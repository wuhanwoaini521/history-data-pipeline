summary_zh_cn: 秦始皇二十八年（前219年）后发兵五十万征南越，经数年征战，约前214年平岭南，置桂林、南海、象三郡，并开凿灵渠沟通湘漓水系。百越之地自此纳入秦郡县体系，中原与岭南联系加强。
