summary_zh_cn: 公元17年（天凤四年），荆州饥民在王匡、王凤等率领下聚于绿林山（今湖北大洪山一带）起义，号"绿林军"。绿林军后来成为反新主力，公元22年遭王莽军重创后分路活动，更始政权与刘秀势力皆由绿林部曲发展而来。
