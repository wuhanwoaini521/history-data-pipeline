summary_zh_cn: 前133年，汉武帝采纳王恢之议，在马邑（今山西朔州）设伏诱击匈奴单于，因计划泄露未遂。马邑之谋虽未成功，却标志着汉匈和亲关系的终结，拉开双方大规模战争的序幕。
