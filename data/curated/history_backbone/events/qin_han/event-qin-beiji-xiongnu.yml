  description_zh_cn: 北防匈奴的军事行动

background_zh_cn: 秦已并天下，北边匈奴为患，乃以蒙恬统大军北征。
process_zh_cn: 乃使蒙恬将三十万众北逐戎狄，收河南——河套之地尽入秦疆。
result_zh_cn: 是时蒙恬威振匈奴——匈奴远遁，北边暂安。
impact_zh_cn: 蒙恬暴师于外十余年、居上郡，秦以重兵长戍北边；筑长城、通直道皆自此役始。
