id: event-qin-xiu-changcheng
name_zh_cn: 修筑长城
event_type: economic
start_year: -214
end_year: -213
date_precision: range
period_id: period-qin
regime_ids: []
importance: major
summary_zh_cn: 秦始皇命蒙恬连接并修筑西起临洮、东至辽东的万里长城，利用原秦、赵、燕三国边城，筑障塞以御匈奴。秦长城是空前规模的国防工程，但征发大量民力，加重百姓负担。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《史记·蒙恬列传》《秦始皇本纪》；现代参考：林剑鸣《秦史稿》（上海人民出版社）；翦伯赞《秦汉史》（北京大学出版社）；张岂之主编《中国历史·秦汉魏晋南北朝卷》；白寿彝总主编《中国通史》
