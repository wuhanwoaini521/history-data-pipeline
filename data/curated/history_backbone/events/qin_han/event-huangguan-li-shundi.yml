summary_zh_cn: 延光四年（125年），汉安帝去世，阎皇后临朝废太子（济阴王）；宦官孙程等十九人合谋诛阎显集团，拥立济阴王即位，是为汉顺帝。这是宦官集团首次拥立皇帝，宦官政治由此正式进入东汉权力核心。
