importance: major
summary_zh_cn: 前141年正月，汉景帝去世，太子刘彻即位，是为汉武帝（建元元年即前140年）。汉武帝在位五十四年，全面强化中央集权、开拓疆域，是中国历史上在位时间最长的皇帝之一，也是西汉由守成转向积极扩张的关键节点。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《汉书·武帝纪》；现代参考：翦伯赞《秦汉史》（北京大学出版社）；吕思勉《秦汉史》（上海古籍出版社）；田余庆《秦汉魏晋史探微》（北京大学出版社）；张岂之主编《中国历史·秦汉魏晋南北朝卷》
