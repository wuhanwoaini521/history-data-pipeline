summary_zh_cn: 前198年（一说前199年），刘敬出使匈奴缔结和亲，汉以宗室女嫁单于、岁奉絮缯酒食，约以长城为界。和亲成为汉初六七十年对匈奴的基本政策，至汉武帝马邑之谋（前133）才被打破。
