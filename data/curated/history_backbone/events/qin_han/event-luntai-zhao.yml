summary_zh_cn: 前89年（征和四年），汉武帝颁布轮台诏（《轮台诏》），罪己悔过，罢罢轮台屯田，宣布"当今务在禁苛暴、止擅赋、力本农"，政策转向休养。轮台诏标志着武帝晚年对连年征伐与酷政的反思，为昭宣时期的政策基调定下方向。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《汉书·西域传》《武帝纪》；现代参考：翦伯赞《秦汉史》（北京大学出版社）；吕思勉《秦汉史》（上海古籍出版社）；田余庆《秦汉魏晋史探微》（北京大学出版社）；张岂之主编《中国历史·秦汉魏晋南北朝卷》
