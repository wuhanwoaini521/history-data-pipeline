name_zh_cn: 张骞第一次出使西域
event_type: diplomatic
start_year: -138
end_year: -126
date_precision: range
period_id: period-western-han
regime_ids: []
importance: major
summary_zh_cn: 前138年（建元三年），汉武帝遣张骞出使西域联络大月氏共击匈奴，途中被匈奴扣留十余年，前126年方归汉。虽未达成军事联盟，但张骞带回西域诸国情势，"凿空"西域，为汉朝经营西域奠基。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《史记·大宛列传》；现代参考：翦伯赞《秦汉史》（北京大学出版社）；吕思勉《秦汉史》（上海古籍出版社）；田余庆《秦汉魏晋史探微》（北京大学出版社）；张岂之主编《中国历史·秦汉魏晋南北朝卷》
