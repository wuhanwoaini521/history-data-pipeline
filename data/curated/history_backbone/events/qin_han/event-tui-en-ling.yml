summary_zh_cn: 前127年（元朔二年），汉武帝采纳主父偃之策颁行推恩令，令诸侯王将封地析分子弟为侯国，由朝廷划定，名义上是施恩、实质是分封诸侯王势力。此后王国地权不断缩小，"蕃国自析"，诸侯王无力与中央对抗。
