summary_zh_cn: 前127年（元朔二年），汉武帝采纳主父偃之策颁行推恩令，令诸侯王将封地析分子弟为侯国，由朝廷划定，名义上是施恩、实质是分封诸侯王势力。此后王国地权不断缩小，"蕃国自析"，诸侯王无力与中央对抗。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《汉书·武帝纪》《主父偃传》；现代参考：翦伯赞《秦汉史》（北京大学出版社）；吕思勉《秦汉史》（上海古籍出版社）；田余庆《秦汉魏晋史探微》（北京大学出版社）；张岂之主编《中国历史·秦汉魏晋南北朝卷》
