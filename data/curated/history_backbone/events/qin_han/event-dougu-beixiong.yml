id: event-dougu-beixiong
name_zh_cn: 窦固窦宪北伐匈奴（燕然勒石）
event_type: war
start_year: 89
end_year: 91
date_precision: range
period_id: period-eastern-han
regime_ids: []
importance: major
summary_zh_cn: 永元元年（89年），车骑将军窦宪与耿秉等大破北匈奴于稽落山，登燕然山刻石纪功（燕然勒石）；90年再破之，91年北匈奴单于西遁，北匈奴政权瓦解。此役为东汉对北方匈奴的最后决定性胜利，但窦宪班师后权倾朝野，旋被和帝诛灭。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《后汉书·窦宪传》《南匈奴传》；现代参考：翦伯赞《秦汉史》（北京大学出版社）；何兹全《秦汉史略》及近人秦汉史专著；张岂之主编《中国历史·秦汉魏晋南北朝卷》
