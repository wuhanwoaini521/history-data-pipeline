summary_zh_cn: 秦始皇二十七年（前220年）起修筑驰道，以都城咸阳为中心通往全国，东至燕齐、南达吴楚，道广五十步、树以青松，形成全国性道路交通骨干，并为军事调动与巡游统治提供支撑（后又有直道等干道工程）。
