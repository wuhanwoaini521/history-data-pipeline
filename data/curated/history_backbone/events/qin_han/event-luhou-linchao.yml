regime_ids: []
importance: major
summary_zh_cn: 惠帝在位七年间吕后已执掌实权；前188年惠帝去世后，吕后临朝称制，先后立两少帝，并违背白马之盟分封吕氏诸王，诸吕势力达到顶峰。吕后是中国历史上第一位临朝称制的女性统治者。
