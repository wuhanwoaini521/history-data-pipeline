summary_zh_cn: 前180年，代王刘恒在诛诸吕后被迎立为帝，是为汉文帝。汉文帝轻徭薄赋、约法省禁，开启汉初休养生息政策的进一步落实，与后来的汉景帝并称'文景'时期，奠定西汉国力恢复的基础。
