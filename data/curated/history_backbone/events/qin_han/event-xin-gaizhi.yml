summary_zh_cn: 王莽称帝后推行大规模制度变革：始建国元年（9年）行王田、私属制，禁奴婢买卖，行五均六筦、盐铁专卖；屡次改革币制（四十八品），并大改官制、郡县与地名，改制周边邦国名号。改制触动广泛利益且政令繁苛，激化社会矛盾，是导致新朝迅速动荡的主要原因。
