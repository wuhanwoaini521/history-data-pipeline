summary_zh_cn: 前200年冬，刘邦亲率大军伐韩王信（叛投匈奴），在平城白登山（今山西大同东北）被匈奴冒顿单于四十万骑围困七日，靠陈平计脱围。白登之围使汉廷认识到无力以武力制服匈奴，直接促成汉匈和亲政策。
