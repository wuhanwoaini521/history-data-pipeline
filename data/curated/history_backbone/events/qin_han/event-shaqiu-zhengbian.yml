background_zh_cn: 七月丙寅，始皇崩于沙丘平台——主上崩于巡狩途中，遗诏未定。
process_zh_cn: 赵高故尝教胡亥书及狱律令法事、胡亥私幸之——赵高居中用事，与李斯合谋。
result_zh_cn: 「更为书赐公子扶苏、蒙恬，数以罪，赐死」——矫诏立胡亥、诛杀长兄与边将。
impact_zh_cn: 太子胡亥袭位为二世皇帝——沙丘之变以阴谋易嗣，秦政自此崩坏，天下随之瓦解。
