id: event-shaqiu-zhengbian
name_zh_cn: 沙丘政变（赵高矫诏、胡亥即位）
event_type: political
start_year: -210
end_year: -210
date_precision: year
period_id: period-qin
regime_ids: []
importance: major
summary_zh_cn: 前210年秦始皇病逝沙丘，临终诏令长子扶苏继位并主持丧事；中车府令赵高与丞相李斯合谋隐匿死讯，矫诏赐死扶苏、蒙恬，立少子胡亥为二世皇帝。此后赵高掌权，秦廷内部迅速失去稳定性，加速了秦政权的崩溃。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《史记·秦始皇本纪》《李斯列传》；现代参考：林剑鸣《秦史稿》（上海人民出版社）；翦伯赞《秦汉史》（北京大学出版社）；张岂之主编《中国历史·秦汉魏晋南北朝卷》；白寿彝总主编《中国通史》
