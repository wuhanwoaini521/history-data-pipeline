summary_zh_cn: 汉哀帝去世（前1年）后无嗣，太后王政君与王莽共立中山王（汉平帝），王莽复任大司马、录尚书事，重新执掌朝政，遂成西汉末年的实际掌权者。王莽此后声望日隆，逐步走向居摄与禅代。
