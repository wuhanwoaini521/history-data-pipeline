summary_zh_cn: 元兴元年（105年）和帝去世，邓太后与兄邓骘迎立殇帝、安帝，邓太后临朝称制近二十年（105—121年），邓氏一门贵宠，朝政大体得以维持而豪强、羌乱等矛盾积聚。邓太后去世后邓氏旋即被清算。
