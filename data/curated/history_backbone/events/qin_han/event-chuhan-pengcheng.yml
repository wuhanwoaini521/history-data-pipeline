background_zh_cn: 汉王以故得劫五诸侯兵，遂入彭城——项羽主力陷于齐地，刘邦乘虚东进占据楚都。
process_zh_cn: 项羽闻之，乃引兵去齐，从鲁出胡陵至萧，与汉大战彭城灵壁东睢水上，大破汉军，多杀士卒，睢水为之不流。
impact_zh_cn: 当是时，诸侯见楚彊汉败，还皆去汉复为楚，塞王欣亡入楚——刘邦集团惨败后收兵砀地，楚汉战争由局部冲突转为全面相持。
