summary_zh_cn: 公元18年（天凤五年），樊崇等聚众于泰山一带起义，以朱色涂眉为号，故称"赤眉军"。赤眉军与绿林军并行为新末两大起义力量，与新朝官军反复交战，后成为关东地区的强大反新势力。
