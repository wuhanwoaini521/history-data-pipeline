summary_zh_cn: 公元6年，汉平帝去世后王莽立孺子婴为皇太子，自任"假皇帝"、居摄践祚，改元居摄、初始，至公元8年（初始元年）十一月正式接受禅让称帝。居摄是王莽由辅政到代汉的关键过渡阶段。
