summary_zh_cn: 建宁二年（169年），宦官侯览等借张俭事案大兴党狱，李膺、范滂等百余人被下狱处死或自杀，妻子徙边，天下士人被禁锢者六七百人，党锢之祸达于极盛；直到中平元年（184年）黄巾起义爆发才大赦党人。第二次党锢使士大夫政治力量受到毁灭性打击，东汉政局进一步恶化。
