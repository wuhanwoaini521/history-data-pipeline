summary_zh_cn: 秦始皇二十六年（前221年）丞相王绾等主张分封诸子，廷尉李斯力主郡县制，始皇帝从之，废分封、行郡县，全国设三十六郡（后增至四十余郡）。郡县制是秦强化中央集权、代替世卿贵族分封的关键制度变革，成为中国此后两千余年地方行政的基本框架。
