summary_zh_cn: 前129年（元光六年），汉武帝派卫青、公孙敖等四路出击匈奴，其余三路多失利，唯卫青出上谷直捣龙城（匈奴祭天圣地）获捷。这是汉朝对匈奴的首次主动进攻并取胜，卫青自此崛起为抗匈主将。
