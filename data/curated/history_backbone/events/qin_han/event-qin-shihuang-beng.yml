background_zh_cn: 始皇东巡，至平原津而病。
process_zh_cn: 七月丙寅，始皇崩于沙丘平台。
result_zh_cn: 丞相李斯「为上崩在外，恐诸公子及天下有变，乃秘之，不发丧」——沙丘秘丧。
impact_zh_cn: 太子胡亥袭位为二世皇帝——始皇之死与继统之变，为秦末乱局之始。
