id: event-chensheng-wuguang-qiyi
name_zh_cn: 陈胜吴广起义
event_type: rebellion
start_year: -209
end_year: -209
date_precision: year
period_id: period-qin
regime_ids: []
importance: major
summary_zh_cn: 秦二世元年（前209年）七月，戍卒陈胜、吴广在蕲县大泽乡（今安徽宿州一带）揭竿起义，提出"王侯将相宁有种乎"，建立张楚政权，各地反秦力量纷纷响应。这是中国历史上第一次大规模农民起义，拉开了秦末战争的序幕。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《史记·陈涉世家》；现代参考：林剑鸣《秦史稿》（上海人民出版社）；翦伯赞《秦汉史》（北京大学出版社）；张岂之主编《中国历史·秦汉魏晋南北朝卷》；白寿彝总主编《中国通史》
