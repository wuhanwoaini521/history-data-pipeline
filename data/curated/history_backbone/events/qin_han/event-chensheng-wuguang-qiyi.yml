summary_zh_cn: 秦二世元年（前209年）七月，戍卒陈胜、吴广在蕲县大泽乡（今安徽宿州一带）揭竿起义，提出"王侯将相宁有种乎"，建立张楚政权，各地反秦力量纷纷响应。这是中国历史上第一次大规模农民起义，拉开了秦末战争的序幕。
