summary_zh_cn: 前68年霍光去世，汉宣帝逐渐收权；前66年（地节四年），宣帝以谋反罪族诛霍氏，废皇后霍氏，霍氏当权时代终结。此后皇权回归，宣帝亲政，出现"中兴"局面。
