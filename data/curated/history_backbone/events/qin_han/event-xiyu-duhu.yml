summary_zh_cn: 前60年（神爵二年），匈奴日逐王降汉，汉朝以郑吉为西域都护，立幕府于乌垒城，管辖西域三十六国，西域自此正式纳入汉朝行政统辖体系。西域都护为汉朝管理西域的最高长官制度，一直延续到西汉末。
