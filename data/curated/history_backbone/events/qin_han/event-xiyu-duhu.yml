summary_zh_cn: 前60年（神爵二年），匈奴日逐王降汉，汉朝以郑吉为西域都护，立幕府于乌垒城，管辖西域三十六国，西域自此正式纳入汉朝行政统辖体系。西域都护为汉朝管理西域的最高长官制度，一直延续到西汉末。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《汉书·西域传》《郑吉传》；现代参考：翦伯赞《秦汉史》（北京大学出版社）；吕思勉《秦汉史》（上海古籍出版社）；田余庆《秦汉魏晋史探微》（北京大学出版社）；张岂之主编《中国历史·秦汉魏晋南北朝卷》
