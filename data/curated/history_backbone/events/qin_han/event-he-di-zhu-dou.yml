summary_zh_cn: 永元四年（92年），汉和帝与外兄宦官郑众等合谋，收捕窦宪及其党羽，窦宪自杀，窦氏外戚集团覆灭。此事件中宦官首次参与废立式政治行动并获封侯，东汉"外戚—宦官"交替掌权的政治格局自此展开。
