summary_zh_cn: 公元57年光武帝去世，太子刘庄即位，是为汉明帝。明帝朝继承光武政策，吏治严明，对外经营西域（窦固北征、班超出使），并诏令迎佛经（"永平求法"），东汉由此进入明章时期。
quality_status: reviewed
