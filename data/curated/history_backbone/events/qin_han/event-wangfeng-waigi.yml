summary_zh_cn: 前33年汉元帝去世，成帝即位，太后王政君之兄王凤任大司马大将军领尚书事，王氏外戚自此执掌朝政，一门十侯，王莽亦由此家族登上政治舞台。王氏家族崛起是西汉末年权力中枢转移的关键节点。
