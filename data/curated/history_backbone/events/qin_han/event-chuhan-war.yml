summary_zh_cn: 楚汉战争指前206年至前202年项羽楚政权与刘邦汉政权争夺天下的战争过程：自鸿门宴后的政治对抗、彭城之战、荥阳对峙至垓下决战，刘邦最终获胜。本事件为 aggregate，子事件（鸿门宴/彭城之战/荥阳对峙/垓下之战）通过 part_of 关联；各子事件沿用已审核的楚汉 Story Event，不重复建档。
