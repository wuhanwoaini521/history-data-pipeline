summary_zh_cn: 顺帝、冲帝、质帝、桓帝前期，梁冀以外戚为大将军执掌朝政十余年（约144—159年），废立冲质桓三帝、毒杀质帝，权倾天下；延熹二年（159年）汉桓帝与宦官单超等合谋收捕梁冀，梁氏被族灭，梁冀家产没入官府，宦官五侯自此掌权。
