importance: critical
summary_zh_cn: 公元9年（初始元年十二月/始建国元年），王莽接受刘氏禅让称帝，改国号曰"新"，废汉朝年号，西汉刘氏统治终结。王莽代汉是中国历史上第一次以外戚身份通过禅让程序改朝换代，也是西汉外戚政治的终局。关于称帝年份存在两说：一按初始元年（公元8年）计、一按始建国元年（公元9年）计，属争议年代（DISPUTED）；本条系年取公元9年，与《汉书·王莽传》纪年一致。
