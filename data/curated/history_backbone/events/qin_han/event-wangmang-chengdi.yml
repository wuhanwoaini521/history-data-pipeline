summary_zh_cn: 公元9年（初始元年十二月/始建国元年），王莽接受刘氏禅让称帝，改国号曰"新"，废汉朝年号，西汉刘氏统治终结。王莽代汉是中国历史上第一次以外戚身份通过禅让程序改朝换代，也是西汉外戚政治的终局。
