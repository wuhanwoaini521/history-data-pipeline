process_zh_cn: 其令安汉公居摄践祚，如周公故事，以武功县为安汉公采地；莽惶惧不能食，昼夜抱孺子告祷郊庙，放《大诰》作策，谕以摄位当反政孺子之意。
impact_zh_cn: 「疏远欲进者并作符命，莽遂据以即真」；既即真，尤备大臣、抑夺下权——王莽由摄政至真皇帝，西汉以「禅让」形式易姓，开后世权臣代汉之先例。
