summary_zh_cn: 刘邦初都洛阳，经娄敬（刘敬）谏言与张良支持，前202年起定都关中；前200年未央宫落成，长安正式成为汉朝都城。长安自此为西汉政治中心二百余年，并发展为当时东亚最大都市。
