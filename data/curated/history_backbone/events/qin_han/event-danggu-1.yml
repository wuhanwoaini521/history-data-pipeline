name_zh_cn: 第一次党锢之祸
event_type: political
start_year: 166
end_year: 167
date_precision: range
period_id: period-eastern-han
regime_ids: []
importance: major
summary_zh_cn: 延熹九年（166年），宦官集团以"结党诽谤朝政"之名逮捕李膺、陈蕃、杜密等二百余人，是为第一次党锢；次年（167年）在窦武等请求下赦还田里，但禁锢终身不得仕。党锢是东汉后期士人（清流）与宦官斗争的总爆发，也是东汉政治危机的标志。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《后汉书·党锢列传》；现代参考：翦伯赞《秦汉史》（北京大学出版社）；何兹全《秦汉史略》及近人秦汉史专著；张岂之主编《中国历史·秦汉魏晋南北朝卷》；另见田余庆《秦汉魏晋史探微》
