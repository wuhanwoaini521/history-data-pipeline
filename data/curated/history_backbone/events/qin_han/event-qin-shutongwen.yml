summary_zh_cn: 秦始皇统一文字，以秦小篆为正字标准推行全国，废除六国异体文字；同时程邈所整理之隶书亦在实际使用中普及。书同文结束了战国文字异形的状态，是秦统一文化制度的标志性措施之一。
