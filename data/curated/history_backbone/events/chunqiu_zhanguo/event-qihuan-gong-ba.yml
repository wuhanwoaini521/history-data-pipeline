summary_zh_cn: 齐桓公以"尊王攘夷"为旗号会盟诸侯，北御戎狄、南阻楚国，成为春秋第一位霸主，葵丘之会（前651年）达到霸业顶点。齐桓公霸权奠定了春秋"霸主政治"的基本格局。
