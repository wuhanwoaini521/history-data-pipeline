summary_zh_cn: 郑庄公在位（前743—前701年）期间，内平共叔段之乱，外联齐鲁，多次与周王室冲突并一度击败王师，郑国成为春秋初年最强诸侯，史称"郑庄公小霸"。此阶段标志王室与诸侯力量对比的逆转。
