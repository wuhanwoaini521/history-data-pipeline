  description_zh_cn: 邲之战胜晋为楚庄王霸业确立的关键

background_zh_cn: 宣公十二年，楚子围郑，晋荀林父帅师救之，诸卿并出：赵括、赵婴齐为中军大夫，巩朔、韩穿为上军大夫，荀首、赵同为下军大夫，军令不一。闻晋师既济，楚王欲还，嬖人伍参欲战，令尹孙叔敖弗欲，曰「昔岁入陈，今兹入郑，不无事矣」；其佐先縠刚愎不仁，未肯用命，赵括、赵同亦曰「率师以来，唯敌是求」——晋军将帅异议，战守不决。
process_zh_cn: 楚师既出陈，晋师犹疑不进：彘子（先縠）以为谄，使赵括从而更之，曰「行人失辞」，遂违命而济。楚人亦惧王之入晋军也，乃悉师以出。六月乙卯，晋荀林父帅师及楚子战于邲，楚军骤至，晋师不能成列而败。及昏，楚师军于邲，晋之余师不能军，宵济，亦终夜有声；丙辰，楚重至于邲，遂次于衡雍。
result_zh_cn: 晋师败绩，晋人讨邲之败，归罪于先縠而杀之，尽灭其族；郑人惧于邲之役而求媚于晋，晋侯复伐郑，为邲故也。成公三年春，诸侯伐郑，次于伯牛，讨邲之役也，遂东侵郑——邲之一败，晋之诸侯之盟遂衰，楚庄王遂霸。
impact_zh_cn: 邲之战为晋楚争霸之转折：晋军内部分歧致丧师，先縠以违命灭族，晋卿专权之弊暴露无遗；楚庄王既胜于邲而威震中原，饮马黄河之志遂伸，晋楚争霸由此进入楚势全盛之期，至鞌之战、鄢陵之战乃复相攻。
