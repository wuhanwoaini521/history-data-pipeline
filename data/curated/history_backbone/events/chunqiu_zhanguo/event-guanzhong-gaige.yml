  description_zh_cn: 管仲改革成就齐桓公霸业

background_zh_cn: 管仲夷吾，颍上人，少与鲍叔牙游而鲍叔知其贤；鲍叔事公子小白，管仲事公子纠。及小白立为桓公，公子纠死，管仲囚焉，鲍叔遂进管仲——齐太公世家记桓公中钩佯死、先入而立，「召忽、管仲雠也，请得而甘心醢之」，鲁人杀子纠而管仲请囚，桓公卒置射钩之仇而使之为相。
process_zh_cn: 管仲既任政相齐，以区区之齐在海滨，通货积财，富国强兵，与俗同好恶；其称曰「仓廪实而知礼节，衣食足而知荣辱，上服度则六亲固」，下令如流水之原，令顺民心，其为政善因祸而为福、转败而为功，贵轻重、慎权衡。国语·齐语载其定民之居：制国以为二十一乡，工商之乡六、士农之乡十五，公与国子、高子各帅五乡；又「作内政而寄军令」，军政合一。
result_zh_cn: 管仲既用，任政于齐，齐桓公以霸，九合诸侯，一匡天下，管仲之谋也；周襄王时桓公使管仲平戎于周，王以上卿之礼享管仲，管仲辞曰「臣贱有司也」，卒受下卿之礼而还——尊王而不僭，霸业以固。僖公十七年，管仲卒，五公子皆求立，齐国内乱，霸业中衰。
impact_zh_cn: 管仲之政以富国足民为本、以军政合一为用，齐桓之霸业实赖其纪纲齐国、裨辅先君——晋人论之曰「此大夫管仲之所以纪纲齐国，裨辅先君而成霸者也」；其「仓廪实而知礼节」之论与通货积财之术，为后世法家与轻重之学所自出，春秋霸政之规模自此立。
