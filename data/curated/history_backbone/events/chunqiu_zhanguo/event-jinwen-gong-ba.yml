id: event-jinwen-gong-ba
name_zh_cn: 晋文公称霸
event_type: political-military
start_year: -636
end_year: -628
date_precision: range
period_id: period-spring-autumn
regime_ids: []
importance: major
summary_zh_cn: 晋文公重耳流亡十九年后回国即位（前636年），改革内政、整顿军制，经城濮之战（前632年）败楚、践土之盟受天子策命，成为齐桓公之后第二位公认的霸主。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《左传·僖公二十三至二十八年》；现代参考：童书业《春秋史》（上海人民出版社）；张岂之主编《中国历史·先秦卷》；白寿彝总主编《中国通史》
