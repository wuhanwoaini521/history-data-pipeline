- work-curated-zuozhuan
relations:
- target_event_id: event-qihuan-gong-ba
  relation_type: follows
  confidence: 0.7
  description_zh_cn: 春秋霸主政治的先霸与继霸：齐桓公以尊王攘夷、会盟诸侯（葵丘之会）首创霸政模式，晋文公城濮胜楚后践土会盟接续主盟中原，为齐桓之后第二位公认霸主。
- target_event_id: event-chengpu-zhizhan
  relation_type: caused_by
  confidence: 0.9
  description_zh_cn: 城濮之战（前632）晋败楚直接确立晋文公霸业——同年五月践土之盟受天子策命，霸业由此而成。
- target_event_id: event-chuzhuang-wang-ba
  relation_type: precedes
  confidence: 0.7
  description_zh_cn: 晋文公霸业（前636—前628）先于楚庄王霸业（前613—前591），二者构成春秋晋楚争霸的前后两章。
background_zh_cn: 楚围宋急，晋文公救宋而攻楚之与国：二十有八年（前632）春，晋侯侵曹、伐卫，假道于卫不获；楚人出兵救卫，晋楚两军相向。
process_zh_cn: 三月丙午，晋侯入曹，执曹伯，畀宋人；夏四月己巳，晋侯、齐师、宋师、秦师及楚人战于城濮，楚师败绩。楚杀其大夫得臣，卫侯出奔楚。
result_zh_cn: 五月癸丑，公会晋侯、齐侯、宋公、蔡侯、郑伯、卫子、莒子盟于践土，陈侯如会；晋文公率诸侯朝于王所——践土之盟确立晋国盟主之位，晋文公霸业告成。
impact_zh_cn: 是年冬，公会晋侯、齐侯、宋公、蔡侯、郑伯、陈子、莒子、邾子、秦人于温——城濮胜后晋国以会盟号召诸侯的霸政体制持续运转，晋国自此长期为中原盟主。
