id: event-qin-tongyi
name_zh_cn: 秦统一六国（秦帝国建立）
event_type: unification
start_year: -221
end_year: -221
date_precision: year
period_id: period-warring-states
importance: critical
summary_zh_cn: 前221年，秦王政兼并六国后自称"始皇帝"，建立中国历史上第一个中央集权的统一帝国，行郡县、书同文、车同轨、统一度量衡（制度层面细节另见秦汉批）。秦统一是先秦历史的终结，也是中国大一统格局的开端。
background_zh_cn: 秦初并天下，令丞相、御史曰「异日韩王纳地效玺，请为藩臣，已而倍约，与赵、魏合从畔秦，故兴兵诛之，虏其王」——以武功告成而议正名；既而制曰「朕为始皇帝」，欲以二世三世传之无穷。名号之议既定，制度之更乃次第施行。
result_zh_cn: 秦以郡县守尉监之制代封建诸侯，中央集权之官僚帝国形态自此立；「一法度衡石丈尺」「书同文字」「车同轨」并见《史记·秦始皇本纪》，六国异制归于一统，中国第一次以统一帝国的形态完成内部整合。
