process_zh_cn: 秦初并天下，令丞相、御史曰「异日韩王纳地效玺……故兴兵诛之，虏其王」——以武功告成议帝号；分天下以为三十六郡，郡置守、尉、监。
impact_zh_cn: 统一制度次第颁行：一法度衡石丈尺、书同文字、车同轨——「百代都行秦政法」，中国第一次以中央集权帝国形态完成整合。
