process_zh_cn: 统一之制次第颁行：分天下以为三十六郡，郡置守、尉、监，以郡县代封建；一法度衡石丈尺，以齐度量之器；书同文字，以秦篆画一六国之文；车同轨，以通天下之路——文字、度量衡、道路、政区皆归于一，中央之令直达郡县。
impact_zh_cn: 统一制度之颁行为中国历史之枢纽：此后二千年虽朝代更迭，而郡县、文书、度量衡与文字之统一框架皆为常制，「百代都行秦政法」之谓由此而来；秦虽二世而亡，其制则历汉唐而不改。
