summary_zh_cn: 楚庄王在位（前613—前591年）期间，"一鸣惊人"整顿内政，问鼎中原、败晋于邲，成为继齐桓、晋文后第三代霸主，楚国势力达到鼎盛。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《史记·楚世家》《左传》；现代参考：童书业《春秋史》（上海人民出版社）；张岂之主编《中国历史·先秦卷》；白寿彝总主编《中国通史》
