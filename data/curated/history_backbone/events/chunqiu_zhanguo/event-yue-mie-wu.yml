summary_zh_cn: 前473年，越王勾践经"十年生聚、十年教训"后灭吴，吴王夫差自杀，吴国灭亡。越军随后北略齐、晋，会盟诸侯，勾践成为春秋最后一位霸主。本事件为吴越争霸的收尾节点，按项目 taxonomy（战国起始前475年）归属战国初段，传统《春秋》叙事多将其并入春秋末期主题。
