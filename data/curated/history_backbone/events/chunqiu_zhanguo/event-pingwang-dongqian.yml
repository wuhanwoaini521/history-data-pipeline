summary_zh_cn: 前770年，周平王在申侯等拥立下东迁都于洛邑（成周），史称"平王东迁"，东周自此开始，春秋时代开启。迁都后王室权威跌落，诸侯坐大，中国历史进入列国争霸格局。《左传》所记"王入于成周"经天文历法考证兑为前770年1月11日。
