background_zh_cn: 定公四年，蔡侯、吴子与楚人构兵：春，公会刘子、晋侯、宋公、蔡侯等于召陵，侵楚；夏，蔡公孙姓帅师灭沈，楚人围蔡——蔡怨楚而请师于吴。吴阖庐久蓄入楚之志，伍员、孙武为之谋；楚令尹子常（囊瓦）贪而失信，其臣莫有死志，楚师自小别至于大别三战皆不利，子常知不可而欲奔。
process_zh_cn: 冬十有一月庚午，二师陈于柏举。阖庐之弟夫槩王晨请于阖庐曰：「楚瓦不仁，其臣莫有死志，先伐之，其卒必奔，而后大师继之，必克。」弗许。夫槩王曰：「所谓臣义而行，不待命者，其此之谓也。今日我死，楚可入也。」乃以其属五千先击子常之卒，子常之卒奔，楚师乱，吴师大败之。
result_zh_cn: 子常奔郑，史皇以其乘广死——楚之令尹既走，大军遂溃；吴人五战及郢，败诸雍澨，庚辰，吴入郢，以班处宫。定公五年，吴人获薳射于柏举，其子帅奔徒以从子西，败吴师于军祥；秋七月，子期、子蒲灭唐——楚虽失郢而秦师来援，吴师乃退。
impact_zh_cn: 柏举之战为春秋后期吴楚强弱之枢：吴以偏师深入，五战入郢，几亡楚国；楚大夫后追论之曰「阖庐惟能用其民，以败我于柏举」，可见其创痛之深。楚迁都于鄀以避吴锋，吴亦因秦楚之反攻而未得全胜，东南两大国之争自此益烈，卒有吴越迭兴之局。
