summary_zh_cn: 前506年，吴王阖闾率孙武、伍子胥等攻楚，在柏举（今湖北麻城一带）大败楚军，五战入郢（楚国都）。楚几乎灭亡，后赖秦救得复国。此役为春秋末期最大规模战争之一。
