summary_zh_cn: 前536年，郑国执政子产将刑书铸于鼎上公之于众，史称"子产铸刑书"，是中国历史上第一次公布成文法。此举打破贵族秘刑传统，是春秋后期礼制变革与法治萌发的重要标志。
