summary_zh_cn: 前284年，燕昭王以乐毅为将，联合秦、赵、韩、魏五国伐齐，连下七十余城，齐湣王被杀，齐国仅存莒、即墨二城。齐从此由东方最强沦为二等国家，列国均势剧变。
