summary_zh_cn: 田齐桓公（田午）在位（约前374—前357年）期间在临淄稷门设学宫，招揽诸子讲学议政，其后威王、宣王时极盛。稷下学宫是战国百家争鸣的中心场所，收录、论辩各家学说，为齐文化与诸子思想繁荣提供制度平台。
