summary_zh_cn: 齐魏再战于马陵（今山东郯城一带），孙膑以"减灶示弱"之计诱敌，魏将庞涓败死，魏军主力覆没。此役后魏国霸权彻底丧失，齐国崛起为东方强国。年代有前341年（《史记》系年）与前342年（《竹书纪年》系年）两说。
