background_zh_cn: 当魏文侯时，李克务尽地力——魏国率先以「尽地力之教」富国。
process_zh_cn: 魏有李悝，「尽地力之教」：教民勤于农事、地尽其利，以农富国。
result_zh_cn: 魏用李克、尽地力，为强君——魏国由是富强，为战国初期首强。
impact_zh_cn: 李悝尽地力之教开列国变法之先声（其后商鞅变法即承此路径），魏之富强为战国变法时代揭幕。
