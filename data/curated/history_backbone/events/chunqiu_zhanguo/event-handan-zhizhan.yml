summary_zh_cn: 前259年至前257年，秦军长期围攻赵都邯郸，赵无力支撑，魏信陵君窃符救赵、楚春申君来援，秦军大败而还。邯郸之战使秦的统一推迟了近三十年，也是"窃符救赵"故事的史实背景。
