summary_zh_cn: 燕王哙约前316年让位于相国子之，引发燕国内乱，齐军乘机伐燕（前314年），燕国几亡，靠燕人反抗与诸侯干预得复国。此事件暴露列国变法与权力继承的激烈矛盾。
