id: event-qin-mie-liuguo
name_zh_cn: 秦灭六国
event_type: unification
start_year: -230
end_year: -221
date_precision: range
period_id: period-warring-states
importance: critical
summary_zh_cn: 秦王政自前230年灭韩起，历经十年，先后灭韩、赵、燕、魏、楚、齐，至前221年完成统一。秦灭六国结束战国数百年的兼并局面，是秦统一战争的总体进程（aggregate event，各阶段灭国节点见其 part_of 子事件）。
background_zh_cn: 战国晚期，秦以远交近攻次第蚕食：兵未罢而将军王翦、桓齮、杨端和伐赵，攻邺取九城，王翦攻阏与、轑阳，桓齮取邺、安阳——赵之边城日削。秦王政既立，内史腾、王翦、蒙武并用，六国合从已不能成，灭国之机遂至。
result_zh_cn: 六王毕而四海一：韩、赵、燕、魏、楚、齐次第而亡，其地皆为郡县。《史记》记韩王「纳地效玺，请为藩臣，已而倍约，与赵、魏合从畔秦，故兴兵诛之，虏其王」；又记「十九年，王翦、羌瘣尽定取赵地东阳，得赵王」「齐王用后胜计，绝秦使，欲为乱，兵吏诛，虏其王，平齐地」。
