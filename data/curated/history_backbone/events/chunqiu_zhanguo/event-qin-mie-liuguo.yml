process_zh_cn: 秦王政之世次第灭六国：十七年韩王纳地效玺请为藩臣，已而倍约，秦兴兵诛之、虏其王；十九年王翦、羌瘣尽定取赵地东阳，得赵王；其后灭魏、灭楚，二十五年虏燕王；二十六年齐王用后胜计绝秦使，兵吏诛之、虏其王，平齐地。
impact_zh_cn: 六王毕而四海一：秦初并天下，令丞相、御史议帝号，分天下以为三十六郡，郡置守、尉、监——封建诸侯之局终结，郡县帝国自此建立。
