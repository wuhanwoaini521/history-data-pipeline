process_zh_cn: 秦王政之世次第灭六国：十七年，内史胜灭韩，虏韩王安，以其地置颍川郡；十九年，王翦将上地兵下井陉，端和将河内兵共伐赵，王翦击赵军大破之，杀赵葱、颜聚亡，遂克邯郸，虏赵王迁；王翦屯中山以临燕。其后灭魏、灭楚，二十五年虏燕王；二十六年，齐王用后胜计绝秦使，兵吏诛之、虏其王，平齐地。
impact_zh_cn: 秦灭六国结束战国数百年兼并之局，封建诸侯之世自此终结；并为次年「分天下以为三十六郡，郡置守、尉、监」与文字、度量衡、车轨之画一奠定前提。此后二千年中国之统一王朝皆以郡县帝国为常轨，秦之灭六国实为其始。
