summary_zh_cn: 前354年魏军围困赵都邯郸，前353年齐将田忌、军师孙膑以"围魏救赵"之策截击魏军于桂陵（今河南长垣一带），大败魏军。此役为"围魏救赵"战法经典，齐国开始挑战魏国霸权。
