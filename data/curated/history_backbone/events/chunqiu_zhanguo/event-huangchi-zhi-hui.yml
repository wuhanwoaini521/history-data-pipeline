summary_zh_cn: 前482年，吴王夫差率精锐北上黄池（今河南封丘一带）与晋争盟主，越王勾践趁机袭吴，吴国腹背受敌。黄池之会虽使夫差夺得盟主名号，却是吴国王权由盛转衰的转折点。
