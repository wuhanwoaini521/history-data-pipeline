id: event-shangyang-bianfa
name_zh_cn: 商鞅变法
event_type: reform
start_year: -356
end_year: -350
date_precision: range
period_id: period-warring-states
regime_ids: []
importance: major
summary_zh_cn: 秦孝公任用商鞅两次变法（前356年、前350年）：废井田、开阡陌，推行县制、军功爵制，统一度量衡并迁都咸阳，秦国自此建立耕战强国体制。商鞅变法是战国影响最深远的制度变革，为秦统一奠定根本基础。
quality_status: reviewed
source_type: curated_reference
