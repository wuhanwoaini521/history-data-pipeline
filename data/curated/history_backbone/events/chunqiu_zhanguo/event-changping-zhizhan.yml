summary_zh_cn: 前260年，秦将白起与赵括在长平（今山西高平一带）决战，赵军主力被围歼，赵国从此一蹶不振。此役是战国战争烈度巅峰，消灭了关东唯一可与秦抗衡的军事力量，秦统一六国的格局由此基本锁定。关于赵军伤亡数目，史书记载并不一致：《史记》各篇传"四十五万"与"四十万"等异说并存，诸史家论述亦有差异，属争议数字（DISPUTED），如实保留，不取单一之说。
