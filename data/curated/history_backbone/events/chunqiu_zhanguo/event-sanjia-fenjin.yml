summary_zh_cn: 前403年，周威烈王正式册命韩、赵、魏三家为诸侯，晋国分裂为三国，史称"三家分晋"。《资治通鉴》以此为战国时代的开端。此事件标志世卿执政卿大夫夺权的制度性完成，列国兼并战争的新格局自此全面展开。
