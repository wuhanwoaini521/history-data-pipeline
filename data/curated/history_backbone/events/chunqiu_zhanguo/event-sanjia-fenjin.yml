summary_zh_cn: 前403年，周威烈王正式册命韩、赵、魏三家为诸侯，晋国分裂为三国，史称"三家分晋"。《资治通鉴》以此为战国时代的开端。此事件标志世卿执政卿大夫夺权的制度性完成，列国兼并战争的新格局自此全面展开。
background_zh_cn: 晋自文公以后政权下移、卿族递兴：哀公四年，赵襄子、韩康子、魏桓子共杀知伯，尽并其地；三家分智氏之田，赵襄子漆智伯之头以为饮器——晋国名存而实亡。《史记》又追记曲沃武公赂周厘王而得「列为诸侯」之事，以见晋之兴替皆系于周室之名分。
result_zh_cn: 三家既立，战国七雄之格局由此奠定；《通鉴》记「三家分智氏之田」与「初命晋大夫魏斯、赵籍、韩虔为诸侯」两事相承，赵、魏、韩皆以卿族升为诸侯，此后田氏代齐继之，战国兼并之局全面展开。
