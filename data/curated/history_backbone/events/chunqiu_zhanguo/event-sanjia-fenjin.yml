process_zh_cn: 至周威烈王二十三年，「初命晋大夫魏斯、赵籍、韩虔为诸侯」——三家由晋之世卿受天子册命而立国；名分既正，遂与齐、楚、燕、秦列于诸侯，晋君反朝于韩、赵、魏之君，晋地尽分而晋祀遂绝。
impact_zh_cn: 司马光论之曰「君臣之礼既坏矣，则天下以智力相雄长，遂使圣贤之后为诸侯者，社稷无不泯绝」——三家分晋被视为战国之始：礼崩乐坏、兼并大幕由此拉开，世卿政治与名分秩序之崩解遂不可挽。
