background_zh_cn: 韩魏联军攻秦（佐韩攻秦），战于伊阙——秦东出之要冲。
process_zh_cn: 其明年，白起为左更，攻韩、魏于伊阙，斩首二十四万，又虏其将公孙喜，拔五城。
result_zh_cn: 秦使白起伐韩于伊阙，大胜，斩首二十四万——韩魏主力尽丧于伊阙之下。
impact_zh_cn: 魏世家载「秦将白起败我军伊阙二十四万」——韩魏自此衰弱，秦国东出中原之势不可复遏。
