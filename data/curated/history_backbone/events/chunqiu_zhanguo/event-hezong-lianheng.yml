relations:
- target_event_id: event-shangyang-bianfa
  relation_type: follows
  confidence: 0.7
  description_zh_cn: 合纵因秦强而生：商鞅变法后「秦人富彊，天子致胙，诸侯毕贺」，力量对比转为「诸侯之地五倍於秦」而秦独强，苏秦遂倡六国并力西向以抗秦。
- target_event_id: event-zhangyi-po-chu
  relation_type: precedes
  confidence: 0.7
  description_zh_cn: 合纵既成，秦以连横破从相抗：张仪连横欺楚（前313）为连横离间从约的代表行动，属同一纵横外交格局。
- target_event_id: event-qin-mie-liuguo
  relation_type: leads_to
  confidence: 0.5
  description_zh_cn: 从亲/衡合两策对峙为战国中后期列国外交主轴；合纵最终被秦瓦解、六国被各个击破，秦统一是这场地缘外交博弈的终局。
background_zh_cn: 秦强而诸侯弱：苏秦按天下地图案之，「诸侯之地五倍於秦，料度诸侯之卒十倍於秦」，主张「六国为一，并力西乡而攻秦，秦必破矣」；否则从亲则诸侯割地事楚、衡合则楚割地事秦，两策对峙为战国外交基本格局。
process_zh_cn: 苏秦先后说燕、赵等国，赵肃侯封为武安君；说楚王以「秦，虎狼之国，不可亲也」动之，楚王自陈「谨奉社稷以从」。於是六国从合而并力，苏秦为从约长，并相六国，乃投从约书于秦。
result_zh_cn: 合纵既成，「秦兵不敢闚函谷关十五年」——秦国东出被合纵封锁十五年。
impact_zh_cn: 其后秦使犀首欺齐、魏，与共伐赵，欲败从约——合纵自此始遭离间；而「从亲/衡合」两策自此成为战国中后期列国外交与纵横家活动的主轴。
