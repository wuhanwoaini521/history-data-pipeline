summary_zh_cn: 前651年，齐桓公在葵丘（今河南民权一带）会盟鲁、宋、卫、郑、许、曹诸国，周襄王亦遣使赐胙，齐桓公霸业达到顶峰，史称"葵丘之会"。此后齐桓公的影响力逐渐衰退。
