summary_zh_cn: 前632年，晋文公率晋、宋、齐、秦联军在城濮（今山东鄄城一带）大败楚军，楚成王北进受阻。此役奠定晋国霸权，是春秋时代规模最大、影响最深的会战之一，战后晋文公在践土会盟诸侯、受周天子册命。
