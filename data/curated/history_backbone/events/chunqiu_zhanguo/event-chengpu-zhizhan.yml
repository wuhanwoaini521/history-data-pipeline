background_zh_cn: 僖公二十八年春，晋侯侵曹、伐卫，以救宋而报楚；楚人救卫，晋侯入曹、执曹伯畀宋人，晋楚之隙遂成。先是晋文公出亡过楚，楚成王礼之，文公有「退三舍辟之」之诺——战前子犯、栾枝皆以「战而捷，必得诸侯」为言，晋侯梦与楚子搏，子犯占之曰吉，决战之意乃决。
process_zh_cn: 夏四月戊辰，晋侯、宋公、齐国归父崔夭、秦小子慭次于城濮；子玉使鬥勃请战曰「请与君之士戏」，晋侯使栾枝对之。晋师退三舍以报楚惠，楚众欲止而子玉不可；己巳，晋师陈于莘北：胥臣蒙马以虎皮先犯陈、蔡，陈蔡奔而楚右师溃；狐毛设二旆而退之，栾枝使舆曳柴而伪遁，楚师驰之，原轸、郤溱以中军公族横击之，狐毛、狐偃以上军夹攻子西，楚左师亦溃。
result_zh_cn: 楚师败绩，唯子玉收其卒而止，故不败；晋师三日馆穀，及癸酉而还。甲午至于衡雍，作王宫于践土；五月丙午晋侯及郑伯盟于衡雍，丁未献楚俘于王——驷介百乘、徒兵千，郑伯傅王，用平礼也。己酉，王享醴，命晋侯宥——践土之会，晋文公遂为诸侯之伯。
impact_zh_cn: 城濮一战胜楚而晋霸业成，践土之盟周王策命晋侯为侯伯，「九合诸侯」之局由是开端；左氏记城濮之役「晋师三日穀，文公犹有忧色」，可见胜而愈慎；至成公二年晋人犹以「此城濮之赋也」追述其军赋之旧——晋楚争霸之格局自此绵延百余年。
