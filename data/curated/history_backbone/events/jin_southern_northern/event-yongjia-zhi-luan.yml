background_zh_cn: 永嘉间，怀帝下诏重述齐王冏唱义元勋，而朝政实为东海王越所专；越收兵下邳、西迎大驾而弃京师，八王相攻既久，中原兵力空虚。惠帝之世，京师洛川之外郡县残破，胡骑已逼畿甸，祸变之机日迫，而朝廷犹内争不已。
result_zh_cn: 怀帝蒙尘于平阳，司空荀籓等移檄天下、推琅邪王睿为盟主；志载「怀帝为刘曜所围，王师累败，府帑既竭，百官饥甚，比屋不见火烟，饥人自相啖食」——京师既陷，中原士民相率南渡，晋室之存亡系于江左。
process_zh_cn: 永嘉五年（311年）六月，「刘曜、王弥、石勒同寇洛川，王师频为贼所败，死者甚众」；丁酉，刘曜、王弥入京师，帝开华林园门出河阴藕池、欲幸长安，为曜等所追及；曜等遂焚烧宫庙，逼辱妃后，吴王晏、竟陵王楙及尚书左仆射等皆遇害——洛阳倾覆。
impact_zh_cn: 永嘉之乱为西晋覆亡之始，亦为中国政治中心首次大规模南移之枢：洛阳既陷，长安孤悬六载而亦亡；衣冠士族随之南迁，「自永嘉之乱，神州倾覆」遂成后世追述之痛，东晋南朝与十六国之局皆肇于此。
