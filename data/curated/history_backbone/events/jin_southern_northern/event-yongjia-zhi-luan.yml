summary_zh_cn: 永嘉五年至建兴四年（311—316年），汉赵军攻破洛阳（311年）、掳晋怀帝，其后又陷长安（316年）虏愍帝，西晋灭亡。永嘉之乱（本事件为过程 aggregate）标志西晋统治在北方的彻底崩溃与"衣冠南渡"之始。
