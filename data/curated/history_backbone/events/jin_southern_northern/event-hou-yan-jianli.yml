summary_zh_cn: 慕容垂于太元九年（384年）称燕王，重建燕政权（后燕），都中山。后燕吸取前秦复置诸州经验，一度控制河北、山东大部，是淝水后北方最强大的政权，最终败于北魏（参合陂之战）。
