summary_zh_cn: 永和十年至太和四年（354—369年）东晋权臣桓温三次北伐：354年伐前秦至灞上、356年收复洛阳、369年伐前燕败于枋头。桓温北伐使"桓温"成为门阀政治下东晋最有实力的军事领袖，其禅代意图最终被制。
