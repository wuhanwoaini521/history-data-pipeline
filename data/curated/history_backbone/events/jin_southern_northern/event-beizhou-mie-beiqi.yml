background_zh_cn: 周武帝以晋州为平齐之基：既拔晋州，执守臣之手曰「朕有晋州，为平齐之基，宜善守之」——伐齐之策已定于晋州一城。时北齐政乱，周军逼并州，又遣大将军达奚武帅众数万至东雍及晋州，与突厥相应，南北夹击之势既成。
result_zh_cn: 丁未，齐主至，周武帝「降自阼阶，以宾主之礼相见」——北齐后主为周所获，齐亡；周尽有齐地，北方复归一统，自东西魏分裂以来四十余年之局至此终结，诸将从平齐者皆进位受封，齐之州郡尽入于周。
process_zh_cn: 建德六年（577年），周武帝亲总大军东讨：先拔晋州、再克并州，长驱而东，直指邺城；北齐之众望风而溃，诸将从军攻晋州者以功授使持节、车骑将军，更论晋州及平齐之勋加骠骑大将军、开府仪同三司——战功之赏皆以平齐为最。
impact_zh_cn: 北周灭北齐使北方重归统一，为隋代周后平陈混一奠定基础；关陇之政既兼山东，府兵、均田诸制遂行于河北，隋之府兵制实由此大成，而周宣帝之后杨坚受禅建隋，齐之亡实启隋之兴，北方之统一乃南方统一之先声。
