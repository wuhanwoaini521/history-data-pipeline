background_zh_cn: 建兴四年（316年）八月，刘曜逼京师，「内外断绝」；镇西将军焦嵩、平东将军宋哲、始平太守竺恢等同赴国难，麹允与公卿守长安小城以自固，散骑常侍华辑、镇军将军胡崧各屯霸上、遮马桥，「并不敢进」——勤王之师观望，长安遂孤。
result_zh_cn: 愍帝蒙尘于平阳，七月崩于寇庭；《晋书》记「愍帝都长安，未及立郊庙而败」——西晋自武帝受禅凡五十二年而亡，宗庙未及立于长安，愍帝之降为汉赵所执，中原之晋室遂绝。
process_zh_cn: 城中困极：「怀帝为刘曜所围，王师累败，府帑既竭，百官饥甚，比屋不见火烟，饥人自相啖食」。十一月乙未，愍帝使侍中宋敞送笺于曜；帝乘羊车，肉袒衔壁，舆榇出降，群臣号泣攀车、执帝之手，帝亦悲不自胜，御史中丞吉朗自杀；曜焚榇受壁，使宋敞奉帝还宫。
impact_zh_cn: 西晋之亡使中原沦于胡骑，十六国纷争自此起；「自永嘉之乱，神州倾覆」，晋室南渡而立东晋于建康，中国进入南北分立之世，门阀政治、民族迁徙与胡汉融合之大局皆肇于此，隋唐统一之基亦伏于其中。
