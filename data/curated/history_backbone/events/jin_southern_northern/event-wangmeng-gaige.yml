summary_zh_cn: 苻坚在位前期（357—375年），王猛任中书令、司隶校尉等，整饬吏治、抑制豪强、劝课农桑、兴办学校，前秦经济军事实力大增。王猛改革是十六国时期少见而成功的汉族士人主持的制度改革。
