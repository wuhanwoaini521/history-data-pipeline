summary_zh_cn: 八王之乱初期，惠帝皇后贾南风于291年联合楚王玮诛杀杨骏夺权，继而专擅朝政十余年，300年为赵王伦所诛。贾后干政是八王之乱第一阶段的核心，反映外戚、后妃与宗室三方争夺皇权。
