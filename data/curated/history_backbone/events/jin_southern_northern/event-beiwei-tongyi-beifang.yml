summary_zh_cn: 太延五年（439年）北魏太武帝拓跋焘西征，克姑臧，北凉沮渠牧犍出降，十六国中最后一个政权被灭，北魏统一北方（此前已灭胡夏431、北燕436）。自此中国北方重归一统，与南方刘宋并峙，南北朝对峙格局正式确立。
