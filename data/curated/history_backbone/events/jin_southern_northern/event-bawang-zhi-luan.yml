background_zh_cn: 晋武帝惩魏氏孤立，大封宗室而假之兵权：以汝南王亮为大司马、大都督、假黄钺，诸王「并假节之国，各统方州军事」——藩屏之制既立，尾大之势亦成。武帝崩，杨骏排汝南王亮而独揽朝政，宗室与权臣之隙已开；遗诏留亮委以后事而骏从中书监索诏不还，亮惧骏疑己，辞疾不入。
result_zh_cn: 乱久而国力尽耗：东海王越收兵下邳、专朝政而弃京师，石勒追越丧于道，太尉王衍、武陵王澹等皆遇害，「王公已下死者十余万人」，东海世子及宗室四十八王寻又没于石勒。光熙元年惠帝崩、怀帝即位，越犹专权；八王之中无一能安晋室，所谓「籓屏式固，祸乱何以成其阶」者，正谓此也。
process_zh_cn: 杨骏之诛也，楚王玮屯司马门；玮少年果锐、多立威刑，汝南王亮与太保卫瓘以其性很戾不可大任，建议使与诸王之国，玮甚忿之。长史公孙宏、舍人岐盛遂因积弩将军李肇矫称玮命，谮亮、瓘于贾后；贾后使惠帝为诏废二公，亮、瓘皆被杀——八王相攻由是起。其后赵王伦、齐王冏、长沙王乂、成都王颖、河间王颙、东海王越相继执柄，十六年间兵连祸结。
impact_zh_cn: 史臣论曰「汝南以纯和之姿，失于无断；楚隐习果锐之性，遂成凶很……伦实庸琐，见欺孙秀，潜构异图，煽成奸慝」——八王之乱耗竭中原兵力，胡骑遂长驱而入，永嘉之祸、西晋之亡皆基于此；后世论晋室之败，未有不以八王为首祸者。
