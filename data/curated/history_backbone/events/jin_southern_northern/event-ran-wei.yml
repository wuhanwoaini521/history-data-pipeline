summary_zh_cn: 后赵石虎死后诸子争立，350年将领冉闵（石闵）据邺建立冉魏，其间发生针对胡羯的排压与屠杀（史称"杀胡"，后世史论对其性质多歧见），北方人口锐减、各族武装混战。352年冉魏为前燕慕容恪所灭。冉魏之短暂政权反映后赵崩溃后北方社会的极端动荡。
