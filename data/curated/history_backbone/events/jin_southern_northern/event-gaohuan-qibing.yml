summary_zh_cn: 531年高欢以东魏（河北）为基地起兵讨伐尔朱氏，532年攻入洛阳立孝武帝（北魏末帝）；534年孝武帝西奔长安投宇文泰，高欢另立孝静帝、迁都邺，北魏就此分裂为东西。高欢势力为后来东魏—北齐的政治军事基础。
