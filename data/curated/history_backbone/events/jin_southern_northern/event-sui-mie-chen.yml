background_zh_cn: 陈后主之世，「新失淮南之地，隋师临江，又国遭大丧，后主病疮，不能听政」，诛叔陵、供丧事、边境防守及百司众务皆决于皇太后——主幼国疑，江防日弛；隋将贺若弼先献取陈十策，文帝纳之，伐陈之谋遂决。
result_zh_cn: 陈亡：「及隋军陷台城，妃与后主俱入于井，隋军出之，晋王广命斩贵妃，榜于青溪中桥」；隋尽有陈地，自永嘉之乱以来近三百年之南北分裂至此终结，天下复归一统，江表士人皆入于隋，六朝旧都遂为隋之州县。
process_zh_cn: 开皇九年（589年）正月辛未，贺若弼拔陈京口，韩擒虎拔陈南豫州；丙子，贺若弼败陈师于蒋山，获其将萧摩诃；韩擒虎进师入建邺，获其将任蛮奴，获陈主叔宝——从韩擒虎、贺若弼两路并进，陈之江防一战而溃。
impact_zh_cn: 隋灭陈为魏晋南北朝之终、隋唐统一之始：南北制度、学术、文学由是合流，南朝文物入于关中，此后唐宋之盛皆以大一统为前提，三百年分裂之局既合，中国历史遂入新期，其影响且及于东亚。
