summary_zh_cn: 开皇九年（589年）隋文帝发五十一万大军南下，韩擒虎、贺若弼渡江克建康，陈后主被俘，陈朝灭亡。隋灭陈结束自西晋以来近三百年（280—589）的分裂局面，中国重新实现大一统。
