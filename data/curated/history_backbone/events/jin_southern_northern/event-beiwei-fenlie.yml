background_zh_cn: 魏末君臣相疑：斛斯椿等与南阳王宝炬、武卫将军元毗、王思政「构神武于魏帝」，魏帝由是心贰于贺拔岳；高乾密启神武言魏帝之贰而神武封呈于帝，魏帝遂杀乾，又遣使密敕长乐太守庞苍鹰令杀其弟昂——「于是魏帝与神武隙矣」。永熙三年，魏帝还邺，神武饯于乾脯山，执手而别，实已决裂。
result_zh_cn: 是岁闰十二月，魏孝武帝崩于长安；魏室于是西东并立，宇文泰、高欢各挟一帝，北魏之名虽存而实亡。此后西魏文帝、东魏孝静帝并立于长安、邺城，孝静皇后高氏为齐献武王第二女，东魏之政尽出高氏，东西相攻无岁不有，至周、齐受禅而终成两国。
process_zh_cn: 永熙三年七月丁未，魏孝武帝「遂从洛阳率轻骑入关」，宇文泰（太祖）备仪卫奉迎，谒见东阳驿——帝西迁长安、依关陇以自固；初，魏帝在洛阳许以冯翊长公主配太祖，未及结纳而帝西迁。高氏则以婚姻缔结魏室：孝静皇后高氏为齐献武王第二女，孝静帝妹又适高氏——东魏之政实出高欢。
impact_zh_cn: 北魏分裂为北齐、北周之所自出：宇文泰所统之关陇集团与高欢所统之山东豪族自此分途，府兵制、六官制皆立于西魏北周，隋唐皇室与制度皆出关陇一系——北魏分裂实为北朝后期政治之枢纽，亦隋唐统一之远源。
