summary_zh_cn: 永宁元年（301年）益州流民领袖李特领导流民武装反抗西晋苛政，先后败赵廞、击败罗尚，303年兵败被杀，其子李雄继之并于306年建立成汉。李特起义是西晋末年北方流民与民族矛盾激化的早期信号之一。
