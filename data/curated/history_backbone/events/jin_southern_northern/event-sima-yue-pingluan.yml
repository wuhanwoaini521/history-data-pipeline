summary_zh_cn: 光熙元年（306年）东海王司马越控制朝廷、毒杀惠帝、立怀帝，八王之乱至此结束。但西晋经此乱已大伤元气，宗室自相残杀耗尽统治基础，北方各族人民的反抗随即爆发。
