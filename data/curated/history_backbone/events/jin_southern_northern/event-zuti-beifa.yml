summary_zh_cn: 建兴四年至大兴四年（约319—321年）祖逖率部渡江北伐，收复黄河以南豫州等地，颇得民心；受朝廷掣肘，321年病逝，所复之地旋失。祖逖北伐是东晋前期最有名的北伐行动，反映"收复中原"与"偏安江左"之间的政治张力。
