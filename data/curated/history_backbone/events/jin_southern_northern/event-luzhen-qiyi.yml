summary_zh_cn: 正光四年（523年）沃野镇镇兵破六韩拔陵领导起义，六镇（北魏北边防戍军镇）相继响应，北魏朝廷镇压不力，被迫诏准胡汉通婚、募镇民为兵。六镇起义动摇了北魏统治根基，并孕育了北魏末年的军阀化。
