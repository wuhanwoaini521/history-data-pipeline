summary_zh_cn: 东晋咸康三年（337年）慕容皝自称燕王，建立前燕于辽东，至352年慕容儁灭冉魏入主中原。前燕是鲜卑慕容部建立的强盛政权，其后统一关东大部，成为北方主要力量之一。
