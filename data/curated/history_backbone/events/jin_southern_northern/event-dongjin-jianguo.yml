summary_zh_cn: 建武元年（317年）司马睿在建康（今南京）即晋王位，次年称帝，史称东晋。东晋建立承接"衣冠南渡"，以建康为政治中心，形成与北方十六国并行的"南北分治"格局，中国历史进入东晋十六国阶段。
