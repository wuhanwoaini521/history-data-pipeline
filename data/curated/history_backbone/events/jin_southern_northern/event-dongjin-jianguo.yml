background_zh_cn: 永嘉初，琅邪王睿用王导之计始镇建邺，以顾荣为军司马、贺循为参佐，王敦、王导、周顗、刁协并为腹心股肱，宾礼名贤、存问风俗，江东归心焉。及怀帝蒙尘于平阳，司空荀籓等移檄天下，推帝为盟主——晋室之望已系于江左。
result_zh_cn: 东晋立于建康，中原因永嘉之乱而沦没，晋祚赖江左以存；《晋书》记「望气者云五百年后金陵有天子气……元帝之渡江也，乃五百二十六年」，南方立国之局自此奠定，侨姓与吴姓士族共戴晋室，江左百余年之基由是而立。
process_zh_cn: 愍帝诏曰「朕今幽塞穷城，忧虑万端……卿指诏丞相，具宣朕意，使摄万机，时据旧都，修复陵庙，以雪大耻」——帝受诏而经营江左。建武元年三月癸丑，愍帝崩问至，帝斩缞居庐；丙辰，百僚上尊号，令曰「孤以不德，当厄运之极……咸勉之以大政，亦何敢辞」，是日即皇帝位。
impact_zh_cn: 东晋以王导、王敦兄弟执柄，士族与皇权共治，「王与马共天下」之局成；此后宋、齐、梁、陈皆都建康，南北分立历二百年，中原士族南迁所携之文化、制度遂在江左延续，为隋唐制度之远源。
