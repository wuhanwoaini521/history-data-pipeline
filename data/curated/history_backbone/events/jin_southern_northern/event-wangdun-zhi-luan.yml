summary_zh_cn: 永昌元年至太宁二年（322—324年）荆州都督王敦两次举兵东下，攻入建康，专权自用，死后叛军为朝廷所平。王敦之乱是东晋门阀政治下，以地方军事长官挑战皇权与朝臣格局的代表事件。
