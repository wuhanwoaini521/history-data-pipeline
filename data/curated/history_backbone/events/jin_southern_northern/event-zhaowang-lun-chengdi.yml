summary_zh_cn: 永康二年（301年）正月，赵王司马伦废惠帝自立称帝，三月齐王冏、成都王颖、河间王颙等起兵讨伐，四月伦败废，惠帝复位。赵王伦篡位是八王之乱中唯一一次宗王正式称帝，诸王从此名分尽失、各怀异志。
