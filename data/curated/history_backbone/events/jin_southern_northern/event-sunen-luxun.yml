summary_zh_cn: 隆安三年至义熙七年（399—411年）天师道首领孙恩、卢循相继领导东南沿海起义，孙恩一度逼近建康，402年孙恩败死，卢循续之，至411年为刘裕所灭。起义沉重打击东晋门阀世家，为刘裕崛起扫除障碍。
