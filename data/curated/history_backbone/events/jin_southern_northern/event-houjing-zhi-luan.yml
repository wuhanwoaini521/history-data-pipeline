background_zh_cn: 侯景本东魏将，大同二年「魏遣将侯景率众七万寇楚州」，既败而降梁，梁武帝纳之，景遂据寿阳。太清二年，侯景围历阳，梁将启云「采石急须重镇，王质水军轻弱，恐虑不济」——江防之疏、藩镇之骄，祸机已伏。
result_zh_cn: 台城陷后，侯景纵兵大掠，建康残破、士民死亡相继，梁臣有卒于围内者；梁室诸王拥兵相攻而不赴国难，其后景篡立为汉帝，为王僧辩、陈霸先所讨平，而梁祚亦尽——江陵再陷于西魏，陈霸先遂代梁而立。
process_zh_cn: 太清二年（548年）八月戊戌，侯景举兵反，擅攻马头、木栅、荆山等戍；是岁侯景寇京师，梁将率所部入援，有卒于围内者。太清三年，侯景攻陷台城：「时太宗居永福省，贼众奔入，举兵上殿，侍卫奔散，莫有存者」——台城既陷，梁武帝、简文帝相继受制于景。
impact_zh_cn: 侯景之乱为南朝由盛转衰之枢：建康宫阙焚毁，门阀士族凋零殆尽，江南文物之盛一落千丈；梁亡而陈立，南朝仅余一国之力，终不能敌北；隋之平陈实肇于此役之耗，论者谓南朝之亡自侯景始，其后陈虽偏安，江南终不复梁世之盛。
