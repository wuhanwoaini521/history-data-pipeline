summary_zh_cn: 武泰元年（528年）尔朱荣在河阴（今河南孟津东北）发动政变，沉杀胡太后及幼主，并屠杀朝臣两千余人（"河阴之变"）。此变使北魏洛阳朝廷元气大伤，军政大权为尔朱氏掌握，直接促成北魏末年的政体重构与分裂。
