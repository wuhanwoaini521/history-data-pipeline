summary_zh_cn: 开皇七年（587年）隋文帝命萧岿之孙萧琮入朝，随即废西梁（江陵小朝廷），北周以来依附于隋的傀儡政权被吞并。隋前期遂完成对长江中游的肃清，为南征陈朝扫清侧翼。
