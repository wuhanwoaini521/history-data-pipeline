summary_zh_cn: 承圣三年（554年）西魏于谨、杨忠攻破江陵，杀梁元帝萧绎，梁政权至此实质灭亡（萧詧在江陵立西梁为附庸）。侯景之乱后梁宗室相攻，江陵陷落使南朝最后抵抗力量丧失，南方转入陈朝重建阶段。
