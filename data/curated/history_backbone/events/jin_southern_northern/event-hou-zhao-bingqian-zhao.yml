summary_zh_cn: 太和四年（329年）石勒遣石虎攻灭刘曜的前赵，改称天王，都鄴，后赵基本统一北方除辽东、凉州以外的大部分地区。此后北方进入后赵一家独大的时期，直至石虎暴政引发动荡。
