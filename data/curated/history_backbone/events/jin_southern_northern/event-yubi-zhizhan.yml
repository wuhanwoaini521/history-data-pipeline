summary_zh_cn: 武定四年（546年）东魏高欢率大军围攻西魏玉壁（今山西稷山西南），北周名将韦孝宽固守五十余日，高欢败归，次年病死。玉壁之战是东西魏最具决定性的攻防战，阻遏了东魏吞并西魏的企图。
