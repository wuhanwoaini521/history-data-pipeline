summary_zh_cn: 天监六年（507年）北魏以数十万大军围梁钟离（今安徽凤阳东北），梁将韦睿、曹景宗督北府诸军大破之，魏军死伤惨重。钟离之战是梁魏战争中的决定性胜利，巩固了梁在淮南的统治。
