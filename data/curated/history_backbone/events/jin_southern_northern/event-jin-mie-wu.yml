summary_zh_cn: 太康元年（280年）晋武帝发六路大军伐吴，王濬楼船径取建业，孙皓出降，吴亡。晋灭吴结束三国鼎立，西晋完成全国统一，中国自东汉末动荡以来首次重归一统。
