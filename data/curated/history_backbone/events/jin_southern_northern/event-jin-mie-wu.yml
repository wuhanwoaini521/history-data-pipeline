background_zh_cn: 咸宁五年（279年）十一月，晋大举伐吴：「遣镇军将军、琅邪王伷出涂中，安东将军王浑出江西，建威将军王戎出武昌，平南将军胡奋出夏口，镇南大将军杜预出江陵，龙骧将军王濬、广武将军唐彬率巴蜀之卒浮江而下，东西凡二十余万」——六路并进、水陆俱下之策既定。
result_zh_cn: 收其图籍，克州四、郡四十三、县三百一十三，户五十二万三千，吏三万二千，兵二十三万，男女口二百三十万；丙寅，帝临轩大会，引皓升殿，群臣咸称万岁——三国鼎立之局终结，天下一统于晋，自汉末以来分裂九十余年之世至此复合。
process_zh_cn: 太康元年（280年）二月，王濬、唐彬等克丹杨城，又克西陵，杀西陵都督留宪；壬戌，濬又克夷道乐乡城，杀夷道监陆晏、水军都督陆景；甲戌，杜预克江陵，斩吴江陵督伍延——上游既下，建邺孤悬。三月壬寅，王濬以舟师至于建邺之石头，孙皓大惧，面缚舆榇，降于军门；濬杖节解缚焚榇，送于京都。
impact_zh_cn: 制曰「武皇承基……马隆西伐，王濬南征，师不延时，獯虏削迹，兵无血刃，扬越为墟」——平吴成晋武一统之功；然王浑与王濬争先入石头、频奏濬罪状，将帅争功之隙已见，论者以「平吴之功而知将帅之不让」为晋政之讥。
