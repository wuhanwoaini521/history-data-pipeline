summary_zh_cn: 皇始元年（395年）北魏与后燕会战参合陂，慕容宝军主力几尽，396年拓跋珪率大军攻燕，398年克中山、檀州，后燕分裂（慕容德南奔建南燕）。北魏击灭后燕后取得河北、山西，成为北方最强的政权。
