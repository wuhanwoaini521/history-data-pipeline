summary_zh_cn: 义熙五年至十三年（409—417年）刘裕先后北伐：409—410年灭南燕，416—417年灭后秦、克长安。刘裕北伐是东晋建国以来规模最大、战果最著的北伐，使其军政威望达到顶点，为代晋建宋奠定基础。
