summary_zh_cn: 永兴元年（304年）匈奴五部之左部帅刘渊在离石起兵，建国号汉，自称汉王，追尊刘禅为孝怀皇帝以承汉统；308年称帝。刘渊建汉（后史称汉赵或前赵）是西晋崩溃中北方胡族政权建立的标志，此后北方持续陷入多政权并立。
