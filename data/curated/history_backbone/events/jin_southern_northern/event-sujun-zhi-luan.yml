summary_zh_cn: 咸和二年至四年（327—329年）历阳内史苏峻与祖约联合举兵，攻陷建康、逼走朝廷，后被陶侃、温峤等击败收复京城。苏峻之乱进一步确立以建康为中心的中央权威与地方军事力量的博弈格局。
