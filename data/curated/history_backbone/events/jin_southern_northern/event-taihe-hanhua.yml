summary_zh_cn: 迁洛后孝文帝推行全面汉化：494年起改革官制、禁胡服、断北语，496年改拓跋氏为元氏并定鲜卑勋贵汉姓、按门第仕进。汉化改革促进民族融合，也使六镇军人地位与待遇相对下降，为日后六镇起义与北魏分裂埋下深层矛盾。
