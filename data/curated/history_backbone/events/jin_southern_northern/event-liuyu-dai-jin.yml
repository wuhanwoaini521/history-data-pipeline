summary_zh_cn: 元熙二年（420年）刘裕接受晋恭帝禅让称帝，国号宋（刘宋），都建康。刘裕代晋结束了东晋百余年门阀政治，南朝自此开始，中国历史进入南北朝时代（与北方的北魏并峙）。
