summary_zh_cn: 太元八年（383年）前秦苻坚大举南征东晋，东晋谢安、谢玄以八万北府兵在淝水（今安徽寿县一带）大败前秦军，前秦号称百万之众土崩瓦解。淝水之战保住东晋半壁江山，并直接导致前秦崩裂、北方再度分裂，南北对峙格局由此长期延续。
