importance: major
summary_zh_cn: 安史之乱平定后（763年），唐廷以安史旧部田承嗣（魏博）、李宝臣（成德）、李怀仙（卢龙）为节度使，河朔三镇遂成「国中之国」，父子相袭、赋税自专。河朔三镇割据是藩镇格局的开端，也决定了唐中后期的政治基本盘。
