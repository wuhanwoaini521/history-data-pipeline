  description_zh_cn: 隋炀帝死、隋运已终，李渊在长安称帝建唐

background_zh_cn: 大业十二年，炀帝幸江都宫，以越王侗、光禄大夫段达、太府卿元文都等总留后事；中原群盗蜂起，江都阻绝，从驾骁果思归关中。帝括江都人女寡妇以配从兵，又夜见流星坠于江都、日光四散如流血而恶之；宇文化及将乱之夕，宗人虞伋知而告其弟熙——变乱之兆已著。
process_zh_cn: 大业十四年（618年）三月，右屯卫将军宇文化及，武贲郎将司马德戡、元礼，监门直阁裴虔通，将作少监宇文智及等，以骁果作乱，入犯宫闱。先是裴蕴共惠绍谋，欲矫诏发郭下兵民、尽取荣公来护儿节度，收在外逆党宇文化及等，仍发羽林殿脚入自西苑，扣门援帝——谋泄而不果，变遂作。
result_zh_cn: 上崩于温室，时年五十；萧后令宫人撤床箦为棺以埋之，化及发后，右御卫将军陈棱奉梓宫于成象殿，葬吴公台下；大唐平江南之后，改葬雷塘。化及令裴矩参定仪注，推秦王子浩为帝，以矩为侍内，随化及至河北；俄而宇文化及率众自江都北指黎阳，兵十余万。
impact_zh_cn: 江都之变弑君于行宫，隋室遂亡其政：越王侗于东都称尊号，遣使授李密太尉、魏国公，令先平化及然后入朝辅政——群雄讨逆之局已成；化及与密相遇于童山，密知其军少食、利在急战，故不与交锋而遏其归路，化及终败。隋之亡不亡于外寇，而亡于从驾之骁果，论者深叹之。
