  description_zh_cn: 开元末李林甫执政，天宝由盛转衰

background_zh_cn: 玄宗以临淄王定韦后之乱，先天二年又诛太平公主及其党与，始总揽万机；开元元年以姚崇为相，纳其请而抑权幸、罢冗官、检责僧尼。「临御之初，任姚崇、宋璟，二人皆忠鲠上才，动以致主为心」；其后张嘉贞、张说、韩休、张九龄相继为相，吏治以澄清称。
process_zh_cn: 开元年间检括户口、劝课农桑、广置屯田、修渠灌田，太仓、含嘉仓之粟积至千万石；又改政事堂为中书门下，于沿边设节度使以备四夷。开元二十八年（740年），天下县千五百七十三，户八百四十一万二千八百七十一，口四千八百一十四万三千六百九——较贞观、永徽之世户口倍増。
result_zh_cn: 是岁西京、东都米斛直钱不满二百，绢匹亦如之；「海内富安，行者虽万里不持寸兵」——物价之平、行旅之安为史家所记之实况，后世以「开元盛世」名之。姚崇上言检责天下僧尼、伪滥还俗者二万余人，亦为盛世厘革之一端。
impact_zh_cn: 开元之盛以户口、物价、治安之数为证，为唐代国力之顶点，文教武备皆极一时；然边兵之费至天宝而大增——「开元之前，每岁供边兵衣粮，费不过二百万；天宝之后，边将奏益兵浸多，每岁用衣千二十万匹、粮百九十万斛」，公私劳费而民始困苦。府兵废弛与节度权重已伏盛极而衰之机，天宝末遂有安史之乱。
