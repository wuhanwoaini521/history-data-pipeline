summary_zh_cn: 唐玄宗开元年间（713—741年）户口倍增、仓储充溢、海内晏然，文教武备皆极一时之盛，史称「开元盛世」（属后世概括）。开元盛世是唐朝以至于中国古代社会的繁盛高峰，其后期潜藏的政治军事弊端（府兵废弛、节度权重）渐次显现。
quality_status: reviewed
