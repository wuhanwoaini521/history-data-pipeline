summary_zh_cn: 府兵制至开元年间渐趋废弛，开元十年（722年）后募兵（「长征健儿」）渐成定制，国家军事力量由兵农合一之府兵转向职业募兵；同时缘边节度使集军、政、财权于一身。这一军事制度转变（§19 制度变化节点）为安史之乱与藩镇割据提供了制度条件。
