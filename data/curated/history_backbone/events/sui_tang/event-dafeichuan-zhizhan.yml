summary_zh_cn: 咸亨元年（670年）唐将薛仁贵率军与吐蕃在大非川（今青海共和一带）决战，唐军大败。此役标志吐蕃在青藏高原崛起并对唐形成长期战略压力，唐蕃关系由和亲转入战争与反复争夺的格局。
