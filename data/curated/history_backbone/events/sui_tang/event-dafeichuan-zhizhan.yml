background_zh_cn: 咸亨元年（670年）四月，吐蕃陷西域十八州，又与于阗袭龟兹拨换城，唐罢安西四镇；吐谷浑为吐蕃所破，其王诺曷钵与亲近数千帐内徙。唐乃以右卫大将军薛仁贵为逻娑道行军大总管，左卫员外大将军阿史那道真、左卫将军郭待封副之，「以讨吐蕃，且援送吐谷浑还故地」——名为讨伐，实为护送吐谷浑复国。
process_zh_cn: 军至大非川，将趣乌海，仁贵议留二万人为两栅于大非岭上、辎重悉置栅内，吾属帅轻锐倍道兼行掩其未备；郭待封先与仁贵并列，耻居其下，所言多违。仁贵帅所部前行，击吐蕃于河口，大破之，进屯乌海以待；待封不用其策，将辎重徐进，未至乌海遇吐蕃二十余万，军大败，还走，悉弃辎重。仁贵退屯大非川，吐蕃相论钦陵将兵四十余万就击之，唐兵大败，死伤略尽；仁贵、待封与阿史那道真并脱身免，与钦陵约和而还。
result_zh_cn: 诏大司宪乐彦玮即军中按其败状，械送京师，三人皆免死除名；《旧唐书·高宗纪》亦书「薛仁贵、郭待封至大非川，为吐蕃大将论钦陵所袭，大败，仁贵等并坐除名」。《新唐书·吐蕃传》记此役「师凡十余万，至大非川，为钦陵所拒，王师败绩，遂灭吐谷浑而尽有其地」。
impact_zh_cn: 大非川之败，吐谷浑故地尽陷于吐蕃，「诺曷钵与亲近数千帐才免」，唐西陲屏藩尽失，唐蕃战线退守河陇；论钦陵兄弟皆有才略，此后连年寇边，仪凤三年李敬玄又败于青海。唐蕃关系由和亲互市转入长期战争与反复争夺，西线成为高宗后期至武周的主要用兵方向。
