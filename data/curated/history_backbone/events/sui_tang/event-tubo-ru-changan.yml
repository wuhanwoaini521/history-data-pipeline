summary_zh_cn: 广德元年（763年）吐蕃乘唐廷安史初平、兵力空虚，攻入长安，代宗出奔陕州，郭子仪等收复京城。吐蕃一度占据长安十余日，标志唐朝西部边防的严重弱化，安史之乱后吐蕃、回纥成为主要边患。
