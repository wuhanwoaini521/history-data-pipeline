summary_zh_cn: 大业八年至十年（612—614年）隋炀帝三次大规模征伐高句丽：首役百万大军渡辽水大败于萨水，二役因杨玄感起兵而还，三役高句丽求和。三征消耗空前的人力财力，直接激化隋末社会矛盾。
