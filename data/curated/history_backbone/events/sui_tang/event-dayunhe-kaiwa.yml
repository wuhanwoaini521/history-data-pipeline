id: event-dayunhe-kaiwa
name_zh_cn: 开凿大运河
event_type: economic
start_year: 605
end_year: 610
date_precision: range
period_id: period-sui
regime_ids: []
importance: major
summary_zh_cn: 大业元年至四年（605—610年）隋炀帝先后修凿通济渠、邗沟，疏浚永济渠，又开江南河，连接涿郡（今北京）与余杭（今杭州），形成以洛阳为中心、贯通南北的运河体系。大运河是隋代最大的交通工程，为南北经济文化交流与中央政府控制江南提供动脉（本事件按工程阶段记 range，非单日建成）。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《隋书·炀帝纪》《食货志》；现代参考：岑仲勉《隋唐史》（中华书局）；吴宗国《隋唐五代简史》（北京大学出版社）；王仲荦《隋唐五代史》；张岂之主编《中国历史·隋唐辽宋金元卷》；白寿彝总主编《中国通史》
