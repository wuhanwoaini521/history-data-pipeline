summary_zh_cn: 大业元年至四年（605—610年）隋炀帝先后修凿通济渠、邗沟，疏浚永济渠，又开江南河，连接涿郡（今北京）与余杭（今杭州），形成以洛阳为中心、贯通南北的运河体系。大运河是隋代最大的交通工程，为南北经济文化交流与中央政府控制江南提供动脉（本事件按工程阶段记
  range，非单日建成）。
