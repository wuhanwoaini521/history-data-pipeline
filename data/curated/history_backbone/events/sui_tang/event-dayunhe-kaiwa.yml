  description_zh_cn: 大运河承开皇漕渠（自渭达河）之需而大举开凿
background_zh_cn: 隋之漕运自开皇始：开皇初开渠引杜阳水于三畴原，又「开渠，自渭达河，以通运漕」——广通渠之役已见转漕关中之需。炀帝即位，以天下承平日久、士马全盛，慨然慕秦皇汉武之事，乃盛治宫室、即事巡游，南北通漕之议遂大举。
process_zh_cn: 大业元年（605年），发河南诸郡男女百余万开通济渠，自西苑引谷、洛水达于河，自板渚引河通于淮；通鉴记「命尚书右丞皇甫议发河南、淮北诸郡民，前后百余万，开通济渠」。大业四年春正月，诏发河北诸郡男女百余万开永济渠，引沁水南达于河、北通涿郡，通鉴记「诏发河北诸军五百余万众穿永济渠」。自是自江都至涿郡，龙舟可直达：帝自江都御龙舟入通济渠，遂幸于涿郡。
result_zh_cn: 运河既通，帝自江都行幸涿郡，御龙舟，渡河入永济渠；选部、门下、内史、御史四司之官于前船选补，受选者三千余人或徒步随船三千余里，冻馁疲顿，因而致死者什一二——役重民困之弊与漕运之利并见。至隋末，永济渠、通济渠犹为诸雄用兵转粮之干道。
impact_zh_cn: 大运河以洛阳为中心，北通涿郡、南达江都、余杭，沟通河、淮、江、海四大水系，为此后唐宋漕运与南北经济交流之第一命脉；然役夫数百万、民力凋敝，隋末群盗皆据渠为营（义臣据永济渠为营，化及粮尽渡永济渠），论者以开河与征辽并为隋亡之由。
