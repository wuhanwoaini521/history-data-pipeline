summary_zh_cn: 永徽六年（655年）高宗废皇后王氏、立武昭仪为后（「废王立武」），次年改元显庆；659年长孙无忌被逐贬自杀，关陇士族集团势力受挫。此事件标志着武则天进入权力核心，也改变了唐初的朝局结构。
