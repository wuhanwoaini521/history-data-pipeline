summary_zh_cn: 武德九年（626年）六月初四，秦王李世民在长安宫城北门玄武门伏兵，杀太子李建成、齐王李元吉，遂被立为太子，两月后受禅即位。玄武门之变是唐初皇位继承冲突的总爆发，改变了唐朝政治走向，也是中国历史上最著名的宫廷政变之一。
