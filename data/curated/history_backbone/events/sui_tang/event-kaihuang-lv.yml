summary_zh_cn: 隋文帝开皇年间（581—583）命高颎、苏威等更定刑律，颁行《开皇律》：定笞杖徒流死五刑，废枭首、鞭刑等酷刑，确立"十恶"重罪名目。《开皇律》是隋唐法律体系从《北周律》转向以《隋律》为范本的奠基之作，其后唐律即本于此。
