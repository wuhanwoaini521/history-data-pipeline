summary_zh_cn: 大业九年（613年）隋炀帝再度亲征高句丽，围辽东城；六月礼部尚书杨玄感于黎阳（今河南浚县）起兵攻洛阳，炀帝闻讯回师，撤围内平，二次征伐无功而返。
