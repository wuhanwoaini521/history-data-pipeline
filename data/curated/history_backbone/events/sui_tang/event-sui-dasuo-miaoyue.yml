summary_zh_cn: 开皇五年（585年）隋文帝令"大索貌阅"（按貌核实户籍、清理隐漏人丁），并推行"输籍定样"（定户等输纳标准）。此举大量检括隐户为编户，国家户籍与赋役基础显著扩大，是开皇年间经济整顿的关键政策。
