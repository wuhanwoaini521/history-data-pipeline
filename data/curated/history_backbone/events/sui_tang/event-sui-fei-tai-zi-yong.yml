summary_zh_cn: 开皇二十年（600年）隋文帝废太子杨勇，改立次子杨广为太子。废立出于晋王杨广与其党羽的构陷与文帝皇后独孤氏的推动，使皇位继承转向杨广，为日后炀帝暴政与隋亡埋下伏笔。
