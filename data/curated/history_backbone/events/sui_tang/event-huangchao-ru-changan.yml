background_zh_cn: 乾符二年（875年）黄巢聚众响应王仙芝，转掠河南；王仙芝败死后，黄巢称「冲天大将军」，渡江陷虔、吉、饶、信等州，开山洞五百里入福建，又陷广州，大掠岭南。广明元年（880年）黄巢自桂管北还，连陷湖南、江西，朝廷以高骈为诸道行营都统；骈将张璘战败被杀，骈自保淮南，黄巢遂乘胜渡江，攻天长、六合，詔河南诸道之师屯溵水。
process_zh_cn: 广明元年十一月，黄巢悉众渡淮，自号率土大将军，「其众富足，自淮已北整众而行，不剽财货，惟驱丁壮为兵耳」；己巳陷东都，留守刘允章率分司官属迎谒，贼供顿而去，坊市晏然。丙子攻潼关，守关诸将望风自溃，辛巳贼据潼关；十二月甲申，僖宗与诸王、妃、后数百骑自子城由含光殿金光门出幸山南，百官不之知，京城晏然。
result_zh_cn: 是日晡晚贼入京城，右骁卫大将张直方率武官十余迎黄巢于坡头；壬辰黄巢据大内，僭号大齐，称年号金统，悉陈文物、据丹凤门伪赦，以尚让为太尉、崔璆为平章事。朝臣豆卢彖、崔沆、刘邺、于琮等从驾不及为贼所捕遇害，郑綦、郑系举家自尽；中和元年正月车驾在兴元，诏诸道会兵讨贼。
impact_zh_cn: 长安陷落与僭号大齐，是黄巢起义之顶点，亦是唐廷中枢权威崩解之标志——僖宗播迁山南、再幸蜀，诏令所及唯在行在；京畿残破、百官屠戮之后，唐室名存实亡。此后藩镇各专租税、中原无复上供，二十余年后朱温代唐，五代之局实肇于此。
