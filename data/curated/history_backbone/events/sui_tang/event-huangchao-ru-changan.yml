summary_zh_cn: 广明元年（880年）十二月黄巢军攻入长安，建大齐政权、称帝；唐僖宗仓皇出奔成都（「僖宗再幸蜀」）。长安陷落是黄巢起义的顶点，也是唐朝中枢权威崩解的标志。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《旧唐书·黄巢传》《僖宗纪》；现代参考：吴宗国《隋唐五代简史》；陈寅恪《隋唐制度渊源略论稿》与《唐代政治史述论稿》；岑仲勉《隋唐史》；黄永年《六至九世纪中国政治史》；白寿彝《中国通史》
