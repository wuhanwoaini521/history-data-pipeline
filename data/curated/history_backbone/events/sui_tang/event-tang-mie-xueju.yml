summary_zh_cn: 武德元年（618年）西秦薛举在浅水原大败唐军后病卒，继位者薛仁杲于619年（武德二年）为李世民所灭，唐据陇右。薛氏之灭平定关中侧翼，是唐统一战争的第一场大捷。
