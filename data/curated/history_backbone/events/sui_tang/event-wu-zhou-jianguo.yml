summary_zh_cn: 天授元年（690年）武则天废睿宗、自称皇帝，改国号为周（武周），迁都洛阳为神都。武则天是中国历史上唯一正式称帝的女皇帝；武周政权的建立使唐代政治出现二十余年的女性执政的特殊时期（§17：独立
