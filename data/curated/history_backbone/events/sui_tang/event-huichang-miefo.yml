id: event-huichang-miefo
name_zh_cn: 会昌灭佛
event_type: political
start_year: 845
end_year: 845
date_precision: year
period_id: period-tang
regime_ids:
- regime-tang
importance: major
summary_zh_cn: 会昌五年（845年）武宗（会昌年间）推行大规模灭佛：天下寺院拆毁、僧尼还俗，没收寺院田产，史称「会昌法难」。会昌灭佛是唐代第三次也是规模最大的一次灭佛事件，折射唐后期财政与佛教经济实力的矛盾。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《旧唐书·武宗纪》；现代参考：吴宗国《隋唐五代简史》；陈寅恪《隋唐制度渊源略论稿》与《唐代政治史述论稿》；岑仲勉《隋唐史》；黄永年《六至九世纪中国政治史》；白寿彝《中国通史》
