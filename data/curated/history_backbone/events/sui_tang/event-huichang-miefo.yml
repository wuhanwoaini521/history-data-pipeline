  description_zh_cn: 会昌灭佛次年武宗卒，宣宗时佛教复兴

background_zh_cn: 武宗好道术，宠道士赵归真、衡山道士刘玄靖，与归真胶固，排毁释氏而拆寺之请行。佛教自唐初以来寺院经济膨胀：寺田、僧尼、奴婢与两税争夺人口，武宗诏中自言「贞观、开元，亦尝厘革，剷除不尽，流衍转滋」，遂断行厘革。
process_zh_cn: 会昌五年（845年）七月庚子，敕并省天下佛寺；中书门下条疏：上州各留寺一所（工作精妙者留，破落者亦废），下州寺并废，行香日官吏改于道观。上都、东都每街留寺二所、寺留僧三十人，上都左街留慈恩、荐福，右街留西明、庄严；八月，敕天下废寺铜像、钟磬委盐铁使铸钱，铁像委本州铸为农器，金银鍮石等像销付度支。又勒大秦穆护、袄三千余人还俗，不杂中华之风。
result_zh_cn: 其天下所拆寺四千六百余所，还俗僧尼二十六万五百人，收充两税户；拆招堤、兰若四万余所，收膏腴上田数千万顷，收奴婢为两税户十五万人——佛教史称「会昌法难」，为三武一宗灭佛中规模最大者。寺产既没，两京悲田养病坊因僧尼还俗无人主持，敕量给寺田赈济，恐残疾无以取给。
impact_zh_cn: 灭佛所得寺田、僧尼、奴婢尽入两税与度支，唐后期财政赖以纾困；然寺宇经像毁废极广，佛教义学与僧团受创至深。《旧唐书·武宗纪》载僧尼还俗之后，悲田养病坊无人主持，两京量给寺田赈济——灭佛之政于救济之制亦须即时补苴。武宗寻于次年崩，宣宗即位后即复兴佛教，会昌之政遂为唐代佛教兴衰的一大转折。
