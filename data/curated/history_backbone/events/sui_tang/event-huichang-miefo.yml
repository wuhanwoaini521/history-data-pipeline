summary_zh_cn: 会昌五年（845年）武宗（会昌年间）推行大规模灭佛：天下寺院拆毁、僧尼还俗，没收寺院田产，史称「会昌法难」。会昌灭佛是唐代第三次也是规模最大的一次灭佛事件，折射唐后期财政与佛教经济实力的矛盾。
