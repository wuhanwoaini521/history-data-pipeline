summary_zh_cn: 长庆元年至会昌六年（约821—846年）以牛僧孺、李宗闵为首的牛党与李德裕为首的李党长期党争，科举、藩镇、对敌政策屡屡反复，宰相任免随党争更迭。牛李党争加剧晚唐政治内耗（§25 作 aggregate process，不逐宰相任免立项）。
