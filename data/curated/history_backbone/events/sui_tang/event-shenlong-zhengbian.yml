summary_zh_cn: 神龙元年（705年）正月张柬之、崔玄暐等发动政变，迫武则天退位，中宗李显复位，复国号唐。武周政权终结，武则天不久病逝。神龙政变是唐朝恢复的关键政治事件，武周时期由此落幕。
