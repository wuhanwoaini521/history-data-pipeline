summary_zh_cn: 弘道元年（683年）高宗去世，中宗即位未二月被废，睿宗立为傀儡；武则天以太后身份临朝称制，684年改元垂拱，杀裴炎、废诸王。武则天临朝七年（683—690），实为武周代唐的前奏。
