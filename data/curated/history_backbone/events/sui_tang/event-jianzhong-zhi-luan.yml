summary_zh_cn: 建中二年至兴元元年（781—784年）德宗削藩引发四镇连兵（朱滔、王武俊、田悦、李纳）与李希烈反叛，783年泾原兵变、朱泚据长安称帝（秦帝），德宗出逃奉天被围（「奉天之难」），784年发罪己诏、借李晟等收复长安。建中之乱使德宗削藩功败垂成，唐廷对藩镇转为姑息。
