background_zh_cn: 德宗即位锐意削藩：建中二年成德李宝臣死，其子惟岳请袭不获，遂与魏博田悦、淄青李纳、山南东道梁崇义连兵拒命；建中三年卢龙朱滔、成德王武俊复叛，四镇连兵，淮西李希烈受命讨李纳而反。建中四年十月，诏泾原节度使姚令言率泾原之师救哥舒曜于襄城，泾原兵过京，遂为变乱之导火。
process_zh_cn: 十月丁未，泾原军出京城，至浐水倒戈谋叛，姚令言不能禁；帝令载缯彩二车，遣晋王往慰谕，乱兵已陈于丹凤阙下，促神策军拒之而「无一人至者」。帝与太子诸王妃主百余人出苑北门，其夕至咸阳，戊申至奉天；乱兵剽京城，屯于白华，乃于晋昌里迎朱泚为帅，称太尉，居含元殿，朱泚僭称秦帝，引兵围奉天。贼自丁未攻城二十余日，矢石雨下，薨伤者众，人心危蹙，上与浑瑊对泣；朔方、灵武诸道援兵至漠谷者为贼所败。
result_zh_cn: 陆贽劝帝痛自引过以感人心，兴元元年正月癸酉朔赦天下、改元，诏书言「李希烈、田悦、王武俊、李纳等，咸以勋旧……皆由上失其道而下罹其灾，朕实不君，人则何罪」，并所管将吏一切待之如初。李晟移军东渭桥，斩不受节制之刘德信而并其军，军势益振；六月李晟收京城，朱泚、姚令言死。
impact_zh_cn: 建中之乱以罪己、赦叛收场，德宗削藩功败垂成，唐廷对河北藩镇转为姑息，世袭之局遂固；奉天之围与李怀光之叛亦使德宗不再信任将帅，转向信用宦官典掌禁军。此役后唐中央权威大损，藩镇、宦官、党争三大痼疾自此并作。
