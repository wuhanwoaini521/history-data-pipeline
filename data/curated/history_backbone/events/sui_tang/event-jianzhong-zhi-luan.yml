importance: major
summary_zh_cn: 建中二年至兴元元年（781—784年）德宗削藩引发四镇连兵（朱滔、王武俊、田悦、李纳）与李希烈反叛，783年泾原兵变、朱泚据长安称帝（秦帝），德宗出逃奉天被围（「奉天之难」），784年发罪己诏、借李晟等收复长安。建中之乱使德宗削藩功败垂成，唐廷对藩镇转为姑息。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《旧唐书·德宗纪》《朱泚传》；现代参考：吴宗国《隋唐五代简史》；陈寅恪《隋唐制度渊源略论稿》与《唐代政治史述论稿》；岑仲勉《隋唐史》；黄永年《六至九世纪中国政治史》；白寿彝《中国通史》
