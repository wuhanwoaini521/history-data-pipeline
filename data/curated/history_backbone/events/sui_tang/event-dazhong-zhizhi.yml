summary_zh_cn: 宣宗大中年间（847—859年）整顿吏治、抑制宦官、收复失地，史称「大中之治」（属后世概括，§27：不把后世评价当明确事件）。大中之治为唐亡前的短暂回光，其后懿宗、僖宗朝迅速衰败。
