summary_zh_cn: 隋文帝在位（581—604年）期间，统一南北、轻徭薄赋、澄清吏治，府库充实、户口倍增，史称"开皇之治"（属后世概括）。开皇时期的经济恢复与制度创设为隋唐盛世奠定基础。
