background_zh_cn: 隋有天下之初，李德林每赞平陈之计，高祖以马鞭南指曰「待平陈讫，会以七宝装严公」——混一南北为开皇一朝之宿志。开皇初置御史官，朝廷以鲠正者拜治书侍御史，名为称职；高祖躬行节俭、任贤纳谏，政治清明之基由此立。
process_zh_cn: 开皇之政以轻徭薄赋、均平田土为务：诏曰「宁积于人，无藏府库」，河北、河东田租三分减一、兵减半功、调全免；时天下户口岁增，京辅及三河地少人众，乃发使四出均天下之田。其后库藏充溢，更辟左藏院以受之；开皇十一年以平陈所得古器多为妖变，悉命毁之——制度与文治并进，俭朴之俗行于上下。
result_zh_cn: 史臣总其治曰：「于是躬节俭，平徭赋，仓廪实，法令行，君子咸乐其生，小人各安其业，强无陵弱，众不暴寡，人物殷阜，朝野欢娱。」开皇九年平陈，南北复归一统，天下户数与仓储皆倍于前代，京师、诸州义仓之积至隋末犹为群雄所资。
impact_zh_cn: 开皇之治为唐宋制度所自出：均田、租调、府兵、科举诸制皆定于此际；通鉴记「开皇、仁寿之间，丈夫率衣绢布，不服绫绮，装带不过铜铁骨角，无金玉之饰」，风俗之淳为史家所称。然炀帝嗣位，宫室巡游、三征高丽，开皇之积一朝而尽，治乱之对比尤足为后世鉴戒。
