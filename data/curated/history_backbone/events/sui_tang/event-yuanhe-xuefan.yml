summary_zh_cn: 元和元年至十五年（806—820年）宪宗力主削藩：平西川刘辟（806）、镇海李锜（807）、成德王承宗（受影响）、淮西吴元济（817）、淄青李师道（819）等，藩镇武力一度尽折服。元和削藩是唐中后期中央集权的一次显著强化（aggregate）。
