summary_zh_cn: 隋文帝确立三省（尚书、门下、内史）六部（吏户礼兵刑工）官制，中书省称内史省，实行三省分权、共同辅政的中央行政框架。三省六部制为唐代承袭并完善，成为此后中国王朝中央政务的基本组织。
