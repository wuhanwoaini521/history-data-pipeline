summary_zh_cn: 大业十年（614年）隋炀帝三度征兵攻高句丽，各地民变纷起、军粮不继，高句丽请降，隋军班师。三征高句丽基本无果，隋朝国力民力耗尽，全国性起义随即全面爆发。
