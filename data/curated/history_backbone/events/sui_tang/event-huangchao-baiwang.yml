summary_zh_cn: 中和三年（883年）李克用等沙陀军收复长安，黄巢东撤；884年（中和四年）黄巢兵败于泰山狼虎谷，自刎（一说被杀）。黄巢败亡后唐廷名义尚存，但藩镇坐大、天下瓦解之势不可逆转。
