background_zh_cn: 淮西节度使吴少阳死，其子摄蔡州刺史吴元济匿丧不报、自领军务，「阴聚亡命，牧养马骡，时抄掠寿州茶山以实其军」；宪宗决意讨之，元和十年诏诸道兵环申、蔡而讨，李光颜独当一面，连破元济之众。战事数年前后无功，唐邓节度使高霞寓败于铁城，中外恟骇；裴度自请督师，以郾城为行在，激励士众，军士皆愿效死。
process_zh_cn: 元和十二年十月，李愬用降将李祐之谋：元济劲军多在洄曲西境，守蔡者皆市人疲耄之卒，可乘虚掩袭。愬令李祐率劲骑三千为前锋、田进诚三千为后军、自率三千为中军，夜出文城栅；诸将请所止，愬曰「入蔡州取吴元济」，诸将失色而不敢违。行七十里至悬瓠城，夜半雪愈甚，近城有鹅鸭池，愬令惊击之以杂其声；李祐、李忠义坎墉先登，尽杀守门卒而留击柝者，黎明雪止，愬入止元济外宅，元济犹以为洄曲子弟来求寒衣。
result_zh_cn: 十月十一日，唐军攻衙城，擒元济并其家属以闻，申、光二州及诸镇兵相继来降；裴度入蔡州，以蔡卒为牙兵，量罪加刑不尽如诏，淮西三州遂平。淮西既平，藩镇震恐：元和十三年淄青李师道为其部下刘悟所杀，函首至京师，唐廷分其地为三道，淄青亦平。
impact_zh_cn: 淮西之捷为元和削藩的决定性一役，河北藩镇相继请入朝，元和中兴之局由此告成；「李愬雪夜入蔡州」以奇袭典范垂名后世，为历代兵家所称。唐廷以蔡州降卒为牙兵、量罪加刑，亦见战后处置之审慎。
