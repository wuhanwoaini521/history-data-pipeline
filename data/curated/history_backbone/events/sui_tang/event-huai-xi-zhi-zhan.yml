importance: major
summary_zh_cn: 元和十二年（817年）裴度督师淮西，李愬雪夜奇袭蔡州，擒吴元济，淮西（三州）平。淮西之捷是元和削藩的决定性胜利，也是「李愬雪夜入蔡州」典故的史实来源。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《旧唐书·李愬传》《吴元济传》；现代参考：吴宗国《隋唐五代简史》；陈寅恪《隋唐制度渊源略论稿》与《唐代政治史述论稿》；岑仲勉《隋唐史》；黄永年《六至九世纪中国政治史》；白寿彝《中国通史》
