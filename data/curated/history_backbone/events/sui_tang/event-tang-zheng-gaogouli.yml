summary_zh_cn: 贞观十九年（645年）唐太宗亲征高句丽，克辽东数城，围攻安市城不克，深秋班师，"辽东之役"终以未灭高句丽而返。此役震慑高句丽，为其后高宗朝最终灭高句丽（668）奠定基础。
