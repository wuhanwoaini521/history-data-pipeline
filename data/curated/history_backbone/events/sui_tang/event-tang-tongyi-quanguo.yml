summary_zh_cn: 武德至贞观初（约618—628年），唐朝先后平定薛举、刘武周、窦建德（及余部刘黑闼）、王世充、辅公祏等割据势力，628年灭梁师都，基本完成全国统一。唐在隋末群雄混战的废墟上重建大一统。
