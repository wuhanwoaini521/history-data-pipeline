summary_zh_cn: 窦建德自大业末年起兵河北，616年称长乐王，617年据乐寿、建都，618年改称夏王，据有今河北大部。窦建德是隋末北方最重要的民变首领之一，其势力与李渊、王世充鼎足而三。
