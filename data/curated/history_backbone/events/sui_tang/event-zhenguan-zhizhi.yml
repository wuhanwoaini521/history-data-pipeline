summary_zh_cn: 唐太宗贞观年间（627—649年）轻徭薄赋、任用贤能（房玄龄、杜如晦等）、虚心纳谏（魏徵），政治清明、社会安定，史称"贞观之治"（属后世概括）。贞观时期同时完成对东突厥、西域的经营，是唐朝强盛的第一个高峰期。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《旧唐书·太宗纪》《资治通鉴·唐纪》；现代参考：吴宗国《隋唐五代简史》；陈寅恪《隋唐制度渊源略论稿》与《唐代政治史述论稿》；岑仲勉《隋唐史》；黄永年《六至九世纪中国政治史》；白寿彝《中国通史》
