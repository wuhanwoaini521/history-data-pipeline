summary_zh_cn: 大业九年（613年）礼部尚书杨玄感趁炀帝二次征高而为留守（东都），在黎阳起兵反隋，攻洛阳不克，为宇文述等讨平被杀。杨玄感是隋代贵族中第一个起兵反炀帝者，其败亡标志隋朝统治危机的公开化。
