summary_zh_cn: 隋文帝废九品中正制（约开皇年间），以科举考试选拔人才；隋炀帝大业年间增设进士科（约605年），科举制度由此开创。这是中国选官制度由门第推荐转向公开考试的关键制度变革节点。
