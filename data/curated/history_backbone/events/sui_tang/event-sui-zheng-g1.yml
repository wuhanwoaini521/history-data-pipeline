summary_zh_cn: 大业八年（612年）隋炀帝发军一百一十三万（号称二百万）攻高句丽，远征军渡辽水围攻辽东城不克，主力东渡鸭绿江在萨水（清川江）大败，约三十万军几全没。首次征伐以惨败告终。
