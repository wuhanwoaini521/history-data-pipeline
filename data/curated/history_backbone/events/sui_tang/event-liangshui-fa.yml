importance: major
summary_zh_cn: 建中元年（780年）宰相杨炎推行两税法：以户税、地税取代租庸调，按资产与土地每年夏秋两征，「量出为入」。两税法是唐代财政制度的一次根本变革，自此中国赋税由人头税为主转向财产税为主，影响此后数百年。
