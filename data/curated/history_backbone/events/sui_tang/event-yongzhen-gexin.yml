summary_zh_cn: 贞元二十一年（805年）顺宗即位，以王叔文、王伾、刘禹锡、柳宗元等推行革新：罢宫市、抑宦官、夺宦官兵权（谋夺神策军）等。革新遭宦官集团反击，顺宗被迫禅位宪宗，「二王八司马」被贬，革新不过半年而败。永贞革新是宦官政治背景下士人改革的第一次尝试。
