summary_zh_cn: 开元二十四年至天宝年间（约736—752年）李林甫任中书令长达十九年，「口有蜜，腹有剑」，专权自恣、杜绝言路、固结宠位。李林甫执政期间朝政走向腐败，玄宗晚年怠政，天宝政局由盛转衰的重要环节。
