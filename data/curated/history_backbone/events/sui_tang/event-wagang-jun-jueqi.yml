summary_zh_cn: 大业十二年（616年）瓦岗军（翟让所创，东郡瓦岗寨）在李密领导下壮大，克兴洛仓、开仓济民，据有河南大部，成为隋末最强的民变武装之一。瓦岗军与洛阳隋军长期拉锯，618年李密为王世充所败，瓦岗瓦解。
