summary_zh_cn: 贞观二十三年（649年）唐太宗去世，太子李治即位，是为唐高宗。高宗初期承贞观遗风（永徽之治），中期以后皇后武氏（武则天）权力上升，唐朝政治进入高宗—武周过渡阶段。
