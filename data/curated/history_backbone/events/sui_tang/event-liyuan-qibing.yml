summary_zh_cn: 大业十三年（617年）五月，太原留守李渊在次子李世民等策划下，于晋阳（今太原）起兵反隋，"废昏立明"号召讨平天下；七月率军三万西进，直取关中。李渊太原起兵是隋末群雄中最终胜出的起点。
