name_zh_cn: 李渊太原起兵
event_type: rebellion
start_year: 617
end_year: 617
date_precision: year
period_id: period-sui
regime_ids: []
importance: major
summary_zh_cn: 大业十三年（617年）五月，太原留守李渊在次子李世民等策划下，于晋阳（今太原）起兵反隋，"废昏立明"号召讨平天下；七月率军三万西进，直取关中。李渊太原起兵是隋末群雄中最终胜出的起点。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《旧唐书·高祖纪》；现代参考：岑仲勉《隋唐史》（中华书局）；吴宗国《隋唐五代简史》（北京大学出版社）；王仲荦《隋唐五代史》；张岂之主编《中国历史·隋唐辽宋金元卷》；白寿彝总主编《中国通史》
