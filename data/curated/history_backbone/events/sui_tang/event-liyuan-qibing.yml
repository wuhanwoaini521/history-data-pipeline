background_zh_cn: 大业十三年，李渊为太原留守，郡丞王威、武牙郎将高君雅为副；时群贼蜂起、江都阻绝，李世民与晋阳令刘文静首谋，劝举义兵。晋阳乡长刘世龙知其谋，以告高祖，高祖阴为之备——起兵之谋内外相济，只待发机。
process_zh_cn: 高祖先发制人：遣开阳府司马刘政会告王威、高君雅谋反，即斩之以徇，遂起义兵于晋阳；从父弟神通起兵鄠县，柴氏妇举兵于司竹，至是并与太宗会——宗族内外相响应，关中豪杰争赴义旗。
result_zh_cn: 秋七月壬子，高祖率兵西图关中，以元吉为镇北将军、太原留守；癸丑发自太原，有兵三万。京师留守刑部尚书卫文升、右翊卫将军阴世师、京兆郡丞滑仪挟代王侑以拒义师，高祖既破之，以阴世师、滑仪等拒义兵并斩之；癸亥，率百僚备法驾，立代王侑为天子，遥尊炀帝为太上皇，大赦，改元义宁。
impact_zh_cn: 太原起兵以「举义兵」为名，由晋阳一隅而西入长安，立代王、改元义宁，遥尊炀帝为太上皇，隋祚之移遂不可逆；次年受禅建唐，凡隋之制度、府兵、仓储皆归唐有——李渊父子以留守之兵借乱而起，实开三百年唐室之基。
