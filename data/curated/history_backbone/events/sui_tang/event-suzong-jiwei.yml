summary_zh_cn: 至德元年（756年）玄宗出逃入蜀途中，太子李亨在灵武（今宁夏灵武）即位，是为唐肃宗，遥尊玄宗为太上皇。肃宗即位重整平叛中枢，成为安史之乱中唐朝组织反攻的起点（衔接安史 Story 事件链）。
