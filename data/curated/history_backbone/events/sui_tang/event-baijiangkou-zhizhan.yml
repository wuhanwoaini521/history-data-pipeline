importance: major
summary_zh_cn: 龙朔三年（663年）唐将刘仁轨在白江口（今韩国锦江入海口）大破援助百济的日本水军，焚船四百余艘。此役确立唐对朝鲜半岛南部的控制，日本从此数百年间不再设登陆朝鲜半岛之志。
