background_zh_cn: 显庆五年（660年）唐遣苏定方灭百济，其地置熊津等府；百济遗臣据周留城起兵，迎故王子扶余丰于倭，倭国发水军助之。唐以刘仁愿守熊津，刘仁轨检校带方州刺史，诏孙仁师浮海赴援——百济复兴军与倭兵合势，唐军孤悬海东，唯有先取周留巢穴。
process_zh_cn: 龙朔三年（663年）八月，孙仁师与刘仁愿、刘仁轨合兵，势大振；诸将欲先攻加林城，仁轨以「周留，虏之巢穴，群凶所聚，除恶务本」请先攻之。于是仁师、仁愿与新罗王金法敏将陆军以进，仁轨与别将杜爽等将水军及粮船自熊津入白江以会陆军，同趣周留城。九月戊午，唐军遇倭兵于白江口，四战皆捷，焚其舟四百艘，「烟炎灼天，海水皆赤」，百济王丰脱身奔高丽。
result_zh_cn: 白江口一捷，百济王子忠胜、忠志等帅众降，百济尽平，唯别帅迟受信据任存城不下；据险应福信之黑齿常之等亦帅众降，唐用其力取任存城。《新唐书·东夷传》记其众「屯白江口，四遇皆克，火四百艘」，丰走不知所在——百济复国之势至此尽灭。
impact_zh_cn: 此役焚倭舟四百艘，倭国水军覆没，日本自此数百年不再渡海干预半岛；唐既解百济余党之患，遂专力东向，五岁之后（668年）灭高句丽，安东都护府之设皆以此为基。战后刘仁轨镇抚百济遗众、录用黑齿常之等降将，唐在半岛南部的羁縻秩序得以立定。
