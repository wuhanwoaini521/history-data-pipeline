summary_zh_cn: 宪宗元和年间平藩镇、整财政、任用贤相，唐廷权威一度重振，史称「元和中兴」（属后世概括）。宪宗晚年怠于政事、斥逐裴度，820年（元和十五年）被宦官陈弘志等所弑。
