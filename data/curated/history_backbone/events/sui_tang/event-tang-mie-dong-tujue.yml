summary_zh_cn: 贞观四年（630年）唐将李靖率军长途奔袭，在阴山击破东突厥主力，颉利可汗被俘，东突厥汗国灭亡。唐灭东突厥解除北方最大边患，太宗被尊"天可汗"，西域诸国与回纥等皆奉大唐为盟主，是唐初对外战略的决定性胜利。
