summary_zh_cn: 黄巢降将朱温（赐名全忠）882年归唐，883年任宣武节度使，以汴梁为基地消灭秦宗权等，至901年前后控制中原大部、成为唐末最强藩镇，进而挟制朝廷。朱温的崛起重绘了唐末权力地图。
