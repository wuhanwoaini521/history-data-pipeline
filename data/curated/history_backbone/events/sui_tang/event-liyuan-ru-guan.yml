summary_zh_cn: 大业十三年（617年）十一月，李渊军攻占长安，立隋代王杨侑为帝（恭帝），遥尊隋炀帝为太上皇，自任大丞相、唐王。长安的攻占使李渊取得"挟天子"名分与关中根基，为建立唐朝铺平道路。
