background_zh_cn: 唐文宗深恶宦官专权，太和四年与宰相宋申锡谋除宦官，事泄申锡贬死。后擢用李训、郑注：二人皆由神策中尉王守澄进用，而反说帝谋诛内官；太和九年十月先鸩杀王守澄，训与注势不两立，训出注为凤翔节度使，托中外应赴之谋，欲内外合势尽诛宦官。
process_zh_cn: 太和九年十一月壬戌，文宗御紫宸殿，金吾大将军韩约奏左仗院石榴树夜有甘露，李训请帝亲往观之；帝令宰相两省官先视，归奏「臣等恐非真甘露，不敢轻言」，帝乃命左右军中尉、枢密内臣往验。内臣至左仗，闻幕下有兵声，惊恐走出；李训急召王璠、郭行余受敕旨，唯璠从兵入而邠宁兵不至，事已急。内官举软舆迎帝，训攀舆呼「陛下不得入内」，金吾卫士与罗立言、李孝本从人共四百余上殿纵击内官，死伤数十人；帝入东上阁门，门即阖，宦官呼万岁，事遂败。
result_zh_cn: 仇士良等即遣兵大索，中尉仇士良率兵诛宰相王涯、贾餗、舒元舆及李训、王璠、郭行余、郑注、罗立言、李孝本、韩约等十余家，皆族诛；李训奔凤翔途中被杀，郑注为监军所杀，宰相四人及朝士死者千余，朝列为之一空。
impact_zh_cn: 甘露之变后宦官挟天子以令朝士，「自是天下事皆决于北司，宰相行文书而已」；文宗自比周赧、汉献，越五年而崩。宦官典禁军、预废立之局由此固定，牛李党争亦在其阴影下延续，唐后期皇权自主之望遂绝。
