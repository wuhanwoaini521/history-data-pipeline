summary_zh_cn: 太和九年（835年）文宗与李训、郑注密谋诛宦官，诈称「甘露」（金吾伏甲）事败，李训、郑注及四相皆被宦官所杀，株连者千余人。甘露之变是唐代宦官与皇帝、朝臣斗争的总爆发，此后宦官把持朝政直至唐亡。
quality_status: reviewed
source_type: curated_reference
