summary_zh_cn: 贞观十四年（640年）唐军灭高昌国（今新疆吐鲁番一带），以其地设西州、置安西都护府，唐的行政统治正式进入西域。安西都护府的设置是唐朝经营西域、巩固丝绸之路的战略支点。
