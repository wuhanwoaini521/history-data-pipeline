summary_zh_cn: 总章元年（668年）唐将薛仁贵等攻平壤，高句丽灭亡，唐置安东都护府。自隋炀帝至唐太宗、高宗三代征伐，高句丽终为唐所灭，朝鲜半岛格局由此重定（后新罗统一半岛南部）。
