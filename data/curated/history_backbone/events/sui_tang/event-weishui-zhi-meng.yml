summary_zh_cn: 武德九年（626年）突厥颉利可汗趁唐政权交接之际率军进至渭水便桥，威逼长安；李世民刚即位，亲临渭水与颉利会盟（"便桥之盟"），厚赠财物约和退兵。渭水之盟暂缓突厥威胁，唐代以此为耻，励精图治备战，为四年后灭东突厥张本。
