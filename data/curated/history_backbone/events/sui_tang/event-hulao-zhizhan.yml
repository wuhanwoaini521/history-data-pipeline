summary_zh_cn: 武德三年至四年（620—621年），秦王李世民率军围洛阳王世充，621年四月于虎牢（今河南荥阳）大破来援的窦建德夏军，窦建德被俘、王世充出降。虎牢之战一举定河南河北，是李唐统一全国的关键会战。
