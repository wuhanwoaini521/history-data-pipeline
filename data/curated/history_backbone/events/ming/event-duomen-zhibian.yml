  description_zh_cn: 北京保卫战之后英宗复位。

background_zh_cn: 景泰元年杨善使瓦剌，也先许上皇归，「先后遣李实、杨善往，卒奉上皇以归，谦力也」；上皇既归，幽居南宫。景泰八年正月，景帝病笃，储位未定，武清侯石亨、都督张輗张軏、左都御史杨善、副都御史徐有贞与太监曹吉祥等遂谋拥上皇复辟。
process_zh_cn: 天顺元年（1457年）正月壬午昧爽，石亨、张輗、张軏、杨善、徐有贞、曹吉祥以兵迎帝于南宫，御奉天门，朝百官——是为夺门之变。越数日，论夺门迎复功，封石亨忠国公、张軏太平侯、张輗文安伯、杨善兴济伯，曹吉祥嗣子钦都督同知；旋复论功，官舍旗军晋级者凡三千余人。都御史萧维桢附会徐有贞，枉杀王文、于谦等，朝局为之一变。
result_zh_cn: 夺门诸臣以功邀宠，曹吉祥有宠颛政，石亨益横；天顺三年后石亨以罪罢，未几有罪下狱死，曹吉祥亦以谋反诛；英宗晚年从李贤之言，始悟「夺门」非是，诏诸夺门冒功者许自首改正，是非乃渐明。
impact_zh_cn: 夺门之变以「迎复」之名矫杀社稷之臣，于谦、王文之死为明代第一大冤狱；此后天顺一朝宦官曹吉祥、武将石亨相继用事，英宗复辟之局反成内耗之源，明代君臣互信再受重创。
