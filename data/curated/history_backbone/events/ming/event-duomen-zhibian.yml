summary_zh_cn: 景泰八年（1457 年）正月，景泰帝病重，石亨、徐有贞、曹吉祥等发动政变，迎英宗自南宫复位（南宫复辟），改元天顺；景泰帝旋卒，于谦以"谋逆"罪名被杀（后获平反），政局随之反复。
