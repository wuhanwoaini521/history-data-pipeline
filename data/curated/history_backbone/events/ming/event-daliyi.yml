- target_event_id: event-duomen-zhibian
  relation_type: follows
  confidence: 0.5
  description_zh_cn: 大礼议为嘉靖朝初年政治核心议题。
background_zh_cn: 正德十六年武宗崩，无嗣，慈寿皇太后与大学士杨廷和定策，遣官以遗诏迎兴献王世子于兴邸；世子父兴献王祐杬，国安陆，正德十四年薨。帝即位未几，命礼臣集议兴献王封号，礼官援宋程颐议濮王礼，议考孝宗、称兴献王皇叔父，帝不允；杨廷和等抗疏力争，皆不听。
process_zh_cn: 进士张璁上疏言「继统不继嗣，请尊崇所生，立兴献王庙于京师」，帝得疏大喜曰「此论出，吾父子获全矣」；璁又著《大礼或问》上之，帝遂连驳礼官疏。十月，追尊父兴献王为兴献帝、祖母邵氏为皇太后、母妃为兴献后；既而命称孝宗皇考、兴献帝后为本生父母；杨廷和以议礼不合致仕，帝复追尊兴献帝为本生皇考恭穆献皇帝，大赦天下。
result_zh_cn: 大礼议以帝意得伸告终：十月追尊父兴献王为兴献帝，既而命称孝宗皇考、兴献帝后为本生父母；杨廷和等持礼之臣或罢或贬，张璁、桂萼、方献夫等以议礼骤贵，夏言继之，成为嘉靖前期内阁之新局，议礼诸臣遂执朝柄。
impact_zh_cn: 大礼议表面争「继统」「继嗣」之礼，实为嘉靖帝确立皇权自主、重组外廷之契机：持礼旧臣去而议礼新贵进，内阁与言路之势为之一变；此后世宗以制礼作乐自任，明代礼制与政治之关系愈密，而议礼一事遂为嘉靖一朝人事更迭之枢机。
