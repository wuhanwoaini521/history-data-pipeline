id: event-daliyi
name_zh_cn: 大礼议（嘉靖即位与礼制之争）
event_type: political
start_year: 1521
end_year: 1524
date_precision: range
period_id: period-ming
regime_ids:
- regime-ming
importance: major
summary_zh_cn: 正德十六年（1521 年），明世宗朱厚熜以兴献王世子入继大统，围绕生父尊号（皇考还是皇叔考）与廷臣展开"大礼之议"，历数年反复，议礼派在嘉靖三年（1524 年）胜出，世宗追尊兴献帝为皇考，朝局重新洗牌。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《明史·世宗纪》；现代参考：南炳文、汤纲《明史》（上海人民出版社）；孟森《明史讲义》（中华书局）；白寿彝总主编《中国通史·元明清卷》
