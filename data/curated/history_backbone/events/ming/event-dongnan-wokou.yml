  description_zh_cn: 正德嘉靖间的海防与内部动乱交织。

background_zh_cn: 嘉靖间倭患大起：海贼汪直纠倭寇濒海诸郡，自嘉靖三十一年二月倭犯温州始，通、泰、青、徐以至嘉兴、苏州皆被其害；三十三年官军围倭于南沙五阅月不克，倭溃围出转掠苏、松，东南财赋之地为之骚然。
process_zh_cn: 明廷先以南京兵部尚书张经总督军务讨倭，继用巡抚侍郎胡宗宪总督军务；胡宗宪用徐海、王直降将之策，三十四年李遂、胡宗宪破倭于刘家庄。後复征俞大猷、戚继光、刘显诸将合击，破之——戚继光练义乌兵、创鸳鸯阵，与俞大猷复兴化城，共破海倭，倭势始衰。
result_zh_cn: 东南倭寇次第荡平：胡宗宪破倭于刘家庄，戚继光、俞大猷破倭于福建、兴化，福建巡抚游震得以浙江温、处与福宁接壤、倭所出没，请进戚继光为副总兵守之，海防之制由此重整。
impact_zh_cn: 倭患既平，戚继光等列海防善后事、修城练兵，明代东南海防为一变；然倭乱起于海禁与互市之失，隆庆以后部分开海、银钱流通，东南海上之势力遂另开新局。
