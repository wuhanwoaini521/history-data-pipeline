summary_zh_cn: 嘉靖三十一年至四十四年（1552—1565 年），东南沿海倭患（与中国沿海海商集团、走私及日本武士有关）严重，明廷整顿海防，胡宗宪、戚继光、俞大猷等抗倭，嘉靖末年基本平定。本事件为 aggregate，子事件（诱诛王直、台州大捷）经
  part_of 关联。
