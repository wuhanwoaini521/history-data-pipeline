summary_zh_cn: 天命四年（1619 年），明辽东经略杨镐督四路大军征伐后金，努尔哈赤采取"凭尔几路来，我只一路去"之策，在萨尔浒（今辽宁抚顺东）先后各个击破明军，明军主力受创，辽东攻守之势倒转，明朝自此转入辽事防御。
