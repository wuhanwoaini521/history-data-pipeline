background_zh_cn: 万历四十六年，帝念辽警，召刘綎为左府佥书；明年二月，经略杨镐令綎及杜松、李如柏、马林四路出师——四路合击后金之策既定，而师期先泄、道险粮艰，诸将各不相统，胜败之数已分于庙算之时。
result_zh_cn: 萨尔浒大败、开原继陷之后，明廷以大理寺丞熊廷弼为兵部右侍郎兼右佥都御史经略辽东；明军主力尽丧，辽东战局由攻转守，后金之势遂不可遏，辽东遂为明末第一重务。
process_zh_cn: 四路分进：杜松遇大清兵于吉林崖，战死；马林败没于开原之役；刘綎一路「已深入三百里，杜松军覆犹不知」，遂为后金各个击破；杨镐闻杜松、马林师败，驰召綎及李如柏还——四路之师先后败没，萨尔浒遂为明军之覆师。
impact_zh_cn: 萨尔浒之战为明清易代第一役：明之四路丧师使辽东精锐尽失，此后加派辽饷、民困而流寇起，内外交病；后金由守转攻，二十余年间入关定鼎——论明之亡者必自萨尔浒始，其成败之数系于一代兴亡。
