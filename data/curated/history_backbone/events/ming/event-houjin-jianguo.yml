summary_zh_cn: 天命元年（1616 年）正月，努尔哈赤在赫图阿拉（今辽宁新宾）称汗建国，国号大金（史称后金），建元天命；后金是清朝的前身政权，与明朝并存，1618 年以"七大恨"对明宣战。
