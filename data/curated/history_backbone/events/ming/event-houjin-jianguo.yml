background_zh_cn: 建州三卫自永乐以来为明羁縻，天顺间边将即奏「建州三卫都督私与朝鲜结，恐为中国患」；建州长童仓尝避居朝鲜界而复还建州。万历间建州都督王杲以索降人不得，入掠抚顺，守将贾汝翼诘责之——建州与明之边衅渐起，努尔哈赤部遂乘之而兴。
process_zh_cn: 万历四十四年（1616年）努尔哈赤于赫图阿拉称汗建元，语料以「大清兵」纪其事：万历四十六年四月甲辰，大清兵克抚顺城，千总王命印死之；闰月，杨镐为兵部左侍郎兼右佥都御史，经略辽东；四十七年三月，杜松遇大清兵于吉林崖，战死。兴京之号后世犹存——清史稿记「诏以沈阳为天眷盛京，赫图阿拉城为天眷兴京」。
result_zh_cn: 抚顺既克，明廷以杨镐经略辽东，四路出师而萨尔浒大败，杜松战死；六月大清兵克开原，马林败没，乃以大理寺丞熊廷弼为兵部右侍郎兼右佥都御史经略辽东——辽东战守自此为明代第一重务，明军由攻转守。
impact_zh_cn: 后金既立，辽东攻守之势逆转：萨尔浒一战明军主力尽丧，开原继陷，明由进攻转为守御；此后二十余年间清兵数入塞，终有明清易代之事，而明廷竭天下之力以事辽东，民穷财尽，流寇乘之，内外交病。
