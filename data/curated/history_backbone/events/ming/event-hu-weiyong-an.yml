summary_zh_cn: 洪武十三年（1380 年），朱元璋以谋反罪族诛左丞相胡惟庸，随即罢中书省、废丞相制度，六部尚书直接对皇帝负责；此后内阁制逐步形成，皇权空前集中，是中国古代中枢制度的结构性变革。
