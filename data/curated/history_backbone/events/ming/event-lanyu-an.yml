summary_zh_cn: 洪武二十六年（1393 年），朱元璋以谋逆罪诛凉国公蓝玉，连坐诛杀功臣宿将，与胡惟庸案同为洪武朝两次大规模功臣清洗；开国勋贵集团自此凋零。
quality_status: reviewed
