background_zh_cn: 天启七年（1627年）八月熹宗崩，无嗣，遗诏以弟信王嗣位。时魏忠贤以司礼监秉笔提督东厂，与崔呈秀等结阉党，兴汪文言狱，逮杨涟、左光斗、魏大中、周朝瑞、顾大章等，削赵南星等籍，朝士善类一空。
process_zh_cn: 崇祯帝即位之初，先安置魏忠贤于凤阳，未几忠贤缢死于道；乃戮忠贤及其党崔呈秀尸，削其党冯铨、魏广微籍。崇祯二年，定逆案，自崔呈秀以下凡六等，阉党之局遂倾；又赠恤冤陷诸臣，被逮诸君子次第昭雪。
result_zh_cn: 魏忠贤既诛，其党六等定罪，生者戍夺、死者戮尸，阉党不复能祸朝政；汪文言狱所陷诸臣得赠恤，东林善类稍得伸眉。然门户之见已深，定逆案之后朝论益分，攻东林者转以「逆案」为口实相攻。
impact_zh_cn: 崇祯初政以诛阉、定案为始，一时号清明；然党争并未止息，十七年间阁臣屡易、边事日坏，终至李自成入京师、帝崩于万岁山，王承恩从死——明代之亡虽非阉祸直接所致，而朝局内耗实为长因之一。
