summary_zh_cn: 天启七年至崇祯四年（1627—1631 年），陕西连年旱灾、驿卒与边兵欠饷，王二、高迎祥、李自成等相继聚众起义，民变蔓延陕甘，明朝将全力剿抚，农民战争进入长期化。
