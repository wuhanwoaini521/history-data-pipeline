background_zh_cn: 万历间顾宪成罢官归无锡，与弟允成倡修东林书院——宋杨时讲道处——常州知府欧阳东凤与无锡知县林宰为之营构；宪成偕同志讲学其中，往往讽议朝政、裁量人物，士大夫闻风而附，由是东林名大著而忌者亦多。
process_zh_cn: 自万历争国本、辛亥京察、李三才之讼，至梃击、红丸、移宫三案，凡救李三才者、争京察者、发科场弊者、抗论张差梃击者、忤魏忠贤者，皆被指目为东林，抨击无虚日；御史徐兆魁、乔应甲等力排东林，与齐、楚、浙诸党声势相倚，大臣多畏避之。天启间魏忠贤用事，谳汪文言狱，逮杨涟、左光斗、魏大中、周朝瑞、顾大章等，削赵南星等籍，党祸遂烈。
result_zh_cn: 崇祯初定逆案，阉党既黜，然门户之见已深：继任阁臣张至发、薛国观皆不喜东林，所司不敢复奏；南明诸朝复以东林、复社与马阮之党相攻，党争与国祚相终始。
impact_zh_cn: 东林由书院讲学而成政治标目，党争自万历延至南明，凡京察、三案、逆案皆以门户为断，人才进退系于党派；明代士大夫政治之激化与内阁票拟、言路风宪之败坏于此可见，识者以为明亡之由之一。
