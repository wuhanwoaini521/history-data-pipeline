background_zh_cn: 恭闵惠皇帝讳允炆，太祖孙、懿文太子标第二子；洪武二十五年九月立为皇太孙——储位早定而诸王叔强大。
process_zh_cn: 洪武三十一年闰五月辛卯，允炆即皇帝位，改明年为建文元年，是为建文帝。
impact_zh_cn: 史臣论其世：「文皇少长习兵，据幽燕形胜之地，乘建文孱弱，长驱内向，奄有四海」——建文即位后试图约束诸王，终启靖难之役，皇统转入燕王一支。
