result_zh_cn: 即位次日大赦天下，以明年为建文元年；葬高皇帝于孝陵、诏行三年丧，并擢齐泰为本部尚书、黄子澄为太常卿同参军国事——建文初政以复古礼制与中枢更张为务，齐、黄二人遂为削藩谋主。
