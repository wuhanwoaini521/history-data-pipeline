background_zh_cn: 正统十四年（1449年）七月，瓦剌也先寇大同，参将吴浩战死，英宗下诏亲征；太监王振挟帝北行，尚书邝埜与于谦极谏而不听。八月，军次土木，瓦剌兵追至，师大溃，帝蒙尘而王振为乱兵所杀；败报至京，百官恸哭，京师大震，众莫知所为。
process_zh_cn: 郕王监国，命群臣议战守；侍讲徐珵言星象有变当南迁，于谦厉声曰「言南迁者，可斩也」，力主固守京师。谦请檄取两京、河南备操军，山东及南京沿海备倭军，江北及北京诸府运粮军亟赴京师，以次经画部署，人心稍安；又遣都督孙镗、卫颖、张軏等分兵守九门要地，列营郭外。十月，也先挟上皇破紫荆关直入，京师戒严；于谦亟分遣诸将，率师二十二万列阵九门外，自与石亨率副总兵范广、武兴陈德胜门外当也先。
result_zh_cn: 也先薄都城，都督高礼、毛福寿败之于彰义门，于谦、石亨等连败也先众于城下；相持五日，「也先邀请既不应，战又不利，知终弗可得志，又闻勤王师且至，恐断其归路，遂拥上皇由良乡西去」。景泰元年，杨善至瓦剌，也先许上皇归；「卒奉上皇以归，谦力也」。
impact_zh_cn: 京师解严而明室转危为安，于谦以社稷安危为己任、排众议而立郕王，景帝一朝战守之政皆本于此役；上皇虽还，南宫幽居，遂启八年后夺门之变之衅。此役亦为明廷南北两京备倭、备操军制的一次实战检验。
