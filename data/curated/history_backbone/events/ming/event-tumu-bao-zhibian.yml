background_zh_cn: 正统十四年，瓦剌也先贡马，王振减其直，使者恚而去；秋七月，也先大举入寇，王振挟帝亲征。成国公朱勇等白事咸膝行进，尚书邝埜、王佐忤振意罚跪草中，其党钦天监正彭德清以天象谏，振终弗从——军政尽出于宦寺，败征已见。
result_zh_cn: 败报闻，百官恸哭，都御史陈镒等廷奏振罪，给事中王竑等立击杀马顺及毛、王二中官；郕王命脔王山于市，并振党诛之，振族无少长皆斩；籍振家，得金银六十余库、玉盘百、珊瑚高六七尺者二十余株——土木之败使明廷精锐尽丧、英宗北狩。
process_zh_cn: 八月己酉，帝驻大同，振益欲北；镇守太监郭敬以敌势告，振始惧，乃班师。振初议道紫荆关、由蔚州邀帝幸其第，既恐蹂乡稼，复改道宣府——「军士纡回奔走，壬戌始次土木」；瓦剌兵追至，师大溃，帝蒙尘，振乃为乱兵所杀。
impact_zh_cn: 土木之变后明廷战守之局转为京师防御，于谦等立郕王而固守，明祚获安；然英宗北狩一年而还、南宫幽居，遂启八年后夺门之变，明廷自此由开国进取转为内敛守成，宦官之祸亦由此为朝野所切齿，边患与内争相寻。
