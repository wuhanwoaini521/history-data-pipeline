background_zh_cn: 甲戌，敕边将备瓦剌也先；秋七月己丑，也先寇大同、参将吴浩战死，英宗下诏亲征。
result_zh_cn: 张辅、陈瀛、邝野、曹鼐等从征文武皆死，帝北狩——明军精锐尽丧于土木堡。
process_zh_cn: 辛酉，次土木，被围。
impact_zh_cn: 皇太后命郕王监国；九月癸未，郕王即位、遥尊帝为太上皇帝，以明年为景泰元年——土木之变使明廷中枢更替、国防转入守势。
