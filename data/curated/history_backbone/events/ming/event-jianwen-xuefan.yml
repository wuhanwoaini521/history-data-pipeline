importance: major
summary_zh_cn: 建文元年（1399 年），建文帝用齐泰、黄子澄、方孝孺等议，先后废削周、齐、湘、代、岷诸王，矛头指向坐镇北平、拥兵十万的燕王朱棣，直接触发靖难之役。
quality_status: reviewed
source_type: curated_reference
source_reference: 古代史料：《明史·恭闵帝纪》；现代参考：南炳文、汤纲《明史》（上海人民出版社）；孟森《明史讲义》（中华书局）；白寿彝总主编《中国通史·元明清卷》
