  description_zh_cn: 削藩激起燕王举兵，是为靖难之役之起
background_zh_cn: 洪武三十一年太祖崩，皇太孙即位，命齐泰与黄子澄同参国政，寻进尚书；时诸王以叔父之尊拥兵边塞，周、齐、湘、代、岷诸王多不法，朝廷议削藩以固皇权，遂有次第废徙之举。
process_zh_cn: 建文元年（1399年）八月，周王橚有罪，废为庶人，徙云南；夏四月，湘王柏自焚死，齐王榑、代王桂并废为庶人，同时遣燕王世子高炽及其弟高煦、高燧还北平以安燕藩。既而诏让燕王棣，逮其王府官僚，削夺之意渐明；秋七月癸酉，燕王棣举兵反，杀布政使张昺、都司谢贵，以「诛齐泰、黄子澄」为名，号其众曰靖难之师。
result_zh_cn: 朝廷初贬齐泰、黄子澄于外以缓燕师，旋复召二人；南北转战四年，建文四年六月乙丑燕兵犯金川门，左都督徐增寿谋内应伏诛，宫中火起，帝不知所终——削藩之政以藩王入继告终。
impact_zh_cn: 建文削藩失败，燕王以「靖难」入承大统，是为成祖；有明一代藩禁自此大严，宗室不典兵、不预政，而永乐以后内阁与宦官之制亦由此开其端，明初政治格局为之一变。
