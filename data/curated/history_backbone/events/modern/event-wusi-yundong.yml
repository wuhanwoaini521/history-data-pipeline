summary_zh_cn: 1919 年 5 月 4 日，北京学生因巴黎和会山东问题举行游行示威，抗议北洋政府外交失败（"外争主权、内除国贼"口号），运动随后扩展到全国工商各界（三罢），北洋政府被迫拒签对德和约并罢免曹汝霖等；五四运动成为新文化运动与民族觉醒的标志性事件（史学通说）。
