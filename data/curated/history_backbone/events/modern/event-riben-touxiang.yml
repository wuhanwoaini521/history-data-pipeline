summary_zh_cn: 1945 年 8 月 15 日，日本天皇广播《终战诏书》宣布接受《波茨坦公告》并无条件投降；9 月 2 日日本签署投降书，9 月 9 日中国战区受降（南京）；中国抗日战争取得胜利，是世界反法西斯战争胜利的组成部分。
