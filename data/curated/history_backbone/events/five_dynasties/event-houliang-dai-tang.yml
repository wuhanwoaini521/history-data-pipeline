summary_zh_cn: 开平元年（907年）朱温废唐哀帝自立，国号梁（后梁），都汴州（开封），唐朝正式灭亡，中国历史进入五代十国时代。后梁代唐是唐末军阀政治的终点与五代中原政权更替的起点（§30：同时体现 Regime Transition）。
