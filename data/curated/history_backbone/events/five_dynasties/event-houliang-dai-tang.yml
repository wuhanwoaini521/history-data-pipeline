background_zh_cn: 黄巢乱后，朱全忠以宣武节度使起于汴：既平秦宗权，而「朱全忠连兵十万，吞噬河南，兖、郓、青、徐之间，血战不解」——唐祚之危已系于汴帅。全忠进位守中书令、进封东平王，又上表请以关东藩镇除用朝廷名德为节度观察使，朝政之权浸移于外。
result_zh_cn: 甲辰，唐昭宣帝降御札禅位于梁；庚戌，梁王始御金祥殿，受百官称臣，下书称教令，自称曰寡人；壬戌，梁王更名晃——唐祚三百年前后而终，后梁受禅而立，中国进入五代之世，中原五朝迭兴之局自此始。
process_zh_cn: 天祐四年正月，梁王休兵于贝州，以潞州内叛、威望大沮，「恐中外因此离心，欲速受禅以镇之」；宰相薛贻矩还言于帝曰「元帅有受禅之意矣」。唐大臣共奏请昭宣帝逊位，帝乃下诏以二月禅位于梁，又诏礼部尚书苏循赍百官诣大梁。
impact_zh_cn: 唐之亡使中原五朝迭兴、十国割据，直至宋初方复一统；朱全忠以藩镇之兵移唐祚，旧唐书史臣论曰「朱全忠连兵十万，吞噬河南……唐祚以至于亡」，为兵权下移则国祚随之之实例，五代武人政治之弊亦自此始。
