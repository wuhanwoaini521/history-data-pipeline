summary_zh_cn: 开运三年至四年（946—947年）后晋出帝背盟拒契丹，耶律德光大举南下，946年冬灭后晋、入开封，947年正月改国号为大辽（契丹—辽政权国号变化节点）。契丹虽旋即北返，但「契丹灭后晋」使中原政权首次被北方民族政权所灭。
