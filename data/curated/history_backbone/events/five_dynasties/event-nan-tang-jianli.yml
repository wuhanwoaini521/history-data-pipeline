summary_zh_cn: 昇元元年（937年）吴国权臣李昪（徐知诰）代吴称帝，国号唐（南唐），都金陵（今南京）。南唐继吴而兴，据有江淮，为十国中最强盛的政权之一，与中原后晋、后汉、后周长期对峙。
