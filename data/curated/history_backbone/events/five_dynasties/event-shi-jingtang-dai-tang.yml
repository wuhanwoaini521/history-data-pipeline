summary_zh_cn: 天福元年（936年）后唐河东节度使石敬瑭勾结契丹（耶律德光），以父礼事契丹并许诺割让燕云十六州，借契丹兵灭后唐，自称皇帝建国晋（后晋），都汴州。后晋是「儿皇帝」政治关系的产物。
