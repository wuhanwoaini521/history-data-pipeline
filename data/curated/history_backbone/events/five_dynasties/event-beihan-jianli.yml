summary_zh_cn: 乾祐四年（951年）郭威代汉，后汉宗室刘崇（刘旻）在太原称帝，国号仍称汉（北汉），依附契丹。北汉是十国中唯一地处北方、与中原政权对抗的政权，也是后来宋辽冲突的直接前台。
