summary_zh_cn: 正始十年（249年）正月，司马懿趁曹爽兄弟陪同少帝曹芳往高平陵祭陵之机，发动政变控制洛阳，收捕曹爽等并族诛，曹魏军政大权自此落入司马氏。高平陵之变是曹魏政权由曹氏向司马氏转移的决定性节点，也是三国史的重要转折。
