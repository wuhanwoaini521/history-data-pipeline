  description_zh_cn: 赤壁后多方力量继续发展为三国政权格局。
background_zh_cn: 备进住夏口，使诸葛亮诣权，权遣周瑜、程普等行——孙刘结盟共拒曹操，赤壁战云既合。
process_zh_cn: 瑜、普为左右督，各领万人，与备俱进，遇于赤壁，大破曹公军。
impact_zh_cn: 琦病死，群下推先主为荆州牧，治公安——赤壁之后刘备据荆州立足，三分之势自此肇基。
