  description_zh_cn: 北方力量南下使荆州成为争夺焦点。
background_zh_cn: 夏四月，曹操进军邺——袁氏根本之地，河北决战之地。
process_zh_cn: 公之去邺而南也，谭、尚争冀州，谭为尚所败、走保平原——袁氏兄弟阋墙，曹操乘之。
