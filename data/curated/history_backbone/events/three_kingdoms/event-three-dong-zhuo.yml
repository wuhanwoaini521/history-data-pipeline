  description_zh_cn: 董卓进京与诸侯割据先于官渡之战。
background_zh_cn: 何进召卓使将兵诣京师——外戚与宦官相争，董卓应召引兵向洛，祸乱之门自开。
process_zh_cn: 董卓至显阳苑，远见火起，知有变，引兵急进；未明到城西，闻帝在北，因与公卿往奉迎于北芒阪下。
impact_zh_cn: 癸酉，董卓使郎中令李儒鸩杀弘农王辩——废帝见杀，关东诸侯由此起兵，东汉中央权威崩解。
