summary_zh_cn: 建安十六年（211年），益州别驾张松与其党法正等因不满刘璋，劝说刘璋迎刘备入蜀以拒张鲁、曹公，实为引刘备入主益州之策。刘备遂率军溯江入蜀，开启对益州的争夺。
