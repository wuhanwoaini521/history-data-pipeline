summary_zh_cn: 初平元年（190年）正月，关东州郡推袁绍为盟主，集结联军讨伐董卓，曹操、袁术、公孙瓒等并起。联军内部分裂、各自观望，未能入关击卓，但董卓被迫迁都长安，东汉朝廷自此流离。
