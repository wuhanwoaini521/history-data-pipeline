summary_zh_cn: 建兴十二年（234年）诸葛亮率军出斜谷进驻五丈原，与司马懿对峙百余日，八月病逝于军中，"出师未捷身先死"。诸葛亮去世后蜀汉由姜维等主持北伐，蜀汉国力渐衰。
