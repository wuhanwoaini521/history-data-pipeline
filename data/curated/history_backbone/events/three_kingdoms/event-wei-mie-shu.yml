summary_zh_cn: 景元四年（263年）司马昭遣钟会、邓艾、诸葛绪三路伐蜀，邓艾偷渡阴平直取成都，刘禅出降，蜀汉灭亡。魏灭蜀使三国并立变为魏吴对峙，为司马氏代魏扫清最大障碍。
