summary_zh_cn: 延熙至景耀年间（约247—262年），姜维多次出兵北伐曹魏，虽屡有胜绩却耗损蜀汉国力，"费祎常制姜维"之说反映朝中分歧。姜维北伐延续蜀汉进取战略，但未能改变魏强蜀弱的总体格局。
