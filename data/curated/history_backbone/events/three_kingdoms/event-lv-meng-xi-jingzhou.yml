summary_zh_cn: 建安二十四年（219年）冬，孙权遣吕蒙、陆逊乘关羽北征之机，以"白衣渡江"袭取荆州（江陵），关羽退走麦城，被俘杀。荆州归吴、关羽身死，蜀汉元气大伤，孙刘联盟破裂，三国疆界自此定型。
