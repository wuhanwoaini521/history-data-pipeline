  description_zh_cn: 官渡后曹操集团继续巩固北方。
background_zh_cn: 曹操还军官渡，绍乃议攻许，田丰谏之以持久——袁绍倾河北之众南下，两雄决战在即。
process_zh_cn: 袁氏辎重万余乘在故市、乌巢，屯军无严备，曹操以轻兵袭之，不意而至、燔其积聚。
impact_zh_cn: 官渡之败使袁绍元气大伤，河北由盛转衰——曹操由此奠定统一北方之势。
