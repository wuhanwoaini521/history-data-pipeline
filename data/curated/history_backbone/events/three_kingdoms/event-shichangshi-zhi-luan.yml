summary_zh_cn: 中平六年（189年）汉灵帝去世，外戚何进谋诛宦官，召董卓等进京施压；宦官张让等先发制人杀何进，袁绍等率兵尽诛宦官，东汉宦官集团自此消灭。何进召边军入京与宫变失控，直接为董卓专权打开了大门。
