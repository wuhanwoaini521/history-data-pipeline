summary_zh_cn: 甘露五年（260年）魏帝曹髦不甘坐收，率宿卫攻司马昭府第，被贾充指使成济刺死。曹髦"司马昭之心，路人所知也"之语见于《汉晋春秋》。弑君事件显示司马氏废立已不可逆转，曹魏皇权名存实亡。
