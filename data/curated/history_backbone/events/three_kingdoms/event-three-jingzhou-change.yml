  description_zh_cn: 荆州局势变化推动孙刘军事合作。
background_zh_cn: 曹公南征表，会表卒，子琮代立、遣使请降——刘表之死与荆州易帜，中原兵锋直指江汉。
process_zh_cn: 过襄阳，诸葛亮说先主攻琮「荆州可有」；乃驻马呼琮，琮惧不能起。
impact_zh_cn: 二十年，孙权以先主已得益州，使使报欲得荆州；先主言「须得凉州，当以荆州相与」——借荆州之争自此成为孙刘联盟的裂痕。
