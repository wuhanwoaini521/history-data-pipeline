summary_zh_cn: 建安二十四年（219年）关羽自荆州北伐，围樊城、襄阳，水淹七军擒于禁、斩庞德，"威震华夏"，曹操一度欲迁都避之。关羽北伐是蜀汉势力扩张的顶点，也引发孙权袭荆州的后方危机。
