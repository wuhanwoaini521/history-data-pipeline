background_zh_cn: 冬，魏嗣王称尊号、改元为黄初——曹丕代汉，三国鼎立的第一块基石落定。
process_zh_cn: 先主即皇帝位于成都武担之南，国号汉（蜀汉）——汉室旗号重建于西南。
impact_zh_cn: 史评孙权「自擅江表，成鼎峙之业」——三国鼎立格局正式形成，与魏汉吴三方并立之局延续四十余年。
