summary_zh_cn: 建安二年（197年）袁术据淮南称帝，成为汉末群雄中第一个公然僭号称帝者。袁术称帝遭各方声讨，不久为吕布、曹操等所败，于199年忧愤病死。此事动摇了汉室残余权威，也开启了群雄自立之年。
