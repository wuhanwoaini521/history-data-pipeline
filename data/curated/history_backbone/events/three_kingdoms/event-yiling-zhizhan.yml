summary_zh_cn: 章武元年至二年（221—222年），刘备以复关羽之仇、夺荆州为名东征孙吴，陆逊在夷陵（今湖北宜昌一带）以逸待劳，火攻大破蜀军，刘备败退白帝城。夷陵之战巩固了吴对荆州的占有，三国疆界由此长期稳定。
