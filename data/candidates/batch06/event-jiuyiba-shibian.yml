id: event-jiuyiba-shibian
name_zh_cn: 九一八事变
event_type: war
start_year: 1931
end_year: 1931
date_precision: year
period_id: period-republic
importance: critical
summary_zh_cn: 1931 年 9 月 18 日夜，日本关东军自行炸毁沈阳柳条湖附近南满铁路并嫁祸中国军队，随即进攻沈阳北大营，占领沈阳及东北三省大部（九一八事变）；国民政府实行"不抵抗"方针（具体指令及责任为史学争论点），东北全境沦陷。
