summary_zh_cn: 1912 年 1 月中旬起，南北议和（袁世凯、伍廷芳等）达成协议，以清帝退位换取袁世凯出任临时大总统；1912 年 2 月 12 日宣统帝溥仪下诏退位，清朝结束，中国两千余年的帝制时代（国内史学通行表述）随之终结。
