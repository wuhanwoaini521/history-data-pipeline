id: event-nanjing-datusha
name_zh_cn: 南京大屠杀
event_type: war
start_year: 1937
end_year: 1938
date_precision: range
period_id: period-republic
importance: critical
summary_zh_cn: 1937 年 12 月 13 日南京陷落后，侵华日军在南京城区及周边持续数周大规模屠杀中国平民与战俘、强暴妇女并抢劫纵火（南京大屠杀）；关于遇难人数，中日与国际学界及战后审判档案存在不同统计口径（通行约
  30 万，具体数字仍是研究课题）；1946—1948 年南京审判/东京审判对此罪行予以认定。
