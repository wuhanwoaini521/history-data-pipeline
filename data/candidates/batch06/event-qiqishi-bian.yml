id: event-qiqishi-bian
name_zh_cn: 七七事变
event_type: war
start_year: 1937
end_year: 1937
date_precision: year
period_id: period-republic
importance: critical
summary_zh_cn: 1937 年 7 月 7 日夜，日军在北平西南卢沟桥演习时借口士兵失踪要求入城搜查，遭拒后进攻宛平城（七七事变），日军旋即丰台、北平、天津相继失守；七七事变标志着日本全面侵华战争开始，中国全国性抗战由此展开。
