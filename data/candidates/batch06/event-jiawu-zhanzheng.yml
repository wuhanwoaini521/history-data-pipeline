summary_zh_cn: 光绪二十至二十一年（1894—1895 年），日本以朝鲜东学党起义为契机出兵朝鲜，清军与日军在朝鲜、黄海、辽东、山东交战，北洋海军在黄海海战与威海卫之战中覆没，清军全面失败；1895
  年签订《马关条约》。本事件为 aggregate，子事件（黄海海战、威海卫之战、马关条约）经 part_of 关联。
