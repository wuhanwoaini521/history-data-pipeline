summary_zh_cn: 1936 年 12 月 12 日，张学良、杨虎城在西安扣留蒋介石，通电要求停止内战、一致抗日（西安事变，"兵谏"）；经各方调停，事变以蒋介石获释、主张停止内战转向抗日收束，成为时局转折点（史学通说）。
