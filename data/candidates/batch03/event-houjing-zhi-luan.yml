id: event-houjing-zhi-luan
name_zh_cn: 侯景之乱
event_type: war
start_year: 548
end_year: 552
date_precision: range
period_id: period-northern-southern
importance: critical
summary_zh_cn: 太清二年至承圣元年（548—552年），北魏降将侯景反梁，围建康、破台城，梁武帝饿死（549年），江南文物尽焚、人口锐减。侯景之乱是南朝由盛转衰的总爆发：梁朝统治瓦解、南朝再也无力抗衡北朝，并催生陈朝与北周、北齐南北格局的新一轮洗牌。
background_zh_cn: 太清二年至承圣元年（548—552年），北魏降将侯景反梁，围建康、破台城，梁武帝饿死（549年），江南文物尽焚、人口锐减。
result_zh_cn: 侯景之乱是南朝由盛转衰的总爆发：梁朝统治瓦解、南朝再也无力抗衡北朝，并催生陈朝与北周、北齐南北格局的新一轮洗牌。
