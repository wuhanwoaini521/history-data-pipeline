summary_zh_cn: 建德五年至六年（576—577年）周武帝亲率大军伐齐，破晋阳、克邺，北齐后主被俘，北齐灭亡，北周统一北方。北周灭北齐结束北方东西对峙，北方重归一统，为隋朝取代北周并统一全国铺平道路。
