summary_zh_cn: 武德元年（618年）五月，李渊在长安称帝，国号唐，隋恭帝禅让，隋朝正式灭亡。唐朝建立继隋之后开启中国历史上又一个强盛王朝，并迅速展开统一全国的战争。
