summary_zh_cn: 至正二十三年（1363 年）秋，朱元璋与陈友谅在鄱阳湖展开水军大会战，陈友谅中流矢死，汉军溃败，次年其子陈理降，长江中游尽归朱元璋；此战奠定朱元璋在南方群雄中的决定优势。
