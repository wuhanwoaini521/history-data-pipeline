summary_zh_cn: 顺治元年（1644 年）四月，吴三桂引清军入关，在山海关与大顺军李自成部交战，大顺军败退，清军随即进入北京；同年十月顺治帝迁都北京，清朝定鼎中原，明清易代完成。
