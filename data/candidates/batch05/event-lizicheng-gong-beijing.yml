summary_zh_cn: 崇祯十七年（1644 年）三月十九日，大顺军攻入北京，崇祯帝在煤山自缢，明朝中央政权覆亡；此后明朝宗室在南方建立南明诸政权（另有专记），清朝于同年入关。
