summary_zh_cn: 正统十四年（1449 年），瓦剌（蒙古西部）也先率军南犯，明英宗在宦官王振鼓动下亲征，八月于土木堡（今河北怀来东）被瓦剌军围歼，英宗被俘，明军精锐损失惨重，明朝由盛转衰的标志性事件。
