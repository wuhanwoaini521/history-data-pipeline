id: event-bawang-zhi-luan
name_zh_cn: 八王之乱
event_type: political-military
start_year: 291
end_year: 306
date_precision: range
period_id: period-western-jin
importance: critical
summary_zh_cn: 元康元年至光熙元年（291—306年），西晋宗室诸王（汝南王亮、楚王玮、赵王伦、齐王冏、长沙王乂、成都王颖、河间王颙、东海王越）围绕皇权反复混战，史称"八王之乱"。战乱使西晋国力耗竭、社会秩序崩坏，并直接诱发五部匈奴等北方民族力量起兵，最终导致西晋灭亡。
