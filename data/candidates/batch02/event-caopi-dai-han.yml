summary_zh_cn: 建安二十五年（220年）正月曹操去世，十月曹丕接受汉献帝禅让称帝，改元黄初，国号魏，东汉正式灭亡。曹丕代汉是三国鼎立格局在名分上的确立，也是"禅让"改朝模式的重要案例。
