summary_zh_cn: 靖康二年（1127 年），金军掳宋徽宗、钦宗二帝及后妃宗室大臣北去，北宋灭亡；史称靖康之变（靖康之难）。此前金已在开封册立伪楚（张邦昌），中原政权易主，宋朝宗室南迁。
