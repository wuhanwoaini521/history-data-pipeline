summary_zh_cn: 宝元元年（1038 年）十月，夏国王李元昊称帝建国，国号大夏（史称西夏），定都兴庆府（今宁夏银川），与北宋、辽成鼎足之势；此前元昊父祖（李继迁、李德明）已割据夏州、灵州一带。
