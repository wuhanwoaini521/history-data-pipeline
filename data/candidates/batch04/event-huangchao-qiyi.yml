summary_zh_cn: 乾符二年至中和四年（875—884年）黄巢领导唐末最大的农民起义：转战大半个中国，880年攻入长安、建大齐政权，884年兵败死于泰山。黄巢起义重创唐朝统治根基，使藩镇割据彻底军阀化，直接导向唐亡（aggregate，子事件见
  part_of）。
