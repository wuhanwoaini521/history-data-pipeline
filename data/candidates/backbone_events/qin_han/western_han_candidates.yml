# China History Backbone V1 · Batch 2 候选（Candidate）
version: backbone-candidates-v1
phase: Phase WH（西汉）
compiled_from: AI 依据通行秦汉史叙事（《史记》《汉书》《后汉书》+ 现代断代史研究）整理候选；候选进入 review，accepted 后才写入 data/curated/history_backbone/events/
flow: candidate → data/reviews/accepted/<event_id>.review.json → curated events/qin_han/
reused_events:
- event-qin-tongyi / event-qin-mie-liuguo / event-qin-mie-*（秦统一系列，chunqiu_zhanguo/）
- event-chuhan-qin-revolt / event-chuhan-julu / event-chuhan-qin-fall / event-hongmen / event-chuhan-pengcheng / event-chuhan-xingyang
  / event-chuhan-gaixia / event-chuhan-han-foundation / event-chuhan-later（楚汉 Story，qin_han/）
- event-three-yellow-turbans（黄巾起义，three_kingdoms/）
